<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collection データ救出</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f5f5f7;
  color:#333;
}

.box{
  max-width:620px;
  margin:auto;
  background:#fff;
  border-radius:22px;
  padding:26px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
  margin:0 0 18px;
  font-size:23px;
}

p{
  line-height:1.7;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#recover{
  background:#333;
  color:#fff;
}

#download{
  background:#e8e8e8;
  color:#333;
  display:none;
}

#result{
  margin-top:20px;
  padding:16px;
  border-radius:14px;
  background:#f2f2f2;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
  display:none;
}

.ok{
  color:#16803c;
}

.ng{
  color:#c62828;
}
</style>
</head>

<body>

<div class="box">

<h1>📦 Collection データ救出</h1>

<p>
前のCollectionに保存されているデータを探して、
見つかったデータをそのままバックアップします。
</p>

<p>
<strong>⚠️ 保存データを書き換えたり削除したりしません。</strong>
</p>

<button id="recover">
🔎 前のデータを探す
</button>

<button id="download">
💾 見つかったデータを保存する
</button>

<div id="result"></div>

</div>

<script>

const DB_NAME = "CollectionDB";
const STORE_NAME = "appData";
const DATA_KEY = "collectionData";

let recoveredData = null;

const result =
  document.getElementById("result");

const downloadButton =
  document.getElementById("download");


/* =========================
   結果表示
========================= */

function show(text,type=""){

  result.style.display = "block";
  result.className = type;
  result.textContent = text;

}


/* =========================
   IndexedDBを開く
========================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME);

    request.onerror = function(){

      reject(request.error);

    };

    request.onsuccess = function(){

      resolve(request.result);

    };

  });

}


/* =========================
   appDataからデータ取得
========================= */

function getData(db){

  return new Promise((resolve,reject)=>{

    if(!db.objectStoreNames.contains(STORE_NAME)){

      resolve(null);
      return;

    }

    try{

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.get(DATA_KEY);

      request.onsuccess = function(){

        resolve(request.result);

      };

      request.onerror = function(){

        reject(request.error);

      };

    }catch(error){

      reject(error);

    }

  });

}


/* =========================
   データの中身を取り出す
========================= */

function extractData(value){

  if(value === undefined || value === null){

    return null;

  }


  /*
    IndexedDBに
    { value: ... }
    で入っている場合
  */

  if(
    typeof value === "object" &&
    value !== null &&
    Object.prototype.hasOwnProperty.call(
      value,
      "value"
    )
  ){

    value = value.value;

  }


  /*
    JSON文字列として
    保存されている場合
  */

  if(typeof value === "string"){

    try{

      value = JSON.parse(value);

    }catch(error){

      /*
        JSONでない文字列なら
        そのままではバックアップ不能
      */

      return null;

    }

  }


  /*
    配列でもオブジェクトでも
    そのまま保持する
  */

  return value;

}


/* =========================
   データ検索
========================= */

document.getElementById("recover").onclick =
async function(){

  downloadButton.style.display = "none";

  show(
    "🔎 前のデータを探しています…"
  );

  try{

    const db = await openDB();

    const rawData =
      await getData(db);

    db.close();


    if(
      rawData === null ||
      rawData === undefined
    ){

      show(
        "❌ 前のデータが見つかりませんでした。\n\n"+
        "CollectionDB の appData / collectionData を確認しました。",
        "ng"
      );

      return;

    }


    recoveredData =
      extractData(rawData);


    if(
      recoveredData === null ||
      recoveredData === undefined
    ){

      show(
        "❌ データは見つかりましたが、内容を読み取れませんでした。",
        "ng"
      );

      return;

    }


    /*
      件数確認
    */

    let count = 0;

    if(Array.isArray(recoveredData)){

      count =
        recoveredData.length;

    }
    else if(
      recoveredData &&
      Array.isArray(
        recoveredData.characters
      )
    ){

      count =
        recoveredData.characters.length;

    }


    let json;

    try{

      json =
        JSON.stringify(
          recoveredData,
          null,
          2
        );

    }catch(error){

      show(
        "❌ データをJSONに変換できませんでした。\n\n"+
        error.message,
        "ng"
      );

      return;

    }


    /*
      ここではlocalStorageを
      一切使わない！！
    */

    window.__collectionBackupJSON =
      json;


    const sizeMB =
      (
        new Blob([json]).size /
        1024 /
        1024
      ).toFixed(1);


    show(
      "✅ 前のデータを見つけました！！\n\n"+
      "キャラクター数：約 " +
      count +
      "\n"+
      "バックアップサイズ：約 " +
      sizeMB +
      " MB\n\n"+
      "「💾 見つかったデータを保存する」を押してください。\n\n"+
      "⚠️ このページでは既存データを変更・削除していません。",
      "ok"
    );


    downloadButton.style.display =
      "block";


  }catch(error){

    console.error(error);

    show(
      "❌ データ検索中にエラーが発生しました。\n\n"+
      error.name +
      "\n"+
      error.message,
      "ng"
    );

  }

};


/* =========================
   JSONとして保存
========================= */

downloadButton.onclick = function(){

  if(!window.__collectionBackupJSON){

    show(
      "❌ 保存するデータがありません。",
      "ng"
    );

    return;

  }


  try{

    const blob =
      new Blob(
        [
          window.__collectionBackupJSON
        ],
        {
          type:"application/json"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "Collection_backup.json";

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      3000
    );


    show(
      "✅ バックアップファイルを作成しました！！\n\n"+
      "ファイル名：Collection_backup.json\n\n"+
      "iPhoneの場合は、表示されたファイルを\n"+
      「ファイルに保存」してください。\n\n"+
      "このファイルが確認できるまで、新しいCollectionには入れ替えないでください。",
      "ok"
    );


  }catch(error){

    console.error(error);

    show(
      "❌ ファイル保存中にエラーが発生しました。\n\n"+
      error.name +
      "\n"+
      error.message,
      "ng"
    );

  }

};

</script>

</body>
</html>

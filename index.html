<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f6f6;
  color:#555;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  background:#fff;
  padding:30px 20px 25px;
  border-bottom:1px solid #e5e5e5;
}

h1{
  margin:0;
  font-size:30px;
  color:#444;
}

main{
  max-width:800px;
  margin:auto;
  padding:28px 16px 60px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.add-main{
  width:100%;
  padding:18px;
  border-radius:18px;
  background:#999;
  color:#fff;
  font-size:19px;
  margin-bottom:24px;
}

.character-list,
.pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.character-card,
.pattern-card{
  background:#fff;
  border-radius:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
  overflow:hidden;
}

.character-card{
  padding:14px;
}

.char-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
  display:block;
}

.char-name{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
  color:#444;
}

.char-color{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
  vertical-align:middle;
}

.back{
  background:#fff;
  border-radius:12px;
  padding:10px 15px;
  margin-bottom:18px;
  color:#666;
}

.character-head{
  background:#fff;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  border-left:8px solid var(--theme,#aaa);
}

.character-title{
  font-size:25px;
  font-weight:bold;
  color:#444;
}

.character-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#eee;
  color:#555;
}

.action.theme{
  background:var(--theme,#999);
  color:#fff;
}

.priority-legend{
  margin-top:10px;
  padding:9px 11px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:11px;
  color:#888;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
}

.priority-legend-title{
  font-weight:bold;
  color:#666;
}

.pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.pattern-empty{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#aaa;
}

.pattern-info{
  padding:12px;
}

.pattern-name{
  font-weight:bold;
  color:#444;
  font-size:16px;
  word-break:break-word;
}

.goods-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.goods-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#f7f7f7;
  border-radius:9px;
  font-size:13px;
  min-width:0;
  user-select:none;
  touch-action:pan-y;
}

.goods-thumb{
  width:38px;
  height:38px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.goods-name{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.25;
}

.goods-actions{
  display:flex;
  align-items:center;
  gap:2px;
  flex:none;
}

.priority-mark{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  padding:0;
  flex:none;
  font-size:18px;
  line-height:1;
  color:#777;
}

.priority-mark.priority-1{
  color:#777;
}

.priority-mark.priority-2{
  color:#e6b400;
}

.goods-edit{
  width:25px;
  height:27px;
  padding:0;
  background:none;
  color:#999;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.goods-delete{
  width:22px;
  height:27px;
  padding:0;
  background:none;
  color:#999;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

.pattern-priority{
  position:absolute;
  right:9px;
  top:8px;
  background:rgba(255,255,255,.92);
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-buttons button{
  flex:1;
  padding:7px 3px;
  border-radius:8px;
  background:#eee;
  color:#666;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:40px 10px;
}

/* =========================
   モーダル
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
  color:#444;
}

label{
  display:block;
  font-size:13px;
  margin:14px 0 6px;
  color:#777;
}

input[type=text],
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  background:#fff;
}

input[type=file]{
  width:100%;
  margin-bottom:8px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:12px;
  background:#f5f5f5;
  margin-top:8px;
  display:none;
}

.color-picker-area{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#f7f7f7;
  border-radius:14px;
}

#characterColor{
  width:58px;
  height:58px;
  padding:0;
  border:0;
  border-radius:12px;
}

.color-code-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}

.color-preview{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid #ddd;
  flex:none;
}

#characterColorHex{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:13px;
  border-radius:11px;
}

.cancel{
  background:#eee;
  color:#666;
}

.save{
  background:#777;
  color:#fff;
}

.delete{
  background:#f0dddd;
  color:#a55;
}

/* =========================
   画像拡大
========================= */

.photo-view{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.photo-view.show{
  display:flex;
}

.photo-view img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.close-photo{
  position:fixed;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#fff;
  font-size:25px;
}

/* =========================
   スクショ
========================= */

.screenshot-page{
  background:#fff;
  border-radius:24px;
  padding:18px 10px 22px;
}

.screenshot-title{
  text-align:center;
  font-size:28px;
  color:#777;
  margin:0 0 24px;
  font-weight:500;
}

.screenshot-legend{
  margin:0 0 22px;
  padding:16px 12px;
  background:#f7f7f7;
  border-radius:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  font-size:20px;
  color:#777;
}

.shot-controls{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.shot-controls button{
  flex:1;
  padding:10px;
  border-radius:11px;
  background:#eee;
  color:#666;
}

.shot-controls button.active{
  background:#888;
  color:#fff;
}

/* 種類選択 */

.shot-type-picker{
  background:#f7f7f7;
  border-radius:16px;
  padding:12px;
  margin-bottom:16px;
}

.shot-type-title{
  font-size:13px;
  font-weight:bold;
  color:#666;
  margin-bottom:9px;
}

.shot-type-buttons{
  display:flex;
  gap:7px;
  margin-bottom:9px;
}

.shot-type-buttons button{
  flex:1;
  padding:7px;
  border-radius:9px;
  background:#e7e7e7;
  color:#666;
  font-size:12px;
}

.shot-type-checks{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.shot-type-check{
  display:flex;
  align-items:center;
  gap:7px;
  margin:0;
  padding:9px 10px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:12px;
  color:#666;
  min-width:0;
}

.shot-type-check input{
  width:18px;
  height:18px;
  flex:none;
  accent-color:#777;
}

.shot-type-check span{
  min-width:0;
  overflow-wrap:anywhere;
}

.shot-type-note{
  margin-top:8px;
  font-size:11px;
  color:#aaa;
}

/* =========================
   スクショ本体
   ここは2列固定
========================= */

.shot-pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.shot-pattern-card{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);
  gap:14px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:22px;
  background:#fff;
}

.shot-pattern-left{
  min-width:0;
}

.shot-pattern-image,
.shot-pattern-empty{
  width:100%;
  aspect-ratio:1;
  border-radius:15px;
  background:#eee;
}

.shot-pattern-image{
  object-fit:cover;
  display:block;
}

.shot-pattern-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}

.shot-pattern-name{
  font-size:18px;
  line-height:1.15;
  font-weight:bold;
  color:#444;
  margin-top:12px;
  word-break:break-word;
}

.shot-goods-side{
  min-width:0;
}

.shot-goods-title{
  display:inline-block;
  background:#f0f3f5;
  border-radius:20px;
  padding:8px 13px;
  font-size:16px;
  color:#666;
  margin:2px 0 10px;
}

.shot-goods-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.shot-goods-item{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  padding:8px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 1px 5px rgba(0,0,0,.06);
}

.shot-goods-image{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
  flex:none;
}

.shot-goods-name{
  flex:1;
  min-width:0;
  font-size:16px;
  line-height:1.25;
  color:#444;
  word-break:break-word;
}

.shot-goods-priority{
  width:35px;
  flex:none;
  text-align:center;
  font-size:27px;
}

.screenshot-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.screenshot-actions button{
  flex:1;
  padding:13px;
  border-radius:12px;
  background:#eee;
  color:#666;
}

.screenshot-actions .save-shot{
  background:#777;
  color:#fff;
}

.screenshot-empty{
  grid-column:1/-1;
  text-align:center;
  color:#aaa;
  padding:35px 10px;
}

/* =========================
   スマホ
   スクショも2列のまま
========================= */

@media(max-width:600px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .screenshot-page{
    padding:14px 4px 18px;
  }

  .screenshot-title{
    font-size:25px;
    margin-bottom:18px;
  }

  .screenshot-legend{
    font-size:17px;
    gap:10px;
    padding:13px 8px;
  }

  /* ここ重要：スマホでも2列 */
  .shot-pattern-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .shot-pattern-card{
    grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
    gap:9px;
    padding:9px;
    border-radius:17px;
  }

  .shot-pattern-name{
    font-size:16px;
    margin-top:8px;
  }

  .shot-goods-title{
    font-size:14px;
    padding:7px 10px;
  }

  .shot-goods-item{
    padding:6px;
    gap:6px;
  }

  .shot-goods-image{
    width:40px;
    height:40px;
  }

  .shot-goods-name{
    font-size:14px;
  }

  .shot-goods-priority{
    font-size:24px;
    width:29px;
  }

  .goods-name{
    font-size:12px;
  }

  .goods-item{
    gap:5px;
    padding:6px;
  }

  .goods-thumb{
    width:34px;
    height:34px;
  }

  .goods-edit{
    width:22px;
    font-size:13px;
  }

  .goods-delete{
    width:19px;
  }

  .priority-mark{
    width:23px;
    font-size:17px;
  }
}

@media(max-width:420px){

  .character-list,
  .pattern-grid{
    gap:10px;
  }

  .small-buttons button{
    font-size:11px;
  }

  .shot-pattern-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .shot-pattern-card{
    gap:6px;
    padding:7px;
    border-radius:15px;
  }

  .shot-pattern-name{
    font-size:13px;
  }

  .shot-goods-title{
    font-size:11px;
    padding:6px 8px;
  }

  .shot-goods-item{
    gap:4px;
    padding:4px;
    border-radius:9px;
  }

  .shot-goods-image{
    width:27px;
    height:27px;
    border-radius:5px;
  }

  .shot-goods-name{
    font-size:9px;
  }

  .shot-goods-priority{
    width:18px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>
</header>

<main id="app"></main>

<!-- キャラ -->
<div class="modal-bg" id="characterModal">
  <div class="modal">

    <h2 id="characterModalTitle">キャラを追加</h2>

    <label>キャラ名</label>
    <input id="characterName" type="text" placeholder="例：月永レオ">

    <label>画像</label>
    <input id="characterImage" type="file" accept="image/*">
    <img id="characterPreview" class="preview">

    <label>テーマカラー</label>

    <div class="color-picker-area">
      <input id="characterColor" type="color" value="#aaaaaa">

      <div class="color-code-area">
        <span
          id="colorPreview"
          class="color-preview"
          style="background:#aaaaaa"
        ></span>

        <input
          id="characterColorHex"
          type="text"
          value="#AAAAAA"
          maxlength="7"
        >
      </div>
    </div>

    <div class="modal-buttons">
      <button class="cancel" data-action="close-character">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteCharacterButton"
        data-action="delete-character"
        style="display:none"
      >
        🗑️ 削除
      </button>

      <button class="save" data-action="save-character">
        保存
      </button>
    </div>

  </div>
</div>

<!-- 絵柄 -->
<div class="modal-bg" id="patternModal">
  <div class="modal">

    <h2 id="patternModalTitle">絵柄を追加</h2>

    <label>絵柄名</label>
    <input
      id="patternName"
      type="text"
      placeholder="例：ハフアニ"
    >

    <label>画像</label>
    <input id="patternImage" type="file" accept="image/*">
    <img id="patternPreview" class="preview">

    <div class="modal-buttons">

      <button class="cancel" data-action="close-pattern">
        キャンセル
      </button>

      <button
        class="delete"
        id="deletePatternButton"
        data-action="delete-pattern-modal"
        style="display:none"
      >
        🗑️ 削除
      </button>

      <button class="save" data-action="save-pattern">
        保存
      </button>

    </div>

  </div>
</div>

<!-- グッズ -->
<div class="modal-bg" id="goodsModal">
  <div class="modal">

    <h2 id="goodsModalTitle">グッズを追加</h2>

    <label>グッズ名</label>
    <input
      id="goodsName"
      type="text"
      placeholder="例：チェキノーマル"
    >

    <label>種類</label>
    <input
      id="goodsType"
      type="text"
      placeholder="例：チェキ / 缶バッジ / ぱしゃっつ"
    >

    <label>画像</label>
    <input id="goodsImage" type="file" accept="image/*">
    <img id="goodsPreview" class="preview">

    <label>優先度</label>

    <select id="goodsPriority">
      <option value="0">☆ 通常</option>
      <option value="1">★ 優先</option>
      <option value="2">⭐️ 最優先</option>
    </select>

    <div class="modal-buttons">

      <button class="cancel" data-action="close-goods">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteGoodsButton"
        data-action="delete-goods"
        style="display:none"
      >
        🗑️ 削除
      </button>

      <button class="save" data-action="save-goods">
        保存
      </button>

    </div>

  </div>
</div>

<!-- 画像拡大 -->
<div class="photo-view" id="photoView">
  <button class="close-photo" data-action="close-photo">
    ×
  </button>

  <img id="photoLarge">
</div>

<script>
(function(){
"use strict";

/* ========================================
   データ
======================================== */

const KEY = "collectionData";

let data = [];

let currentCharacter = null;

let editingCharacter = -1;
let editingPattern = -1;
let editingGoods = -1;

let screenshotCharacter = -1;
let screenshotMode = "all";

/* 種類別のチェック */
let screenshotSelectedTypes = new Set();

const app = document.getElementById("app");


/* ========================================
   優先度
======================================== */

function normP(v){

  if(v === true) return 2;

  if(v === false || v == null) return 0;

  v = Number(v);

  if(v >= 2) return 2;

  if(v === 1) return 1;

  return 0;
}

function mark(v){

  v = normP(v);

  if(v === 2) return "⭐️";

  if(v === 1) return "★";

  return "☆";
}

function nextP(v){

  return (normP(v) + 1) % 3;
}


/* ========================================
   データ整形
======================================== */

function ng(g){

  if(typeof g === "string"){

    return {
      name:g,
      image:"",
      priority:0,
      type:"未分類"
    };

  }

  g = g || {};

  return {
    name:String(g.name || ""),
    image:typeof g.image === "string" ? g.image : "",
    priority:normP(g.priority),
    type:String(
      g.type ||
      g.goodsType ||
      "未分類"
    )
  };
}

function np(p){

  p = p || {};

  return {
    name:String(p.name || ""),
    image:typeof p.image === "string" ? p.image : "",
    priority:normP(p.priority),
    goods:Array.isArray(p.goods)
      ? p.goods.map(ng)
      : []
  };
}

function nc(c){

  c = c || {};

  return {
    name:String(c.name || ""),
    image:typeof c.image === "string" ? c.image : "",
    color:c.color || "#aaaaaa",
    patterns:Array.isArray(c.patterns)
      ? c.patterns.map(np)
      : []
  };
}


/* ========================================
   読み込み・保存
======================================== */

function load(){

  try{

    const x = JSON.parse(
      localStorage.getItem(KEY) || "[]"
    );

    return Array.isArray(x)
      ? x.map(nc)
      : [];

  }catch(e){

    return [];
  }
}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );

    return true;

  }catch(e){

    alert(
      "保存できませんでした。\n" +
      "画像が大きすぎる可能性があります。"
    );

    return false;
  }
}


/* ========================================
   HTMLエスケープ
======================================== */

function esc(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ========================================
   色
======================================== */

function color(c){

  if(
    typeof c === "string" &&
    /^#[0-9a-fA-F]{6}$/.test(c)
  ){

    return c;
  }

  return ({
    赤:"#e57373",
    ピンク:"#f48fb1",
    オレンジ:"#ffb74d",
    黄色:"#fff176",
    緑:"#81c784",
    水色:"#80cbc4",
    青:"#64b5f6",
    紫:"#9575cd",
    茶色:"#a1887f",
    黒:"#555555",
    白:"#dddddd",
    グレー:"#aaaaaa"
  })[c] || "#aaaaaa";
}


/* ========================================
   画像圧縮
======================================== */

function compress(file){

  return new Promise(resolve=>{

    if(!file){
      resolve("");
      return;
    }

    const fr = new FileReader();

    fr.onload = ()=>{

      const im = new Image();

      im.onload = ()=>{

        const max = 600;

        let w = im.width;
        let h = im.height;

        if(w > max || h > max){

          if(w > h){

            h = Math.round(h * max / w);
            w = max;

          }else{

            w = Math.round(w * max / h);
            h = max;
          }
        }

        const cv = document.createElement("canvas");

        cv.width = w;
        cv.height = h;

        cv
          .getContext("2d")
          .drawImage(im,0,0,w,h);

        resolve(
          cv.toDataURL(
            "image/jpeg",
            .72
          )
        );
      };

      im.onerror = ()=>{
        resolve(fr.result);
      };

      im.src = fr.result;
    };

    fr.onerror = ()=>{
      resolve("");
    };

    fr.readAsDataURL(file);
  });
}

  if(!/^#[0-9a-fA-F]{6}$/.test(v)){
    v = "#aaaaaa";
  }

  document.getElementById(
    "characterColor"
  ).value = v;

  document.getElementById(
    "characterColorHex"
  ).value = v.toUpperCase();

  document.getElementById(
    "colorPreview"
  ).style.background = v;

async function saveChar(){

  const n =
    document.getElementById(
      "characterName"
    ).value.trim();

  if(!n){

    alert("キャラ名を入力してね！");
    return;
  }

  let co =
    document.getElementById(
      "characterColor"
    ).value;

  const hex =
    document.getElementById(
      "characterColorHex"
    ).value.trim();

  if(/^#[0-9a-fA-F]{6}$/.test(hex)){
    co = hex;
  }

  const f =
    document.getElementById(
      "characterImage"
    ).files[0];

  let im =
    editingCharacter >= 0
    ? (data[editingCharacter].image || "")
    : "";

  if(f){
    im = await compress(f);
  }

  if(editingCharacter < 0){

    data.push({
      name:n,
      image:im,
      color:co,
      patterns:[]
    });

  }else{

    data[editingCharacter] = {
      name:n,
      image:im,
      color:co,
      patterns:
        data[editingCharacter].patterns || []
    };
  }

  save();

  modal("characterModal",false);

  currentCharacter = null;

  render();
}

function getScreenshotTypes(){

  const c = data[screenshotCharacter];

  if(!c) return [];

  const types = [];

  c.patterns.forEach(p=>{

    p.goods.forEach(g=>{

      const t =
        String(
          g.type ||
          "未分類"
        ).trim();

      if(
        t &&
        !types.includes(t)
      ){

        types.push(t);
      }
    });

  });

  return types;
}

      "ページを再読み込みしてね。"
    );

    document.querySelector(
      ".screenshot-page"
    );

  try{

    const cv =
      await html2canvas(el,{
        backgroundColor:"#fff",
        scale:2,
        useCORS:true,
        logging:false
      });

    const a =
      document.createElement("a");

    a.download =
      "Collection_求め絵柄まとめ.png";

    a.href =
      cv.toDataURL("image/png");

    a.click();

  }catch(e){

    console.error(e);

    alert(
      "画像の保存に失敗しました。"
    );
  }
}


/* ========================================
   画像プレビュー
======================================== */

function preview(input,img){

  input.onchange = ()=>{

    const f = input.files[0];

    if(!f){

      img.style.display = "none";

      return;
    }

    const r = new FileReader();

    r.onload = ()=>{

      img.src = r.result;

      img.style.display = "block";
    };

    r.readAsDataURL(f);
  };
}


/* ========================================
   クリック処理
======================================== */

document.addEventListener(
  "click",
  e=>{

    const t = e.target;


    /* 画像 */
    if(t.dataset.photo){

      show(t.dataset.photo);

      return;
    }


    /* キャラカード */
    const card =
      t.closest("[data-character]");

    if(
      card &&
      !t.closest("button")
    ){

      currentCharacter =
        Number(
          card.dataset.character
        );

      detail();

      return;
    }


    const b =
      t.closest("[data-action]");

    if(!b) return;

    const a =
      b.dataset.action;


    if(a === "add-character"){

      openChar(-1);

    }else if(a === "close-character"){

      modal(
        "characterModal",
        false
      );

    }else if(a === "save-character"){

      saveChar();

    }else if(a === "delete-character"){

      delChar();

    }else if(a === "back"){

      currentCharacter = null;

      render();

    }else if(a === "edit-character"){

      openChar(currentCharacter);

    }else if(a === "add-pattern"){

      openPattern(-1);

    }else if(a === "close-pattern"){

      modal(
        "patternModal",
        false
      );

    }else if(a === "save-pattern"){

      savePattern();

    }else if(a === "edit-pattern"){

      openPattern(
        Number(b.dataset.pattern)
      );

    }else if(a === "delete-pattern"){

      delPattern(
        Number(b.dataset.pattern)
      );

    }else if(a === "delete-pattern-modal"){

      delPattern(editingPattern);

      modal(
        "patternModal",
        false
      );

    }else if(
      a === "toggle-pattern-priority"
    ){

      const p =
        data[currentCharacter]
          .patterns[
            Number(b.dataset.pattern)
          ];

      p.priority =
        nextP(p.priority);

      save();

      detail();

    }else if(a === "add-goods"){

      openGoods(
        Number(b.dataset.pattern),
        -1
      );

    }else if(a === "edit-goods"){

      openGoods(
        Number(b.dataset.pattern),
        Number(b.dataset.goods)
      );

    }else if(a === "close-goods"){

      modal(
        "goodsModal",
        false
      );

    }else if(a === "save-goods"){

      saveGoods();

    }else if(a === "delete-goods"){

      delGoods();

    }else if(a === "delete-goods-direct"){

      delGoodsDirect(
        Number(b.dataset.pattern),
        Number(b.dataset.goods)
      );

    }else if(
      a === "toggle-goods-priority"
    ){

      const g =
        data[currentCharacter]
          .patterns[
            Number(b.dataset.pattern)
          ]
          .goods[
            Number(b.dataset.goods)
          ];

      g.priority =
        nextP(g.priority);

      save();

      detail();

    }else if(a === "open-screenshot"){

      shot("all");

    }else if(a === "open-type-screenshot"){

      shot("type");

    }else if(a === "shot-all"){

      screenshotMode = "all";

      screenshotSelectedTypes =
        new Set(
          getScreenshotTypes()
        );

      renderShot();

    }else if(a === "shot-type"){

      screenshotMode = "type";

      screenshotSelectedTypes =
        new Set(
          getScreenshotTypes()
        );

      renderShot();

    }else if(a === "shot-type-all"){

      screenshotSelectedTypes =
        new Set(
          getScreenshotTypes()
        );

      renderShot();

    }else if(a === "shot-type-none"){

      screenshotSelectedTypes =
        new Set();

      renderShot();

    }else if(a === "close-screenshot"){

      currentCharacter =
        screenshotCharacter;

      render();

    }else if(a === "save-screenshot"){

      saveShot();

    }else if(a === "close-photo"){

      closePhoto();
    }

  }
);


/* ========================================
   チェックボックス変更
======================================== */

document.addEventListener(
  "change",
  e=>{

    const input =
      e.target.closest(
        "[data-shot-type-index]"
      );

    if(!input) return;

    const types =
      getScreenshotTypes();

    const index =
      Number(
        input.dataset.shotTypeIndex
      );

    const type =
      types[index];

    if(!type) return;

    if(input.checked){

      screenshotSelectedTypes.add(
        type
      );

    }else{

      screenshotSelectedTypes.delete(
        type
      );
    }

    renderShot();
  }
);


/* ========================================
   画像表示
======================================== */

function show(src){

  if(!src) return;

  document.getElementById(
    "photoLarge"
  ).src = src;

  document.getElementById(
    "photoView"
  ).classList.add("show");
}

function closePhoto(){

  document.getElementById(
    "photoView"
  ).classList.remove("show");
}


/* ========================================
   カラー入力
======================================== */

document.getElementById(
  "characterColor"
).oninput = function(){

  const v =
    this.value.toUpperCase();

  document.getElementById(
    "characterColorHex"
  ).value = v;

  document.getElementById(
    "colorPreview"
  ).style.background = v;
};


document.getElementById(
  "characterColorHex"
).oninput = function(){

  let v =
    this.value.trim();

  if(!v.startsWith("#")){
    v = "#" + v;
  }

  if(
    /^#[0-9a-fA-F]{6}$/.test(v)
  ){

    v = v.toUpperCase();

    document.getElementById(
      "characterColor"
    ).value = v;

    document.getElementById(
      "colorPreview"
    ).style.background = v;
  }
};


/* ========================================
   モーダル外クリック
======================================== */

document
  .querySelectorAll(".modal-bg")
  .forEach(x=>{

    x.onclick = e=>{

      if(e.target === x){

        x.classList.remove("show");
      }
    };
  });


/* ========================================
   画像プレビュー
======================================== */

preview(
  document.getElementById(
    "characterImage"
  ),
  document.getElementById(
    "characterPreview"
  )
);

preview(
  document.getElementById(
    "patternImage"
  ),
  document.getElementById(
    "patternPreview"
  )
);

preview(
  document.getElementById(
    "goodsImage"
  ),
  document.getElementById(
    "goodsPreview"
  )
);


/* ========================================
   長押し・右クリック削除
======================================== */

let timer = null;
let target = null;

function cancel(){

  if(timer){
    clearTimeout(timer);
  }

  timer = null;
  target = null;
}

document.addEventListener(
  "touchstart",
  e=>{

    const x =
      e.target.closest(
        ".goods-item"
      );

    if(
      !x ||
      e.target.closest("button") ||
      e.target.closest("img")
    ){

      return;
    }

    cancel();

    target = x;

    timer =
      setTimeout(()=>{

        const pi =
          Number(
            target.dataset.goodsPattern
          );

        const gi =
          Number(
            target.dataset.goodsIndex
          );

        const g =
          data[currentCharacter]
            ?.patterns[pi]
            ?.goods[gi];

        if(
          g &&
          confirm(
            `「${g.name}」を削除する？`
          )
        ){

          data[currentCharacter]
            .patterns[pi]
            .goods
            .splice(gi,1);

          save();

          detail();
        }

        cancel();

      },800);

  },
  {passive:true}
);

document.addEventListener(
  "touchend",
  cancel,
  {passive:true}
);

document.addEventListener(
  "touchmove",
  cancel,
  {passive:true}
);

document.addEventListener(
  "contextmenu",
  e=>{

    const x =
      e.target.closest(
        ".goods-item"
      );

    if(
      !x ||
      e.target.closest("button") ||
      e.target.closest("img")
    ){

      return;
    }

    e.preventDefault();

    const pi =
      Number(
        x.dataset.goodsPattern
      );

    const gi =
      Number(
        x.dataset.goodsIndex
      );

    const g =
      data[currentCharacter]
        ?.patterns[pi]
        ?.goods[gi];

    if(
      g &&
      confirm(
        `「${g.name}」を削除する？`
      )
    ){

      data[currentCharacter]
        .patterns[pi]
        .goods
        .splice(gi,1);

      save();

      detail();
    }

  }
);


/* ========================================
   起動
======================================== */

data = load();

render();

})();
</script>

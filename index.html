<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#555;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif
}

header{
  padding:24px 20px 18px;
  background:#fff;
  border-bottom:1px solid #e9e9e9
}

h1{
  margin:0;
  font-size:22px;
  color:#444
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px 14px 40px
}

button{
  border:0;
  border-radius:10px;
  background:#8d8d8d;
  color:#fff;
  padding:10px 15px;
  font-size:14px
}

.add{
  width:100%;
  margin-bottom:16px
}

.back{
  background:#e7e7e7;
  color:#666;
  margin-bottom:14px
}

.hidden{
  display:none!important
}

.chars{
  display:flex;
  flex-direction:column;
  gap:10px
}

.char{
  background:#fff;
  border:1px solid #ededed;
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px
}

.char img,
.noimg{
  width:68px;
  height:68px;
  object-fit:cover;
  border-radius:10px;
  background:#eee;
  flex:none
}

.noimg{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:11px
}

.charname{
  flex:1;
  font-size:16px;
  font-weight:600
}

.acts{
  display:flex;
  gap:5px
}

.small{
  padding:7px 9px;
  font-size:12px;
  background:#e5e5e5;
  color:#666
}

.head{
  background:#fff;
  border:1px solid #ededed;
  border-left:5px solid var(--theme);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px
}

.headin{
  display:flex;
  align-items:center;
  gap:11px
}

.head img,
.headno{
  width:56px;
  height:56px;
  object-fit:cover;
  border-radius:11px;
  background:#eee
}

.headno{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:10px
}

.headname{
  font-size:19px;
  font-weight:700;
  color:var(--theme)
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.card{
  background:#fff;
  border:1px solid #ededed;
  border-radius:14px;
  overflow:hidden
}

.pimg,
.pno{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#eee;
  display:block
}

.pimg{
  cursor:pointer
}

.pno{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:11px
}

.content{
  padding:9px
}

.prow{
  display:flex;
  gap:4px;
  align-items:flex-start
}

.pname{
  flex:1;
  font-weight:600;
  font-size:13px;
  margin-bottom:8px;
  word-break:break-word
}

.star{
  border:0;
  background:transparent;
  color:#bbb;
  padding:0;
  font-size:21px;
  line-height:1
}

.star.on{
  color:var(--theme)
}

.goods{
  display:flex;
  flex-direction:column;
  gap:5px
}

.good{
  background:#f3f3f3;
  border-radius:9px;
  padding:5px;
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  min-width:0
}

.gimg,
.gno{
  width:40px;
  height:40px;
  object-fit:cover;
  border-radius:7px;
  background:#e7e7e7;
  flex:none
}

.gimg{
  cursor:pointer
}

.gno{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:9px
}

.gname{
  flex:1;
  word-break:break-word
}

.gact{
  display:flex;
  gap:0;
  flex:none
}

.gstar,
.gedit,
.gdel{
  border:0;
  background:transparent;
  padding:2px 3px;
  color:#aaa;
  font-size:17px
}

.gstar.on{
  color:var(--theme)
}

.gedit{
  font-size:13px
}

.gdel{
  font-size:15px
}

.gadd{
  width:100%;
  margin-top:7px;
  background:#eee;
  color:#666;
  padding:7px;
  font-size:12px
}

.pacts{
  display:flex;
  gap:5px;
  margin-top:8px
}

.pacts button{
  flex:1;
  background:#eee;
  color:#666;
  padding:7px;
  font-size:12px
}

.empty{
  text-align:center;
  color:#aaa;
  padding:35px 10px;
  font-size:13px
}
  <div id="cm" class="bg">
<div class="modal">
<h2 id="cmt">キャラを追加</h2>

<label>キャラ名</label>
<input id="cn" placeholder="例：月永レオ">

<label>キャラ画像</label>
<input id="ci" type="file" accept="image/*">
<div id="cfn" class="fname"></div>

<div id="cca" class="hidden">
<label>現在の画像</label>
<img id="cc" class="current">
</div>

<label>キャラカラー</label>
<div id="colors" class="colors"></div>

<div class="mbtn">
<button class="cancel" onclick="closeC()">キャンセル</button>
<button onclick="saveC()">保存</button>
</div>
</div>
</div>

<div id="pm" class="bg">
<div class="modal">
<h2 id="pmt">絵柄を追加</h2>

<label>絵柄名</label>
<input id="pn" placeholder="例：ハフアニ">

<label>絵柄画像</label>
<input id="pi" type="file" accept="image/*">
<div id="pfn" class="fname"></div>

<div id="pca" class="hidden">
<label>現在の画像</label>
<img id="pc" class="current">
</div>

<div class="mbtn">
<button class="cancel" onclick="closeP()">キャンセル</button>
<button onclick="saveP()">保存</button>
</div>
</div>
</div>

<div id="gm" class="bg">
<div class="modal">
<h2 id="gmt">グッズを追加</h2>

<label>グッズ名</label>
<input id="gn" placeholder="例：ぱしゃっつ 日本版">

<label>グッズ画像</label>
<input id="gi" type="file" accept="image/*">
<div id="gfn" class="fname"></div>

<div id="gca" class="hidden">
<label>現在の画像</label>
<img id="gc" class="current">
</div>

<label>最優先</label>
<button id="gp" onclick="toggleGP()">☆ 最優先にする</button>

<div class="mbtn">
<button class="cancel" onclick="closeG()">キャンセル</button>
<button onclick="saveG()">保存</button>
</div>
</div>
</div>

<div id="photo" class="photo" onclick="closePhoto(event)">
<button class="x" onclick="closePhoto(event)">×</button>
<img id="large">
</div>

<script>
const KEY="collectionData";

const COLORS=[
["red","赤","#d95c5c"],
["pink","ピンク","#e68ab0"],
["orange","オレンジ","#e69a55"],
["yellow","黄色","#d4b63f"],
["green","緑","#62a878"],
["lightblue","水色","#63b9d1"],
["blue","青","#5f82c9"],
["purple","紫","#9570bd"],
["brown","茶色","#9a7259"],
["black","黒","#555"],
["white","白","#c8c8c8"],
["gray","グレー","#8f8f8f"]
];

let data=[];

try{
data=JSON.parse(localStorage.getItem(KEY)||"[]");
}catch(e){
data=[];
}

if(!Array.isArray(data))data=[];

let ci=-1;
let ei=-1;
let pi=-1;
let gi=-1;
let gpri=false;
let color="gray";

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(data));
return true;
}catch(e){
alert("保存容量を超えました。画像を減らしてみてね！");
return false;
}
}

function norm(){
data.forEach(c=>{
c.color=c.color||"gray";

c.patterns=Array.isArray(c.patterns)?c.patterns:[];

c.patterns.forEach(p=>{
p.priority=!!p.priority;

p.goods=Array.isArray(p.goods)?p.goods:[];

p.goods=p.goods.map(g=>{
if(typeof g==="string"){
return{
name:g,
image:null,
priority:false
};
}

return Object.assign({
name:"",
image:null,
priority:false
},g);
});
});
});

save();
}

norm();

function img(file,max=600,q=.75){
return new Promise((res,rej)=>{

if(!file){
res(null);
return;
}

let reader=new FileReader();

reader.onload=e=>{

let image=new Image();

image.onload=()=>{

let scale=Math.min(
1,
max/Math.max(image.width,image.height)
);

let canvas=document.createElement("canvas");

canvas.width=image.width*scale;
canvas.height=image.height*scale;

let ctx=canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

res(canvas.toDataURL("image/jpeg",q));

};

image.onerror=rej;

image.src=e.target.result;

};

reader.onerror=rej;

reader.readAsDataURL(file);

});
}

function esc(s){
return String(s||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function col(){

let x=COLORS.find(
x=>x[0]===(data[ci]?.color||"gray")
);

return x?x[2]:"#8f8f8f";
}

function renderColors(){

colors.innerHTML=COLORS.map(x=>`

<button
class="color ${color===x[0]?"sel":""}"
onclick="pickColor('${x[0]}')"
>
<i
class="dot"
style="background:${x[2]}"
></i>
${x[1]}
</button>

`).join("");
}

function pickColor(x){

color=x;

renderColors();
}

function renderChars(){

listPage.classList.remove("hidden");

patPage.classList.add("hidden");

chars.innerHTML=data.length?

data.map((c,i)=>`

<div class="char">

<div>
${
c.image
?
`<img src="${c.image}">`
:
`<div class="noimg">画像なし</div>`
}
</div>

<div class="charname">
${esc(c.name)}
</div>

<div class="acts">

<button
class="small"
onclick="openChar(${i})"
>
開く
</button>

<button
class="small"
onclick="editChar(${i})"
>
編集
</button>

<button
class="small"
onclick="delChar(${i})"
>
削除
</button>

</div>

</div>

`).join("")

:

`<div class="empty">
まだキャラがいないよ
</div>`;
}

function charModal(i=null){

ei=i;

if(i===null){

cmt.textContent="キャラを追加";

cn.value="";

document.getElementById("ci").value="";

cfn.textContent="";

cca.classList.add("hidden");

color="gray";

}else{

let c=data[i];

cmt.textContent="キャラを編集";

cn.value=c.name||"";

document.getElementById("ci").value="";

cfn.textContent=
"画像を変更しない場合はそのままでOK";

color=c.color||"gray";

if(c.image){

cc.src=c.image;

cca.classList.remove("hidden");

}else{

cca.classList.add("hidden");

}

}

renderColors();

cm.style.display="flex";
}

function editChar(i){

charModal(i);

}

async function saveC(){

let name=cn.value.trim();

if(!name){

alert("キャラ名を入力してね！");

return;
}

try{

let image=null;

if(ei>=0){

image=data[ei].image||null;

}

let file=document.getElementById("ci").files[0];

if(file){

image=await img(file);

}

if(ei<0){

data.push({
name:name,
image:image,
color:color,
patterns:[]
});

}else{

Object.assign(
data[ei],
{
name:name,
image:image,
color:color
}
);

}

if(save()){

closeC();

renderChars();

}

}catch(e){

console.error(e);

alert(
"画像の処理に失敗しました。\n"+
"もう一度試してみてね。"
);

}

}

function delChar(i){

if(
confirm(
`「${data[i].name}」を削除する？`
)
){

data.splice(i,1);

save();

renderChars();

}

}

function openChar(i){

ci=i;

listPage.classList.add("hidden");

patPage.classList.remove("hidden");

renderPat();

}

function renderHead(){

let c=data[ci];

document.documentElement.style.setProperty(
"--theme",
col()
);

head.innerHTML=`

<div class="head">

<div class="headin">

${
c.image
?
`<img src="${c.image}">`
:
`<div class="headno">画像なし</div>`
}

<div class="headname">
${esc(c.name)}
</div>

</div>

</div>
`;
}

function renderPat(){

renderHead();

let patterns=data[ci].patterns;

pats.innerHTML=patterns.length?

patterns.map((p,i)=>{

let goods=p.goods.map((g,j)=>`

<div class="good">

${
g.image
?
`<img
class="gimg"
src="${g.image}"
onclick="photoOpen('${encodeURIComponent(g.image)}')"
>`
:
`<div class="gno">画像なし</div>`
}

<div class="gname">
${esc(g.name)}
</div>

<div class="gact">

<button
class="gstar ${g.priority?"on":""}"
onclick="toggleG(${i},${j})"
>
${g.priority?"★":"☆"}
</button>

<button
class="gedit"
onclick="editG(${i},${j})"
>
✎
</button>

<button
class="gdel"
onclick="delG(${i},${j})"
>
×
</button>

</div>

</div>

`).join("");

return `

<div class="card">

${
p.image
?
`<img
class="pimg"
src="${p.image}"
onclick="photoOpen('${encodeURIComponent(p.image)}')"
>`
:
`<div class="pno">画像なし</div>`
}

<div class="content">

<div class="prow">

<div class="pname">
${esc(p.name)}
</div>

<button
class="star ${p.priority?"on":""}"
onclick="toggleP(${i})"
>
${p.priority?"★":"☆"}
</button>

</div>

<div class="goods">

${
goods||
'<div style="font-size:11px;color:#aaa">グッズなし</div>'
}

</div>

<button
class="gadd"
onclick="goodsModal(${i})"
>
＋ グッズを追加
</button>

<div class="pacts">

<button onclick="editP(${i})">
編集
</button>

<button onclick="delP(${i})">
🗑️ 削除
</button>

</div>

</div>

</div>

`;

}).join("")

:

`
<div
class="empty"
style="grid-column:1/-1"
>
まだ絵柄がないよ
</div>
`;

save();

}

function back(){

ci=-1;

renderChars();

}

function patModal(i=null){

ei=i;

if(i===null){

pmt.textContent="絵柄を追加";

pn.value="";

document.getElementById("pi").value="";

pfn.textContent="";

pca.classList.add("hidden");

}else{

let p=data[ci].patterns[i];

pmt.textContent="絵柄を編集";

pn.value=p.name||"";

document.getElementById("pi").value="";

pfn.textContent=
"画像を変更しない場合はそのままでOK";

if(p.image){

pc.src=p.image;

pca.classList.remove("hidden");

}else{

pca.classList.add("hidden");

}

}

pm.style.display="flex";

}

function editP(i){

patModal(i);

}

async function saveP(){

let name=pn.value.trim();

if(!name){

alert("絵柄名を入力してね！");

return;
}

try{

let p=
ei>=0
?
data[ci].patterns[ei]
:
null;

let image=
p
?
p.image||null
:
null;

let file=
document.getElementById("pi").files[0];

if(file){

image=await img(file);

}

if(!p){

data[ci].patterns.push({

name:name,

image:image,

priority:false,

goods:[]

});

}else{

Object.assign(
p,
{
name:name,
image:image
}
);

}

if(save()){

closeP();

renderPat();

}

}catch(e){

console.error(e);

alert("画像の処理に失敗しました。\nもう一度試してみてね。");

}

}

function toggleP(i){

data[ci].patterns[i].priority=
!data[ci].patterns[i].priority;

save();

renderPat();

}

function delP(i){

if(
confirm(
`「${data[ci].patterns[i].name}」を削除する？
この絵柄のグッズも全部削除されます。`
)
){

data[ci].patterns.splice(i,1);

save();

renderPat();

}

}

function goodsModal(p,g=null){

pi=p;

gi=g;

gpri=
g!==null
&&
!!data[ci].patterns[p].goods[g].priority;

gmt.textContent=
g===null
?
"グッズを追加"
:
"グッズを編集";

if(g===null){

gn.value="";

document.getElementById("gi").value="";

gfn.textContent="";

gca.classList.add("hidden");

}else{

let item=data[ci].patterns[p].goods[g];

gn.value=item.name||"";

document.getElementById("gi").value="";

gfn.textContent=
"画像を変更しない場合はそのままでOK";

if(item.image){

gc.src=item.image;

gca.classList.remove("hidden");

}else{

gca.classList.add("hidden");

}

}

updateGP();

gm.style.display="flex";

}

function editG(p,g){

goodsModal(p,g);

}

function updateGP(){

gp.textContent=
gpri
?
"★ 最優先"
:
"☆ 最優先にする";

gp.style.background=
gpri
?
col()
:
"#eee";

gp.style.color=
gpri
?
"#fff"
:
"#666";

}

function toggleGP(){

gpri=!gpri;

updateGP();

}

async function saveG(){

let name=gn.value.trim();

if(!name){

alert("グッズ名を入力してね！");

return;
}

try{

let arr=data[ci].patterns[pi].goods;

let old=
gi!==null
?
arr[gi]
:
null;

let image=
old
?
old.image||null
:
null;

let file=
document.getElementById("gi").files[0];

if(file){

image=await img(file);

}

let item={
name:name,
image:image,
priority:gpri
};

if(gi===null){

arr.push(item);

}else{

arr[gi]=item;

}

if(save()){

closeG();

renderPat();

}

}catch(e){

console.error(e);

alert("画像の処理に失敗しました。\nもう一度試してみてね。");

}

}

function toggleG(p,g){

data[ci].patterns[p].goods[g].priority=
!data[ci].patterns[p].goods[g].priority;

save();

renderPat();

}

function delG(p,g){

let item=data[ci].patterns[p].goods[g];

if(
confirm(
`「${item.name}」を削除する？`
)
){

data[ci].patterns[p].goods.splice(g,1);

save();

renderPat();

}

}

function closeC(){

cm.style.display="none";

ei=-1;

}

function closeP(){

pm.style.display="none";

ei=-1;

}

function closeG(){

gm.style.display="none";

pi=-1;

gi=-1;

gpri=false;

}

function photoOpen(src){

large.src=decodeURIComponent(src);

photo.style.display="flex";

}

function closePhoto(e){

if(
e &&
e.target.id==="large"
)return;

if(e)
e.stopPropagation();

photo.style.display="none";

large.src="";

}

document.getElementById("ci").onchange=()=>{

cfn.textContent=
document.getElementById("ci").files[0]?.name||"";

};

document.getElementById("pi").onchange=()=>{

pfn.textContent=
document.getElementById("pi").files[0]?.name||"";

};

document.getElementById("gi").onchange=()=>{

gfn.textContent=
document.getElementById("gi").files[0]?.name||"";

};

renderChars();

</script>

</body>
</html>

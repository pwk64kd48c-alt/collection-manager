<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#555;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  background:#fff;
  padding:30px 20px 25px;
  border-bottom:1px solid #e5e5e5;
}

h1{
  margin:0;
  font-size:30px;
  color:#444;
}

main{
  max-width:800px;
  margin:auto;
  padding:28px 16px 60px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.add-main{
  width:100%;
  padding:18px;
  border-radius:18px;
  background:#999;
  color:white;
  font-size:19px;
  margin-bottom:24px;
}

.character-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.character-card{
  background:white;
  border-radius:18px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
  overflow:hidden;
}

.char-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
  display:block;
}

.char-name{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
  color:#444;
}

.char-color{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
  vertical-align:middle;
}

.back{
  background:white;
  border-radius:12px;
  padding:10px 15px;
  margin-bottom:18px;
  color:#666;
}

.character-head{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  border-left:8px solid var(--theme,#aaa);
}

.character-title{
  font-size:25px;
  font-weight:bold;
  color:#444;
}

.character-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#eee;
  color:#555;
}

.action.theme{
  background:var(--theme,#999);
  color:white;
}

.priority-legend{
  margin-top:10px;
  padding:9px 11px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:11px;
  color:#888;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
}

.priority-legend-title{
  font-weight:bold;
  color:#666;
}

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.pattern-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
}

.pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.pattern-empty{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#aaa;
}

.pattern-info{
  padding:12px;
}

.pattern-name{
  font-weight:bold;
  color:#444;
  font-size:16px;
}

.goods-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.goods-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#f7f7f7;
  border-radius:9px;
  font-size:13px;
  min-width:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:pan-y;
}

.goods-thumb{
  width:38px;
  height:38px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.goods-name{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.priority-mark{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  padding:0;
  flex:none;
  font-size:18px;
  line-height:1;
}

.priority-none{
  color:#777;
}

.priority-star{
  color:#777;
}

.pattern-priority{
  position:absolute;
  right:9px;
  top:8px;
  background:rgba(255,255,255,.92);
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-buttons button{
  flex:1;
  padding:7px 3px;
  border-radius:8px;
  background:#eee;
  color:#666;
  font-size:12px;
}

.screenshot-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.screenshot-buttons button{
  padding:11px 5px;
  border-radius:11px;
  background:#eee;
  color:#555;
  font-size:13px;
}

.screenshot-buttons button:first-child{
  grid-column:1/-1;
  background:#777;
  color:white;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:40px 10px;
}

/* =========================
   モーダル
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
  color:#444;
}

label{
  display:block;
  font-size:13px;
  margin:14px 0 6px;
  color:#777;
}

input[type="text"],
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  background:white;
}

input[type="file"]{
  width:100%;
  margin-bottom:8px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:12px;
  background:#f5f5f5;
  margin-top:8px;
  display:none;
}

.color-picker-area{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#f7f7f7;
  border-radius:14px;
}

#characterColor{
  width:58px;
  height:58px;
  padding:0;
  border:0;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  background:none;
}

.color-code-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}

.color-preview{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid #ddd;
  flex:none;
}

#characterColorHex{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  text-transform:uppercase;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:13px;
  border-radius:11px;
}

.cancel{
  background:#eee;
  color:#666;
}

.save{
  background:#777;
  color:white;
}

.delete{
  background:#f0dddd;
  color:#a55;
}

/* =========================
   写真
========================= */

.photo-view{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.photo-view.show{
  display:flex;
}

.photo-view img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:fixed;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  font-size:25px;
}

/* =========================
   スクショ画面
========================= */

.screenshot-view{
  display:none;
  position:fixed;
  inset:0;
  background:#eee;
  z-index:3000;
  overflow:auto;
  padding:20px;
}

.screenshot-view.show{
  display:block;
}

.screenshot-toolbar{
  max-width:800px;
  margin:0 auto 14px;
  display:flex;
  gap:8px;
  position:sticky;
  top:0;
  z-index:20;
}

.screenshot-toolbar button{
  flex:1;
  padding:14px 5px;
  border-radius:14px;
  background:white;
  color:#555;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  font-size:16px;
}

.screenshot-toolbar .shot-save{
  background:#777;
  color:white;
}

/* スクショ本体 */
.shot-sheet{
  width:100%;
  max-width:800px;
  margin:0 auto;
  background:white;
  border-radius:22px;
  padding:24px;
}

.shot-title{
  font-size:30px;
  font-weight:bold;
  color:#444;
  margin-bottom:20px;
}

/* モード切替 */
.shot-mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.shot-mode-button{
  padding:15px 8px;
  border-radius:15px;
  background:#eee;
  color:#777;
  font-size:17px;
  font-weight:bold;
}

.shot-mode-button.active{
  background:#777;
  color:white;
}

/* グッズ種類選択 */
.shot-type-panel{
  background:#f7f7f7;
  border-radius:15px;
  padding:14px;
  margin-bottom:18px;
}

.shot-type-title{
  font-size:13px;
  font-weight:bold;
  color:#666;
  margin-bottom:10px;
}

.shot-type-list{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.shot-type-button{
  padding:8px 12px;
  border-radius:20px;
  background:white;
  border:1px solid #ddd;
  color:#666;
  font-size:13px;
}

.shot-type-button.active{
  background:#777;
  color:white;
  border-color:#777;
}

.shot-type-help{
  margin-top:9px;
  font-size:11px;
  color:#999;
}

/*
  絵柄ごとの大きなカード
*/
.shot-pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
  align-items:start;
}

.shot-pattern-card{
  background:#f7f7f7;
  border:2px solid #e7e7e7;
  border-radius:18px;
  padding:12px;
  display:grid;
  grid-template-columns:120px minmax(0,1fr);
  gap:12px;
  min-width:0;
}

/* 絵柄側 */
.shot-pattern-side{
  min-width:0;
}

.shot-pattern-image-large{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:13px;
  background:#ddd;
  display:block;
}

.shot-pattern-name-large{
  margin-top:8px;
  font-size:15px;
  font-weight:bold;
  line-height:1.25;
  color:#444;
  overflow-wrap:anywhere;
}

/* グッズ側 */
.shot-goods-side{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.shot-goods-label{
  display:inline-block;
  align-self:flex-start;
  padding:5px 9px;
  background:#e9eeee;
  border-radius:20px;
  font-size:10px;
  color:#777;
  margin-bottom:1px;
}

.shot-goods-row{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  background:white;
  border-radius:10px;
  padding:7px;
  min-height:52px;
}

.shot-goods-image{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.shot-no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:9px;
  background:#ddd;
}

.shot-goods-info{
  flex:1;
  min-width:0;
}

.shot-goods-name{
  font-size:12px;
  font-weight:bold;
  line-height:1.25;
  color:#444;
  overflow-wrap:anywhere;
}

.shot-priority{
  width:22px;
  flex:none;
  text-align:center;
  font-size:18px;
  line-height:1;
}

.shot-empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 10px;
  color:#aaa;
  font-size:13px;
}

@media(max-width:600px){

  .screenshot-view{
    padding:12px;
  }

  .shot-sheet{
    padding:14px;
    border-radius:18px;
  }

  .shot-title{
    font-size:24px;
  }

  .shot-pattern-grid{
    gap:9px;
  }

  .shot-pattern-card{
    grid-template-columns:72px minmax(0,1fr);
    gap:7px;
    padding:8px;
    border-radius:14px;
  }

  .shot-pattern-name-large{
    font-size:12px;
  }

  .shot-goods-label{
    font-size:8px;
    padding:4px 6px;
  }

  .shot-goods-row{
    padding:5px;
    gap:5px;
    min-height:43px;
  }

  .shot-goods-image{
    width:32px;
    height:32px;
  }

  .shot-goods-name{
    font-size:10px;
  }

  .shot-priority{
    font-size:15px;
    width:17px;
  }

}

@media(max-width:420px){

  .shot-mode-buttons{
    gap:7px;
  }

  .shot-mode-button{
    font-size:14px;
    padding:12px 5px;
  }

  .shot-pattern-card{
    grid-template-columns:64px minmax(0,1fr);
  }

  .shot-pattern-name-large{
    font-size:11px;
  }

  .shot-goods-name{
    font-size:9px;
  }

  .shot-goods-image{
    width:29px;
    height:29px;
  }

}
</style>
</head>

<body>

<header>
<h1>Collection</h1>
</header>

<main id="app"></main>

<!-- キャラ -->
<div class="modal-bg" id="characterModal">

<input id="characterColor" type="color" value="#aaaaaa">

<div class="color-code-area">

<span id="colorPreview"
class="color-preview"
style="background:#aaaaaa"></span>

type="text"
value="#AAAAAA"
maxlength="7">

</div>

<div class="modal-buttons">

<button class="cancel" data-action="close-pattern">
キャンセル
</button>

id="deletePatternButton"
data-action="delete-pattern-modal"
style="display:none;">

</button>

保存
</button>

</div>
</div>
</div>

<!-- グッズ -->
<div class="modal-bg" id="goodsModal">
<div class="modal">

<h2 id="goodsModalTitle">グッズを追加</h2>

<label>グッズ名</label>
<input id="goodsName" type="text" placeholder="例：缶バッジ">

<label>画像</label>
<input id="goodsImage" type="file" accept="image/*">
<img id="goodsPreview" class="preview">

<label>優先度</label>

<select id="goodsPriority">
<option value="0">☆ 通常</option>
<option value="1">★ 優先</option>

<script>
(function(){

"use strict";

const KEY="collectionData";

const DB_NAME="CollectionDB";
const DB_VERSION=1;
const STORE_NAME="appData";

let db=null;
let data=[];
let currentCharacter=null;

let editingCharacter=-1;
let editingPattern=-1;
let editingGoods=-1;

let screenshotMode="all";

/* 選択中のグッズ種類 */
let selectedGoodsTypes=[];

const app=document.getElementById("app");

const COLORS=[
{name:"赤",value:"#e57373"},
{name:"ピンク",value:"#f48fb1"},
{name:"オレンジ",value:"#ffb74d"},
{name:"黄色",value:"#fff176"},
{name:"緑",value:"#81c784"},
{name:"水色",value:"#80cbc4"},
{name:"青",value:"#64b5f6"},
{name:"紫",value:"#9575cd"},
{name:"茶色",value:"#a1887f"},
{name:"黒",value:"#555555"},
{name:"白",value:"#dddddd"},
{name:"グレー",value:"#aaaaaa"}
];

/* =========================
 IndexedDB
========================= */

function openDB(){

return new Promise(function(resolve,reject){

const request=indexedDB.open(DB_NAME,DB_VERSION);

request.onupgradeneeded=function(){

const d=request.result;

if(!d.objectStoreNames.contains(STORE_NAME)){
d.createObjectStore(STORE_NAME);
}

};

request.onsuccess=function(){

db=request.result;
resolve(db);

};

request.onerror=function(){
reject(request.error);
};

});

}

function getDBData(){

return new Promise(function(resolve,reject){

const tx=db.transaction(STORE_NAME,"readonly");

const request=
tx.objectStore(STORE_NAME).get(KEY);

request.onsuccess=function(){
resolve(request.result??null);
};

request.onerror=function(){
reject(request.error);
};

});

}

function putDBData(value){

return new Promise(function(resolve,reject){

const tx=db.transaction(STORE_NAME,"readwrite");

const request=
tx.objectStore(STORE_NAME).put(value,KEY);

request.onsuccess=function(){
resolve();
};

request.onerror=function(){
reject(request.error);
};

});

}

/* =========================
 データ
========================= */

function normalizePriority(value){

if(value===true)return 2;

if(
value===false||
value===undefined||
value===null
)return 0;

const n=Number(value);

if(n>=2)return 2;
if(n===1)return 1;

return 0;

}

function priorityMark(priority){

const p=normalizePriority(priority);

if(p===2){
return {
mark:"⭐️",
className:"priority-star"
};
}

if(p===1){
return {
mark:"★",
className:"priority-star"
};
}

return {
mark:"☆",
className:"priority-none"
};

}

function nextPriority(priority){

return (normalizePriority(priority)+1)%3;

}

function normalizeCharacter(c){

c=c||{};

return {
name:String(c.name||""),
image:typeof c.image==="string"?c.image:"",
color:c.color||"#aaaaaa",
patterns:Array.isArray(c.patterns)
?c.patterns.map(normalizePattern)
:[]
};

}

function normalizePattern(p){

p=p||{};

return {
name:String(p.name||""),
image:typeof p.image==="string"?p.image:"",
priority:normalizePriority(p.priority),
goods:Array.isArray(p.goods)
?p.goods.map(normalizeGoods)
:[]
};

}

function normalizeGoods(g){

if(typeof g==="string"){
return {
name:g,
image:"",
priority:0
};
}

g=g||{};

return {
name:String(g.name||""),
image:typeof g.image==="string"?g.image:"",
priority:normalizePriority(g.priority)
};

}

async function safeLoad(){

await openDB();

let saved=await getDBData();

if(saved===null){

const oldRaw=localStorage.getItem(KEY);

if(oldRaw){

try{

const oldData=JSON.parse(oldRaw);

if(Array.isArray(oldData)){

saved=oldData.map(normalizeCharacter);

await putDBData(saved);

localStorage.removeItem(KEY);

}

}catch(e){
console.error(e);
}

}

}

if(!Array.isArray(saved))return [];

return saved.map(normalizeCharacter);

}

async function save(){

try{

await putDBData(data);

function escapeHTML(str){

return String(str||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function getColor(color){

const found=COLORS.find(function(c){
return c.name===color;
});

if(found)return found.value;

if(
typeof color==="string" &&
/^#[0-9a-fA-F]{6}$/.test(color)
){
return color;
}

return "#aaaaaa";

}

function compressImage(file){

return new Promise(function(resolve){

if(!file){
resolve("");
return;
}

const reader=new FileReader();

reader.onload=function(){

const img=new Image();

img.onload=function(){

const max=600;

let w=img.width;
let h=img.height;

if(w>max||h>max){

if(w>h){

h=Math.round(h*max/w);
w=max;

}else{

w=Math.round(w*max/h);
h=max;

}

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",.72)
);

};

img.onerror=function(){
resolve(reader.result);
};

img.src=reader.result;

};

reader.onerror=function(){
resolve("");
};

reader.readAsDataURL(file);

});

}

function setColorPicker(color){

let value=color;

if(!String(value).startsWith("#")){
value=getColor(value);
}

if(!/^#[0-9a-fA-F]{6}$/.test(value)){
value="#aaaaaa";
}

document.getElementById("characterColor").value=value;

document.getElementById("characterColorHex").value=
value.toUpperCase();

document.getElementById("colorPreview").style.background=value;

}

function openCharacterEditor(index){

editingCharacter=index;

const name=document.getElementById("characterName");
const image=document.getElementById("characterImage");
const preview=document.getElementById("characterPreview");
const del=document.getElementById("deleteCharacterButton");

if(index===-1){

document.getElementById("characterModalTitle").textContent=
"キャラを追加";

name.value="";
image.value="";
preview.style.display="none";
preview.src="";
del.style.display="none";

setColorPicker("#aaaaaa");

}else{

const c=data[index];

document.getElementById("characterModalTitle").textContent=
"キャラを編集";

name.value=c.name;
image.value="";

if(c.image){

preview.src=c.image;
preview.style.display="block";

}else{

preview.style.display="none";

}

del.style.display="block";

setColorPicker(c.color);

}

openModal("characterModal");

}

async function saveCharacter(){

const name=document.getElementById("characterName")
.value.trim();

if(!name){

alert("キャラ名を入力してね！");
return;

}

let color=document.getElementById("characterColor").value;

const hex=document.getElementById("characterColorHex")
.value.trim();

if(/^#[0-9a-fA-F]{6}$/.test(hex)){
color=hex;
}

const file=document.getElementById("characterImage").files[0];

let image="";

if(editingCharacter!==-1){
image=data[editingCharacter].image||"";
}

if(file){
image=await compressImage(file);
}

if(editingCharacter===-1){

data.push({
name:name,
image:image,
color:color,
patterns:[]
});

}else{

const old=data[editingCharacter];

data[editingCharacter]={
name:name,
image:image,
color:color,
patterns:old.patterns||[]
};

}

if(!await save())return;

closeModal("characterModal");

currentCharacter=null;

render();

}

async function deleteCharacter(){

if(editingCharacter<0)return;

const c=data[editingCharacter];

if(!confirm(
"「"+c.name+"」を削除する？\n\n"+
"このキャラの絵柄・グッズもすべて削除されます。"
))return;

data.splice(editingCharacter,1);

if(!await save())return;

closeModal("characterModal");

editingCharacter=-1;
currentCharacter=null;

render();

}

/*

*/
function getGoodsTypes(c){

const map=new Map();

c.patterns.forEach(function(p){

p.goods.forEach(function(g){

const name=g.name.trim();

if(name && !map.has(name)){
map.set(name,name);
}

});

});

return Array.from(map.values());

}

/* =========================
 長押し削除
========================= */

let goodsTimer=null;
let goodsTarget=null;

function cancelLongPress(){

if(goodsTimer!==null){

clearTimeout(goodsTimer);
goodsTimer=null;

}

goodsTarget=null;

}

document.addEventListener(
"touchstart",
function(e){

const item=e.target.closest(".goods-item");

if(!item)return;

if(
e.target.closest("button")||
e.target.closest("img")
)return;

cancelLongPress();

goodsTarget=item;

goodsTimer=setTimeout(async function(){

if(!goodsTarget)return;

const patternIndex=Number(
goodsTarget.dataset.goodsPattern
);

const goodsIndex=Number(
goodsTarget.dataset.goodsIndex
);

const p=data[currentCharacter]
.patterns[patternIndex];

const g=p&&p.goods
?p.goods[goodsIndex]
:null;

if(!g){

cancelLongPress();
return;

}

if(confirm("「"+g.name+"」を削除する？")){

p.goods.splice(goodsIndex,1);

await save();

renderCharacter();

}

cancelLongPress();

},800);

},
{passive:true}
);

document.addEventListener(
"touchend",
cancelLongPress,
{passive:true}
);

document.addEventListener(
"touchmove",
cancelLongPress,
{passive:true}
);

document.addEventListener(
"touchcancel",
cancelLongPress,
{passive:true}
);

document.addEventListener(
"contextmenu",
function(e){

const item=e.target.closest(".goods-item");

if(!item)return;

if(
e.target.closest("button")||
e.target.closest("img")
)return;

e.preventDefault();

const patternIndex=Number(
item.dataset.goodsPattern
);

const goodsIndex=Number(
item.dataset.goodsIndex
);

const p=data[currentCharacter]
.patterns[patternIndex];

const g=p&&p.goods
?p.goods[goodsIndex]
:null;

if(!g)return;

if(confirm("「"+g.name+"」を削除する？")){

p.goods.splice(goodsIndex,1);

save().then(function(){
renderCharacter();
});

}

}
);

/* =========================
 プレビュー
========================= */

function previewFile(input,preview){

input.addEventListener("change",function(){

const file=input.files[0];

if(!file){

preview.style.display="none";
return;

}

const reader=new FileReader();

reader.onload=function(){

preview.src=reader.result;
preview.style.display="block";

};

reader.readAsDataURL(file);

});

}

previewFile(
document.getElementById("characterImage"),
document.getElementById("characterPreview")
);

previewFile(
document.getElementById("patternImage"),
document.getElementById("patternPreview")
);

document.getElementById("goodsImage"),
document.getElementById("goodsPreview")
);

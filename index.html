<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eeeeee;
  color:#444;
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue","Hiragino Kaku Gothic ProN",
  "Yu Gothic",Meiryo,sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer;border:none}

header{
  background:#fff;
  padding:20px 15px;
  text-align:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:24px;
  color:#555;
}

main{
  max-width:1000px;
  margin:0 auto;
  padding:18px;
}

/* =========================
   共通
========================= */

.empty{
  background:#fff;
  border-radius:18px;
  padding:50px 20px;
  text-align:center;
  color:#aaa;
  font-size:14px;
}

.add-main{
  width:100%;
  background:#fff;
  border:1px dashed #bbb;
  color:#777;
  border-radius:16px;
  padding:15px;
  margin-bottom:15px;
}

.back{
  background:#fff;
  color:#777;
  border-radius:12px;
  padding:9px 13px;
  margin-bottom:12px;
}

/* =========================
   キャラ一覧
========================= */

.character-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.character-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  border:2px solid var(--theme);
  position:relative;
}

.char-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.char-name{
  padding:11px 12px;
  font-size:16px;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:7px;
}

.char-color{
  width:11px;
  height:11px;
  border-radius:50%;
  flex:none;
}

/* =========================
   キャラ詳細
========================= */

.character-head{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
  border-left:5px solid var(--theme);
}

.character-title{
  font-size:23px;
  font-weight:bold;
  margin-bottom:12px;
}

.character-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.action{
  background:#f2f2f2;
  color:#666;
  border-radius:11px;
  padding:9px 12px;
}

.action.theme{
  background:var(--theme);
  color:#fff;
}

.priority-legend{
  margin-top:13px;
  background:#f7f7f7;
  border-radius:12px;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  font-size:13px;
}

.priority-legend-title{
  color:#777;
}

.screenshot-buttons{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.screenshot-buttons button{
  flex:1;
  background:#555;
  color:#fff;
  border-radius:11px;
  padding:10px;
}

/* =========================
   絵柄
========================= */

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.pattern-card{
  background:#fff;
  border-radius:18px;
  padding:10px;
  position:relative;
  overflow:hidden;
}

.pattern-image,
.pattern-empty{
  width:100%;
  aspect-ratio:1/1;
  border-radius:13px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.pattern-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:12px;
}

.pattern-priority{
  position:absolute;
  top:14px;
  right:14px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:23px;
  z-index:2;
}

.priority-star{color:#555}
.priority-none{color:#777}

.pattern-info{
  padding-top:9px;
}

.pattern-name{
  font-weight:bold;
  font-size:15px;
  line-height:1.3;
  margin-bottom:8px;
}

.goods-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.goods-item{
  background:#f7f7f7;
  border-radius:10px;
  padding:5px;
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.goods-thumb{
  width:40px;
  height:40px;
  border-radius:7px;
  object-fit:cover;
  background:#ddd;
  flex:none;
}

.goods-name{
  flex:1;
  min-width:0;
  font-size:12px;
  line-height:1.2;
  overflow-wrap:anywhere;
}

.priority-mark{
  width:27px;
  min-width:27px;
  background:transparent;
  font-size:21px;
  padding:0;
}

.small-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-buttons button{
  flex:1;
  background:#eee;
  color:#666;
  border-radius:8px;
  padding:7px 3px;
  font-size:11px;
}

/* =========================
   モーダル
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:1000;
}

.modal-bg.show{display:flex}

.modal{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
}

.modal h2{
  margin:0 0 18px;
  font-size:20px;
}

.modal label{
  display:block;
  margin:12px 0 6px;
  font-size:13px;
  color:#777;
}

.modal input[type="text"],
.modal select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.modal input[type="file"]{
  width:100%;
}

.preview{
  display:none;
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
  background:#eee;
}

.color-picker-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.color-picker-area input[type="color"]{
  width:45px;
  height:45px;
  padding:0;
  border:none;
  background:none;
}

.color-code-area{
  display:flex;
  align-items:center;
  gap:7px;
  flex:1;
}

.color-preview{
  width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid #ddd;
  flex:none;
}

.color-code-area input{
  flex:1;
  padding:9px;
  border:1px solid #ddd;
  border-radius:9px;
}

.modal-buttons{
  display:flex;
  gap:7px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:11px 5px;
  border-radius:10px;
}

.cancel{
  background:#eee;
  color:#666;
}

.delete{
  background:#f3dede;
  color:#b55;
}

.save{
  background:#555;
  color:#fff;
}

/* =========================
   写真
========================= */

.photo-view{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:2000;
}

.photo-view.show{display:flex}

.photo-view img{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:absolute;
  top:12px;
  right:15px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  font-size:28px;
  color:#555;
}

/* =========================
   スクショ画面
========================= */

.screenshot-view{
  position:fixed;
  inset:0;
  background:#ddd;
  overflow:auto;
  display:none;
  z-index:1500;
}

.screenshot-view.show{display:block}

.screenshot-toolbar{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.95);
  padding:10px;
  display:flex;
  gap:8px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.screenshot-toolbar button{
  background:#eee;
  color:#555;
  border-radius:10px;
  padding:9px 12px;
}

.screenshot-toolbar .shot-save{
  margin-left:auto;
  background:#555;
  color:#fff;
}

/* =========================
   スクショ本体
========================= */

#screenshotContent{
  padding:12px;
}

.shot-sheet{
  width:100%;
  max-width:1100px;
  margin:0 auto;
  background:#fff;
  padding:18px;
  border-radius:20px;
}

.shot-title{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#777;
  margin:0 0 24px;
}

/* 優先度 */

.shot-priority{
  background:#f7f7f7;
  border-radius:18px;
  padding:13px 10px;
  margin-bottom:28px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;

  color:#666;
  font-size:20px;
  white-space:nowrap;
}

.shot-priority .normal{
  color:#666;
}

.shot-priority .high{
  color:#666;
}

.shot-priority .top{
  color:#666;
}

/* =========================
   2列カード
========================= */

.shot-pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.shot-pattern-card{
  background:#f8f8f8;
  border:2px solid #e3e3e3;
  border-radius:22px;
  padding:10px;

  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(180px,1.08fr);
  gap:12px;

  align-items:start;
  min-width:0;
}

/* 左：絵柄 */

.shot-pattern-side{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
}

.shot-pattern-main-image,
.shot-pattern-no-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:17px;
  display:block;
  background:#ddd;
}

.shot-pattern-no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:12px;
}

.shot-pattern-title{
  width:100%;
  color:#444;
  font-weight:bold;
  font-size:20px;
  line-height:1.18;
  overflow-wrap:anywhere;
}

/* 右：グッズ */

.shot-goods-list{
  width:100%;
  min-width:0;

  display:flex;
  flex-direction:column;
  gap:7px;
}

.shot-goods-item{
  width:100%;
  min-width:0;

  background:#fff;
  border-radius:14px;
  padding:7px;

  display:flex;
  align-items:center;
  gap:8px;

  min-height:54px;
}

.shot-goods-thumb,
.shot-goods-no-image{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.shot-goods-no-image{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:8px;
}

.shot-goods-info{
  flex:1;
  min-width:0;
}

.shot-goods-name{
  font-size:15px;
  line-height:1.25;
  color:#444;

  /* 絶対に1文字ずつ縦にならない */
  overflow-wrap:break-word;
  word-break:normal;
  white-space:normal;
}

.shot-goods-priority{
  width:31px;
  min-width:31px;
  text-align:center;
  font-size:27px;
  line-height:1;
  flex:none;
}

.shot-empty{
  text-align:center;
  padding:35px 10px;
  color:#aaa;
  font-size:13px;
  grid-column:1/-1;
}

/* =========================
   種類選択
========================= */

.shot-type-selector{
  background:#f7f7f7;
  border-radius:15px;
  padding:12px;
  margin-bottom:12px;
}

.shot-type-title{
  font-size:12px;
  color:#777;
  margin-bottom:8px;
}

.shot-type-list{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.shot-type-chip{
  background:#fff;
  border:1px solid #ddd;
  color:#777;
  border-radius:9px;
  padding:7px 10px;
  font-size:11px;
}

.shot-type-chip.selected{
  background:#777;
  color:#fff;
  border-color:#777;
}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

  main{
    padding:12px;
  }

  .character-list,
  .pattern-grid{
    gap:9px;
  }

  .character-card{
    border-radius:14px;
  }

  .char-name{
    font-size:13px;
    padding:8px;
  }

  .character-head{
    padding:12px;
  }

  .character-title{
    font-size:20px;
  }

  .priority-legend{
    gap:9px;
    font-size:11px;
  }

  .screenshot-buttons button{
    font-size:11px;
  }

  .pattern-card{
    padding:7px;
    border-radius:14px;
  }

  .pattern-name{
    font-size:12px;
  }

  .goods-thumb{
    width:32px;
    height:32px;
  }

  .goods-name{
    font-size:10px;
  }

  .priority-mark{
    font-size:17px;
    width:22px;
    min-width:22px;
  }

  /* =========================
     スクショ
     スマホでも2列を維持
  ========================= */

  #screenshotContent{
    padding:8px;
  }

  .shot-sheet{
    padding:10px;
    border-radius:16px;
    min-width:0;
  }

  .shot-title{
    font-size:22px;
    margin-bottom:17px;
  }

  .shot-priority{
    font-size:13px;
    gap:12px;
    padding:11px 5px;
    margin-bottom:18px;
  }

  .shot-pattern-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .shot-pattern-card{
    grid-template-columns:92px minmax(0,1fr);
    gap:7px;
    padding:7px;
    border-radius:15px;
  }

  .shot-pattern-main-image,
  .shot-pattern-no-image{
    width:92px;
    height:92px;
    border-radius:10px;
  }

  .shot-pattern-title{
    font-size:11px;
    line-height:1.2;
  }

  .shot-goods-list{
    gap:5px;
  }

  .shot-goods-item{
    padding:5px;
    gap:5px;
    border-radius:9px;
    min-height:0;
  }

  .shot-goods-thumb,
  .shot-goods-no-image{
    width:28px;
    height:28px;
    border-radius:5px;
  }

  .shot-goods-name{
    font-size:10px;
    line-height:1.2;
    overflow-wrap:break-word;
    word-break:normal;
  }

  .shot-goods-priority{
    width:20px;
    min-width:20px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>
</header>

<main id="app"></main>


<!-- =========================
     キャラ
========================= -->

<div class="modal-bg" id="characterModal">
  <div class="modal">

    <h2 id="characterModalTitle">キャラを追加</h2>

    <label>キャラ名</label>
    <input id="characterName" type="text" placeholder="例：月永レオ">

    <label>画像</label>
    <input id="characterImage" type="file" accept="image/*">
    <img id="characterPreview" class="preview">

    <label>テーマカラー</label>

    <div class="color-picker-area">

      <input id="characterColor" type="color" value="#aaaaaa">

      <div class="color-code-area">

        <span
          id="colorPreview"
          class="color-preview"
          style="background:#aaaaaa">
        </span>

        <input
          id="characterColorHex"
          type="text"
          value="#AAAAAA"
          maxlength="7">

      </div>

    </div>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-character">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteCharacterButton"
        data-action="delete-character"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-character">
        保存
      </button>

    </div>

  </div>
</div>


<!-- =========================
     絵柄
========================= -->

<div class="modal-bg" id="patternModal">
  <div class="modal">

    <h2 id="patternModalTitle">絵柄を追加</h2>

    <label>絵柄名</label>

    <input
      id="patternName"
      type="text"
      placeholder="例：Half Anniversary">

    <label>画像</label>

    <input
      id="patternImage"
      type="file"
      accept="image/*">

    <img id="patternPreview" class="preview">

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-pattern">
        キャンセル
      </button>

      <button
        class="delete"
        id="deletePatternButton"
        data-action="delete-pattern-modal"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-pattern">
        保存
      </button>

    </div>

  </div>
</div>


<!-- =========================
     グッズ
========================= -->

<div class="modal-bg" id="goodsModal">
  <div class="modal">

    <h2 id="goodsModalTitle">グッズを追加</h2>

    <label>グッズ名</label>

    <input
      id="goodsName"
      type="text"
      placeholder="例：チェキ">

    <label>画像</label>

    <input
      id="goodsImage"
      type="file"
      accept="image/*">

    <img id="goodsPreview" class="preview">

    <label>優先度</label>

    <select id="goodsPriority">

      <option value="0">☆ 通常</option>
      <option value="1">★ 優先</option>
      <option value="2">⭐️ 最優先</option>

    </select>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-goods">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteGoodsButton"
        data-action="delete-goods"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-goods">
        保存
      </button>

    </div>

  </div>
</div>


<!-- =========================
     写真
========================= -->

<div class="photo-view" id="photoView">

  <button
    class="close-photo"
    data-action="close-photo">
    ×
  </button>

  <img id="photoLarge">

</div>


<!-- =========================
     スクショ
========================= -->

<div class="screenshot-view" id="screenshotView">

  <div class="screenshot-toolbar">

    <button data-action="close-screenshot">
      ← 戻る
    </button>

    <button
      class="shot-save"
      data-action="save-screenshot">
      📸 画像として保存
    </button>

  </div>

  <div id="screenshotContent"></div>

</div>


<script>

(function(){

"use strict";


const KEY="collectionData";
const DB_NAME="CollectionDB";
const DB_VERSION=1;
const STORE_NAME="appData";

let db=null;
let data=[];
let currentCharacter=null;
let editingCharacter=-1;
let editingPattern=-1;
let editingGoods=-1;

let screenshotMode="all";
let selectedShotTypes=[];

const app=document.getElementById("app");


/* =========================
   IndexedDB
========================= */

function openDB(){

  return new Promise(function(resolve,reject){

    const request=indexedDB.open(
      DB_NAME,
      DB_VERSION
    );

    request.onupgradeneeded=function(){

      const d=request.result;

      if(
        !d.objectStoreNames.contains(
          STORE_NAME
        )
      ){

        d.createObjectStore(
          STORE_NAME
        );

      }

    };

    request.onsuccess=function(){

      db=request.result;
      resolve(db);

    };

    request.onerror=function(){

      reject(request.error);

    };

  });

}


function getDBData(){

  return new Promise(function(resolve,reject){

    const tx=db.transaction(
      STORE_NAME,
      "readonly"
    );

    const request=
      tx.objectStore(STORE_NAME).get(KEY);

    request.onsuccess=function(){

      resolve(
        request.result ?? null
      );

    };

    request.onerror=function(){

      reject(request.error);

    };

  });

}


function putDBData(value){

  return new Promise(function(resolve,reject){

    const tx=db.transaction(
      STORE_NAME,
      "readwrite"
    );

    const request=
      tx.objectStore(STORE_NAME).put(
        value,
        KEY
      );

    request.onsuccess=function(){

      resolve();

    };

    request.onerror=function(){

      reject(request.error);

    };

  });

}


/* =========================
   優先度
========================= */

function normalizePriority(value){

  if(value===true)return 2;

  if(
    value===false ||
    value===undefined ||
    value===null
  ){

    return 0;

  }

  const n=Number(value);

  if(n>=2)return 2;
  if(n===1)return 1;

  return 0;

}


function priorityMark(priority){

  const p=normalizePriority(priority);

  if(p===2){

    return{
      mark:"⭐️",
      className:"priority-star"
    };

  }

  if(p===1){

    return{
      mark:"★",
      className:"priority-star"
    };

  }

  return{
    mark:"☆",
    className:"priority-none"
  };

}


function nextPriority(priority){

  return(
    normalizePriority(priority)+1
  )%3;

}


/* =========================
   データ整理
========================= */

function normalizeCharacter(c){

  c=c||{};

  return{

    name:String(c.name||""),

    image:
      typeof c.image==="string"
      ?c.image
      :"",

    color:
      c.color||"#aaaaaa",

    patterns:
      Array.isArray(c.patterns)
      ?c.patterns.map(normalizePattern)
      :[]

  };

}


function normalizePattern(p){

  p=p||{};

  return{

    name:String(p.name||""),

    image:
      typeof p.image==="string"
      ?p.image
      :"",

    priority:
      normalizePriority(p.priority),

    goods:
      Array.isArray(p.goods)
      ?p.goods.map(normalizeGoods)
      :[]

  };

}


function normalizeGoods(g){

  if(typeof g==="string"){

    return{
      name:g,
      image:"",
      priority:0
    };

  }

  g=g||{};

  return{

    name:String(g.name||""),

    image:
      typeof g.image==="string"
      ?g.image
      :"",

    priority:
      normalizePriority(g.priority)

  };

}


/* =========================
   読み込み・保存
========================= */

async function safeLoad(){

  await openDB();

  let saved=await getDBData();


  if(saved===null){

    const oldRaw=
      localStorage.getItem(KEY);

    if(oldRaw){

      try{

        const oldData=
          JSON.parse(oldRaw);

        if(Array.isArray(oldData)){

          saved=
            oldData.map(
              normalizeCharacter
            );

          await putDBData(saved);

          localStorage.removeItem(KEY);

        }

      }catch(e){

        console.error(e);

      }

    }

  }


  if(!Array.isArray(saved)){

    return[];

  }


  return saved.map(
    normalizeCharacter
  );

}


async function save(){

  try{

    await putDBData(data);

    return true;

  }catch(e){

    console.error(e);

    alert(
      "保存できませんでした。"
    );

    return false;

  }

}


/* =========================
   共通
========================= */

function escapeHTML(str){

  return String(str||"")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getColor(color){

  if(
    typeof color==="string" &&
    /^#[0-9a-fA-F]{6}$/.test(color)
  ){

    return color;

  }

  return "#aaaaaa";

}


function compressImage(file){

  return new Promise(function(resolve){

    if(!file){

      resolve("");

      return;

    }

    const reader=new FileReader();

    reader.onload=function(){

      const img=new Image();

      img.onload=function(){

        const max=700;

        let w=img.width;
        let h=img.height;

        if(w>max || h>max){

          if(w>h){

            h=Math.round(h*max/w);
            w=max;

          }else{

            w=Math.round(w*max/h);
            h=max;

          }

        }

        const canvas=
          document.createElement("canvas");

        canvas.width=w;
        canvas.height=h;

        const ctx=
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          w,
          h
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .75
          )
        );

      };

      img.onerror=function(){

        resolve(reader.result);

      };

      img.src=reader.result;

    };

    reader.onerror=function(){

      resolve("");

    };

    reader.readAsDataURL(file);

  });

}

async function saveCharacter(){

  const name=
    document
      .getElementById("characterName")
      .value
      .trim();

  if(!name){

    alert("キャラ名を入力してね！");
    return;

  }


  let color=
    document
      .getElementById("characterColor")
      .value;


  const hex=
    document
      .getElementById("characterColorHex")
      .value
      .trim();


  if(/^#[0-9a-fA-F]{6}$/.test(hex)){

    color=hex;

  }


  const file=
    document
      .getElementById("characterImage")
      .files[0];


  let image="";


  if(editingCharacter!==-1){

    image=
      data[editingCharacter].image||"";

  }


  if(file){

    image=await compressImage(file);

  }


  if(editingCharacter===-1){

    data.push({

      name:name,
      image:image,
      color:color,
      patterns:[]

    });

  }else{

    const old=data[editingCharacter];

    data[editingCharacter]={

      name:name,
      image:image,
      color:color,
      patterns:old.patterns||[]

    };

  }


  if(!await save())return;


  closeModal("characterModal");

  currentCharacter=null;

  render();

}

function getGoodsTypes(c){

  const result=[];
  const seen=new Set();


  c.patterns.forEach(function(p){

    p.goods.forEach(function(g){

      const name=g.name.trim();

      if(!name)return;

      if(!seen.has(name)){

        seen.add(name);
        result.push(name);

      }

    });

  });


  return result;

}

      goodsList=
        pattern.goods.filter(
          function(goods){

            return selectedShotTypes.includes(
              goods.name.trim()
            );

        );

    }


    if(goodsList.length===0)return;


    count++;

async function saveScreenshot(){

  const target=
    document.getElementById(
      "screenshotContent"
    );


  if(!target)return;


  if(typeof html2canvas==="undefined"){

    alert(
      "画像保存機能を読み込み中です。\n"+
      "もう一度押してみてね！"
    );

    return;

  }


  try{

    const canvas=
      await html2canvas(
        target,
        {
          backgroundColor:"#eeeeee",
          scale:2,
          useCORS:true,
          logging:false
        }
      );


    const link=
      document.createElement("a");


    link.download=
      "求め絵柄まとめ.png";


    link.href=
      canvas.toDataURL("image/png");


    link.click();

  }catch(e){

    console.error(e);

    alert(
      "画像の保存に失敗しました。"
    );

  }

}


/* =========================
   写真
========================= */

function showPhoto(src){

  if(!src)return;

  document
    .getElementById("photoLarge")
    .src=src;

  document
    .getElementById("photoView")
    .classList.add("show");

}


function closePhoto(){

  document
    .getElementById("photoView")
    .classList.remove("show");

}


/* =========================
   長押し削除
========================= */

let goodsTimer=null;
let goodsTarget=null;


function cancelLongPress(){

  if(goodsTimer!==null){

    clearTimeout(goodsTimer);
    goodsTimer=null;

  }

  goodsTarget=null;

}


document.addEventListener(
  "touchstart",
  function(e){

    const item=
      e.target.closest(
        ".goods-item"
      );


    if(!item)return;


    if(
      e.target.closest("button") ||
      e.target.closest("img")
    )return;


    cancelLongPress();

    goodsTarget=item;


    goodsTimer=setTimeout(
      async function(){

        if(!goodsTarget)return;


        const patternIndex=
          Number(
            goodsTarget.dataset.goodsPattern
          );


        const goodsIndex=
          Number(
            goodsTarget.dataset.goodsIndex
          );


        const p=
          data[currentCharacter]
            .patterns[patternIndex];


        const g=
          p&&p.goods
          ?p.goods[goodsIndex]
          :null;


        if(!g){

          cancelLongPress();
          return;

        }


        if(confirm(
          "「"+g.name+"」を削除する？"
        )){

          p.goods.splice(
            goodsIndex,
            1
          );

          await save();

          renderCharacter();

        }


        cancelLongPress();

      },
      800
    );

  },
  {passive:true}
);


document.addEventListener(
  "touchend",
  cancelLongPress,
  {passive:true}
);

document.addEventListener(
  "touchmove",
  cancelLongPress,
  {passive:true}
);

document.addEventListener(
  "touchcancel",
  cancelLongPress,
  {passive:true}
);


/* =========================
   クリック
========================= */

document.addEventListener(
  "click",
  function(e){

    const target=e.target;


    if(target.dataset.photo){

      e.stopPropagation();

      showPhoto(
        target.dataset.photo
      );

      return;

    }


    const characterCard=
      target.closest(
        "[data-character]"
      );


    if(
      characterCard &&
      !target.closest("button")
    ){

      currentCharacter=
        Number(
          characterCard.dataset.character
        );

      renderCharacter();

      return;

    }


    const shotTypeButton=
      target.closest(
        "[data-shot-type]"
      );


    if(shotTypeButton){

      const type=
        shotTypeButton.dataset.shotType;


      if(
        selectedShotTypes.includes(type)
      ){

        selectedShotTypes=
          selectedShotTypes.filter(
            function(item){

              return item!==type;

            }
          );

      }else{

        selectedShotTypes.push(type);

      }


      renderScreenshot();

      return;

    }


    const button=
      target.closest(
        "[data-action]"
      );


    if(!button)return;


    const action=
      button.dataset.action;


    if(action==="add-character"){

      openCharacterEditor(-1);
      return;

    }


    if(action==="close-character"){

      closeModal("characterModal");
      return;

    }


    if(action==="save-character"){

      saveCharacter();
      return;

    }


    if(action==="delete-character"){

      deleteCharacter();
      return;

    }


    if(action==="back"){

      currentCharacter=null;
      render();
      return;

    }


    if(action==="edit-character"){

      openCharacterEditor(
        currentCharacter
      );

      return;

    }


    if(action==="add-pattern"){

      openPatternEditor(-1);
      return;

    }


    if(action==="close-pattern"){

      closeModal("patternModal");
      return;

    }


    if(action==="save-pattern"){

      savePattern();
      return;

    }


    if(action==="edit-pattern"){

      openPatternEditor(
        Number(button.dataset.pattern)
      );

      return;

    }


    if(action==="delete-pattern"){

      deletePattern(
        Number(button.dataset.pattern)
      );

      return;

    }


    if(action==="delete-pattern-modal"){

      if(editingPattern!==-1){

        deletePattern(
          editingPattern
        );

        closeModal("patternModal");

      }

      return;

    }


    if(action==="toggle-pattern-priority"){

      togglePatternPriority(
        Number(button.dataset.pattern)
      );

      return;

    }


    if(action==="add-goods"){

      openGoodsEditor(
        Number(button.dataset.pattern),
        -1
      );

      return;

    }


    if(action==="close-goods"){

      closeModal("goodsModal");
      return;

    }


    if(action==="save-goods"){

      saveGoods();
      return;

    }


    if(action==="delete-goods"){

      deleteGoods(
        editingPattern,
        editingGoods
      );

      return;

    }


    if(action==="toggle-goods-priority"){

      toggleGoodsPriority(
        Number(button.dataset.pattern),
        Number(button.dataset.goods)
      );

      return;

    }


    if(action==="close-photo"){

      closePhoto();
      return;

    }


    if(action==="screenshot-all"){

      openScreenshot("all");
      return;

    }


    if(action==="screenshot-type"){

      openScreenshot("type");
      return;

    }


    if(action==="close-screenshot"){

      document
        .getElementById("screenshotView")
        .classList.remove("show");

      return;

    }


    if(action==="save-screenshot"){

      saveScreenshot();
      return;

    }

  }
);


/* =========================
   カラー
========================= */

document
  .getElementById("characterColor")
  .addEventListener(
    "input",
    function(){

      const value=
        this.value.toUpperCase();


      document
        .getElementById(
          "characterColorHex"
        )
        .value=value;


      document
        .getElementById(
          "colorPreview"
        )
        .style.background=value;

    }
  );


document
  .getElementById("characterColorHex")
  .addEventListener(
    "input",
    function(){

      let value=
        this.value.trim();


      if(!value.startsWith("#")){

        value="#"+value;

      }


      if(
        /^#[0-9a-fA-F]{6}$/.test(value)
      ){

        value=value.toUpperCase();


        document
          .getElementById(
            "characterColor"
          )
          .value=value;


        document
          .getElementById(
            "colorPreview"
          )
          .style.background=value;

      }

    }
  );


/* =========================
   モーダル外
========================= */

document
  .querySelectorAll(".modal-bg")
  .forEach(function(bg){

    bg.addEventListener(
      "click",
      function(e){

        if(e.target===bg){

          bg.classList.remove("show");

        }

      }
    );

  });


/* =========================
   プレビュー
========================= */

function previewFile(
  input,
  preview
){

  input.addEventListener(
    "change",
    function(){

      const file=input.files[0];


      if(!file){

        preview.style.display="none";
        return;

      }


      const reader=new FileReader();


      reader.onload=function(){

        preview.src=reader.result;

        preview.style.display="block";

      };


      reader.readAsDataURL(file);

    }
  );

}


previewFile(
  document.getElementById("characterImage"),
  document.getElementById("characterPreview")
);


previewFile(
  document.getElementById("patternImage"),
  document.getElementById("patternPreview")
);


previewFile(
  document.getElementById("goodsImage"),
  document.getElementById("goodsPreview")
);

  try{

    render();

  }catch(e){

    console.error(e);

    alert(
      "保存機能の初期化に失敗しました。"
    );

    data=[];

    render();

  }

})();

})();

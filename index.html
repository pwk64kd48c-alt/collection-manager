<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#555;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  background:#fff;
  padding:30px 20px 25px;
  border-bottom:1px solid #e5e5e5;
}

h1{
  margin:0;
  font-size:30px;
  color:#444;
}

main{
  max-width:800px;
  margin:auto;
  padding:28px 16px 60px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

.add-main{
  width:100%;
  padding:18px;
  border-radius:18px;
  background:#999;
  color:white;
  font-size:19px;
  margin-bottom:24px;
}

.add-main:active,
.action:active{
  transform:scale(.98);
}

.character-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.character-card{
  background:white;
  border-radius:18px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
  overflow:hidden;
}

.character-card:active{
  transform:scale(.98);
}

.char-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
  display:block;
}

.char-name{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
  color:#444;
}

.char-color{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
  vertical-align:middle;
}

.back{
  background:white;
  border-radius:12px;
  padding:10px 15px;
  margin-bottom:18px;
  color:#666;
}

.character-head{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  border-left:8px solid var(--theme,#aaa);
}

.character-title{
  font-size:25px;
  font-weight:bold;
  color:#444;
}

.character-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#eee;
  color:#555;
}

.action.theme{
  background:var(--theme,#999);
  color:white;
}

.priority-legend{
  margin-top:10px;
  padding:9px 11px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:11px;
  color:#888;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
}

.priority-legend-title{
  font-weight:bold;
  color:#666;
}

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.pattern-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
}

.pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.pattern-empty{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#aaa;
}

.pattern-info{
  padding:12px;
}

.pattern-name{
  font-weight:bold;
  color:#444;
  font-size:16px;
}

.goods-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.goods-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#f7f7f7;
  border-radius:9px;
  font-size:13px;
  min-width:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:pan-y;
}

.goods-thumb{
  width:38px;
  height:38px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.goods-name{
  flex:1;
  min-width:0;
  word-break:normal;
  overflow-wrap:anywhere;
}

.goods-type{
  font-size:10px;
  color:#999;
  background:#eee;
  padding:3px 6px;
  border-radius:6px;
  flex:none;
}

.priority-mark{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  padding:0;
  flex:none;
  font-size:18px;
  line-height:1;
}

.priority-none{
  color:#777;
}

.priority-yellow{
  color:#555;
}

.priority-star{
  color:#e6b400;
}

.pattern-priority{
  position:absolute;
  right:9px;
  top:8px;
  background:rgba(255,255,255,.92);
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-buttons button{
  flex:1;
  padding:7px 3px;
  border-radius:8px;
  background:#eee;
  color:#666;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:40px 10px;
}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
  color:#444;
}

label{
  display:block;
  font-size:13px;
  margin:14px 0 6px;
  color:#777;
}

input[type="text"],
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  background:white;
}

input[type="file"]{
  width:100%;
  margin-bottom:8px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:12px;
  background:#f5f5f5;
  margin-top:8px;
  display:none;
}

.color-picker-area{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#f7f7f7;
  border-radius:14px;
}

#characterColor{
  width:58px;
  height:58px;
  padding:0;
  border:0;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  background:none;
}

.color-code-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}

.color-preview{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid #ddd;
  flex:none;
}

#characterColorHex{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  text-transform:uppercase;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:13px;
  border-radius:11px;
}

.cancel{
  background:#eee;
  color:#666;
}

.save{
  background:#777;
  color:white;
}

.delete{
  background:#f0dddd;
  color:#a55;
}

.photo-view{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.photo-view.show{
  display:flex;
}

.photo-view img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:fixed;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  font-size:25px;
}


/* =========================
   スクショ画面
========================= */

.screenshot-page{
  background:#fff;
  border-radius:24px;
  padding:18px 10px 22px;
}

.screenshot-title{
  text-align:center;
  font-size:28px;
  color:#777;
  margin:0 0 24px;
  font-weight:500;
}

.screenshot-legend{
  margin:0 0 22px;
  padding:16px 12px;
  background:#f7f7f7;
  border-radius:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  font-size:20px;
  color:#777;
}

.shot-controls{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.shot-controls button{
  flex:1;
  padding:10px;
  border-radius:11px;
  background:#eee;
  color:#666;
}

.shot-controls button.active{
  background:#888;
  color:white;
}


/* 種類選択 */

.shot-type-box{
  background:#f7f7f7;
  border-radius:18px;
  padding:14px;
  margin-bottom:18px;
}

.shot-type-title{
  font-weight:bold;
  color:#555;
  margin-bottom:10px;
  font-size:14px;
}

.shot-type-actions{
  display:flex;
  gap:7px;
  margin-bottom:10px;
}

.shot-type-actions button{
  flex:1;
  padding:8px;
  border-radius:9px;
  background:#fff;
  color:#666;
  border:1px solid #ddd;
  font-size:12px;
}

.shot-type-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.shot-type-check{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 10px;
  background:#fff;
  border-radius:10px;
  border:1px solid #e5e5e5;
  font-size:13px;
  color:#555;
  cursor:pointer;
  margin:0;
}

.shot-type-check input{
  width:17px;
  height:17px;
  margin:0;
  flex:none;
  accent-color:#888;
}

.shot-type-empty{
  font-size:12px;
  color:#aaa;
  padding:8px 0;
}


/* ★★★ この2列構成は固定 ★★★ */

.shot-pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.shot-pattern-card{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);
  gap:14px;
  align-items:stretch;
  padding:12px;
  border:1px solid #ddd;
  border-radius:22px;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.shot-pattern-left{
  min-width:0;
}

.shot-pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:15px;
  background:#eee;
  display:block;
}

.shot-pattern-empty{
  width:100%;
  aspect-ratio:1;
  border-radius:15px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
}

.shot-pattern-name{
  font-size:18px;
  line-height:1.15;
  font-weight:bold;
  color:#444;
  margin-top:12px;
  word-break:break-word;
}

.shot-goods-side{
  min-width:0;
}

.shot-goods-title{
  display:inline-block;
  background:#f0f3f5;
  border-radius:20px;
  padding:8px 13px;
  font-size:16px;
  color:#666;
  margin:2px 0 10px;
}

.shot-goods-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.shot-goods-item{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  padding:8px;
  background:#fff;
  border-radius:15px;
  box-shadow:0 1px 5px rgba(0,0,0,.06);
}

.shot-goods-image{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
  flex:none;
}

.shot-goods-name{
  flex:1;
  min-width:0;
  font-size:16px;
  line-height:1.25;
  color:#444;
  word-break:break-word;
}

.shot-goods-priority{
  width:35px;
  flex:none;
  text-align:center;
  font-size:27px;
  line-height:1;
}

.screenshot-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.screenshot-actions button{
  flex:1;
  padding:13px;
  border-radius:12px;
  background:#eee;
  color:#666;
}

.screenshot-actions .save-shot{
  background:#777;
  color:white;
}

.shot-no-selection{
  text-align:center;
  padding:35px 10px;
  color:#aaa;
  background:#f7f7f7;
  border-radius:15px;
  font-size:13px;
}


@media(max-width:600px){

  .screenshot-page{
    padding:14px 4px 18px;
  }

  .screenshot-title{
    font-size:25px;
    margin-bottom:18px;
  }

  .screenshot-legend{
    font-size:17px;
    gap:10px;
    padding:13px 8px;
  }

  .shot-type-list{
    grid-template-columns:1fr 1fr;
  }

  .shot-pattern-grid{
    grid-template-columns:1fr;
    gap:12px;
  }

  .shot-pattern-card{
    grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
    gap:9px;
    padding:9px;
    border-radius:17px;
  }

  .shot-pattern-name{
    font-size:16px;
    margin-top:8px;
  }

  .shot-goods-title{
    font-size:14px;
    padding:7px 10px;
  }

  .shot-goods-item{
    padding:6px;
    gap:6px;
  }

  .shot-goods-image{
    width:40px;
    height:40px;
  }

  .shot-goods-name{
    font-size:14px;
  }

  .shot-goods-priority{
    font-size:24px;
    width:29px;
  }

}

@media(max-width:420px){

  .character-list,
  .pattern-grid{
    gap:10px;
  }

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .small-buttons button{
    font-size:11px;
  }

}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>
</header>

<main id="app"></main>


<!-- =========================
     キャラ編集
========================= -->

<div class="modal-bg" id="characterModal">

  <div class="modal">

    <h2 id="characterModalTitle">
      キャラを追加
    </h2>

    <label>キャラ名</label>

    <input
      id="characterName"
      type="text"
      placeholder="例：月永レオ">

    <label>画像</label>

    <input
      id="characterImage"
      type="file"
      accept="image/*">

    <img
      id="characterPreview"
      class="preview">

    <label>テーマカラー</label>

    <div class="color-picker-area">

      <input
        id="characterColor"
        type="color"
        value="#aaaaaa">

      <div class="color-code-area">

        <span
          id="colorPreview"
          class="color-preview"
          style="background:#aaaaaa">
        </span>

        <input
          id="characterColorHex"
          type="text"
          value="#AAAAAA"
          maxlength="7">

      </div>

    </div>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-character">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteCharacterButton"
        data-action="delete-character"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-character">
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     絵柄編集
========================= -->

<div class="modal-bg" id="patternModal">

  <div class="modal">

    <h2 id="patternModalTitle">
      絵柄を追加
    </h2>

    <label>絵柄名</label>

    <input
      id="patternName"
      type="text"
      placeholder="例：ハフアニ">

    <label>画像</label>

    <input
      id="patternImage"
      type="file"
      accept="image/*">

    <img
      id="patternPreview"
      class="preview">

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-pattern">
        キャンセル
      </button>

      <button
        class="delete"
        id="deletePatternButton"
        data-action="delete-pattern-modal"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-pattern">
        保存
      </button>

    </div>

  </div>

</div>


<!-- =========================
     グッズ編集
========================= -->

<div class="modal-bg" id="goodsModal">

  <div class="modal">

    <h2 id="goodsModalTitle">
      グッズを追加
    </h2>

    <label>グッズ名</label>

    <input
      id="goodsName"
      type="text"
      placeholder="例：チェキ">

    <label>種類</label>

    <input
      id="goodsType"
      type="text"
      placeholder="例：チェキ / 缶バッジ / ぱしゃっつ">

    <label>画像</label>

    <input
      id="goodsImage"
      type="file"
      accept="image/*">

    <img
      id="goodsPreview"
      class="preview">

    <label>優先度</label>

    <select id="goodsPriority">

      <option value="0">
        ☆ 通常
      </option>

      <option value="1">
        ★ 優先
      </option>

      <option value="2">
        ⭐️ 最優先
      </option>

    </select>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-goods">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteGoodsButton"
        data-action="delete-goods"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-goods">
        保存
      </button>

    </div>

  </div>

</div>


<!-- 写真拡大 -->

<div
  class="photo-view"
  id="photoView">

  <button
    class="close-photo"
    data-action="close-photo">
    ×
  </button>

  <img id="photoLarge">

</div>


<script>

(function(){

"use strict";


/* =========================
   設定
========================= */

const KEY =
  "collectionData";

const DB_NAME =
  "CollectionDB";

const DB_VERSION =
  1;

const DB_STORE =
  "data";


let data = [];

let currentCharacter = null;

let editingCharacter = -1;

let editingPattern = -1;

let editingGoods = -1;

let screenshotMode = "all";

let screenshotCharacter = -1;

/*
  種類別スクショで選択されている種類
  配列にすることで複数選択可能
*/
let screenshotSelectedTypes = [];


const app =
  document.getElementById("app");


/* =========================
   優先度
========================= */

function normalizePriority(value){

  if(value === true){
    return 2;
  }

  if(
    value === false ||
    value === undefined ||
    value === null
  ){
    return 0;
  }

  const text =
    String(value);

  if(
    text.includes("最優先") ||
    text.includes("⭐")
  ){
    return 2;
  }

  if(
    text.includes("優先") ||
    text.includes("🟡") ||
    text.includes("★")
  ){
    return 1;
  }

  const n =
    Number(value);

  if(n >= 2){
    return 2;
  }

  if(n === 1){
    return 1;
  }

  return 0;
}


function priorityMark(priority){

  const p =
    normalizePriority(priority);

  if(p === 2){
    return "⭐️";
  }

  if(p === 1){
    return "★";
  }

  return "☆";
}


function priorityClass(priority){

  const p =
    normalizePriority(priority);

  if(p === 2){
    return "priority-star";
  }

  if(p === 1){
    return "priority-yellow";
  }

  return "priority-none";
}


function nextPriority(priority){

  return (
    normalizePriority(priority) + 1
  ) % 3;

}


/* =========================
   データ正規化
   ※既存データを消さない
========================= */

function normalizeGoods(g){

  if(typeof g === "string"){

    return {
      name:g,
      image:"",
      priority:0,
      type:"未分類"
    };

  }

  g = g || {};

  let type =
    g.type ||
    g.goodsType ||
    "";

  /*
    昔のデータに type がない場合でも
    グッズ自体は残す。
  */
  if(!String(type).trim()){
    type = "未分類";
  }

  return {

    name:String(g.name || ""),

    image:
      typeof g.image === "string"
      ? g.image
      : "",

    priority:
      normalizePriority(g.priority),

    type:
      String(type)

  };

}


function normalizePattern(p){

  p = p || {};

  return {

    name:String(p.name || ""),

    image:
      typeof p.image === "string"
      ? p.image
      : "",

    priority:
      normalizePriority(p.priority),

    goods:
      Array.isArray(p.goods)
      ? p.goods.map(normalizeGoods)
      : []

  };

}


function normalizeCharacter(c){

  c = c || {};

  return {

    name:String(c.name || ""),

    image:
      typeof c.image === "string"
      ? c.image
      : "",

    color:
      c.color || "#aaaaaa",

    patterns:
      Array.isArray(c.patterns)
      ? c.patterns.map(normalizePattern)
      : []

  };

}


/* =========================
   IndexedDB
========================= */

function openDB(){

  return new Promise(
    function(resolve,reject){

      if(!window.indexedDB){

        resolve(null);

        return;

      }

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        function(e){

          const db =
            e.target.result;

          if(
            !db.objectStoreNames.contains(
              DB_STORE
            )
          ){

            db.createObjectStore(
              DB_STORE
            );

          }

        };

      request.onsuccess =
        function(){

          resolve(
            request.result
          );

        };

      request.onerror =
        function(){

          resolve(null);

        };

    }
  );

}


async function saveIndexedDB(){

  try{

    const db =
      await openDB();

    if(!db){

      return;

    }

    await new Promise(
      function(resolve){

        const tx =
          db.transaction(
            DB_STORE,
            "readwrite"
          );

        const store =
          tx.objectStore(
            DB_STORE
          );

        store.put(
          JSON.parse(
            JSON.stringify(data)
          ),
          "collectionData"
        );

        tx.oncomplete =
          function(){

            resolve();

          };

        tx.onerror =
          function(){

            resolve();

          };

      }
    );

    db.close();

  }catch(e){

    console.log(
      "IndexedDB保存エラー",
      e
    );

  }

}


async function loadIndexedDB(){

  try{

    const db =
      await openDB();

    if(!db){

      return null;

    }

    const result =
      await new Promise(
        function(resolve){

          const tx =
            db.transaction(
              DB_STORE,
              "readonly"
            );

          const store =
            tx.objectStore(
              DB_STORE
            );

          const request =
            store.get(
              "collectionData"
            );

          request.onsuccess =
            function(){

              resolve(
                request.result || null
              );

            };

          request.onerror =
            function(){

              resolve(null);

            };

        }
      );

    db.close();

    if(!Array.isArray(result)){

      return null;

    }

    return result.map(
      normalizeCharacter
    );

  }catch(e){

    console.log(
      "IndexedDB読み込みエラー",
      e
    );

    return null;

  }

}


/* =========================
   localStorage
========================= */

function loadLocalStorage(){

  try{

    const raw =
      localStorage.getItem(KEY);

    if(!raw){

      return [];

    }

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){

      return [];

    }

    return parsed.map(
      normalizeCharacter
    );

  }catch(e){

    console.log(
      "localStorage読み込みエラー",
      e
    );

    return [];

  }

}


async function save(){

  /*
    先にlocalStorageへ保存。
    今まで使っていた保存先なので、
    既存データとの互換性を維持。
  */

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );

  }catch(e){

    alert(
      "保存できませんでした。\n" +
      "画像が大きすぎる可能性があります。"
    );

    return;

  }

  /*
    IndexedDBにも同じデータを保存
  */

  await saveIndexedDB();

}


/* =========================
   初期データ読み込み
========================= */

async function initializeData(){

  const localData =
    loadLocalStorage();

  /*
    localStorageにデータがある場合は
    それを最優先で使う。

    これにより、古いIndexedDBの空データで
    今あるデータが上書きされる事故を防ぐ。
  */

  if(localData.length > 0){

    data =
      localData;

    /*
      正規化後の形を保存。
      データ自体は削除しない。
    */

    try{

      localStorage.setItem(
        KEY,
        JSON.stringify(data)
      );

    }catch(e){}

    /*
      IndexedDBにも現在のデータを同期
    */

    await saveIndexedDB();

    return;

  }


  /*
    localStorageが空の場合だけ
    IndexedDBを確認。
  */

  const dbData =
    await loadIndexedDB();

  if(
    Array.isArray(dbData) &&
    dbData.length > 0
  ){

    data =
      dbData;

    try{

      localStorage.setItem(
        KEY,
        JSON.stringify(data)
      );

    }catch(e){}

    return;

  }

  data = [];

}


/* =========================
   共通
========================= */

function esc(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getColor(color){

  if(
    typeof color === "string" &&
    /^#[0-9a-fA-F]{6}$/.test(color)
  ){

    return color;

  }

  const colors = {

    "赤":"#e57373",
    "ピンク":"#f48fb1",
    "オレンジ":"#ffb74d",
    "黄色":"#fff176",
    "緑":"#81c784",
    "水色":"#80cbc4",
    "青":"#64b5f6",
    "紫":"#9575cd",
    "茶色":"#a1887f",
    "黒":"#555555",
    "白":"#dddddd",
    "グレー":"#aaaaaa"

  };

  return colors[color] || "#aaaaaa";

}


function compressImage(file){

  return new Promise(
    function(resolve){

      if(!file){

        resolve("");

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const img =
            new Image();

          img.onload =
            function(){

              const max = 600;

              let w = img.width;
              let h = img.height;

              if(
                w > max ||
                h > max
              ){

                if(w > h){

                  h =
                    Math.round(
                      h * max / w
                    );

                  w = max;

                }else{

                  w =
                    Math.round(
                      w * max / h
                    );

                  h = max;

                }

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width = w;
              canvas.height = h;

              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };

          img.onerror =
            function(){

              resolve(
                reader.result
              );

            };

          img.src =
            reader.result;

        };

      reader.onerror =
        function(){

          resolve("");

        };

      reader.readAsDataURL(file);

    }
  );

}

  if(
    !/^#[0-9a-fA-F]{6}$/.test(value)
  ){

    value =
      "#aaaaaa";

    .getElementById("characterColor")
    .value =

  document
    .getElementById("characterColorHex")
    .value =

    document

        data[editingCharacter]

  await save();

/* =========================
   スクショ
========================= */

function shot(mode){

  screenshotCharacter =
    currentCharacter;

  screenshotMode =
    mode;

  screenshotSelectedTypes = [];

  renderShot();

}


function getScreenshotTypes(c){

  const types = [];

  c.patterns.forEach(
    function(p){

      p.goods.forEach(
        function(g){

          const type =
            String(
              g.type ||
              "未分類"
            ).trim() ||
            "未分類";

          if(
            !types.includes(type)
          ){

            types.push(type);

          }

        }
      );

    }
  );

  return types;

}


/*
  現在選択されている種類だけ
  表示するか判定
*/

function isGoodsVisibleForShot(g){

  if(
    screenshotMode === "all"
  ){

    return true;

  }

  const type =
    String(
      g.type ||
      "未分類"
    ).trim() ||
    "未分類";

  return screenshotSelectedTypes
    .includes(type);

}


function renderShot(){

  const c =
    data[screenshotCharacter];

  if(!c){

    return;

  }

  const types =
    getScreenshotTypes(c);


  /*
    選択済みの種類が
    今存在しなくなった場合は除外
  */

  screenshotSelectedTypes =
    screenshotSelectedTypes.filter(
      function(type){

        return types.includes(type);

      }
    );


  let html = `

    <div class="screenshot-page">

      <div class="screenshot-title">
        求め絵柄まとめ
      </div>

      <div class="screenshot-legend">

        <span>
          優先度：
        </span>

        <span>
          ☆ 通常
        </span>

        <span>
          ★ 優先
        </span>

        <span>
          ⭐️ 最優先
        </span>

      </div>

      <div class="shot-controls">

        <button
          class="${screenshotMode === "all" ? "active" : ""}"
          data-action="shot-all">
          まとめて
        </button>

        <button
          class="${screenshotMode === "type" ? "active" : ""}"
          data-action="shot-type">
          種類別
        </button>

      </div>

  `;


  /* =========================
     種類別チェックボックス
  ========================= */

  if(
    screenshotMode === "type"
  ){

    html += `

      <div class="shot-type-box">

        <div class="shot-type-title">
          📋 スクショする種類を選択
        </div>

        <div class="shot-type-actions">

          <button
            data-action="shot-select-all">
            ☑ 全選択
          </button>

          <button
            data-action="shot-clear-all">
            □ 全解除
          </button>

        </div>

        ${
          types.length
          ? `
            <div class="shot-type-list">

              ${
                types.map(
                  function(type){

                    const checked =
                      screenshotSelectedTypes
                        .includes(type);

                    return `

                      <label class="shot-type-check">

                        <input
                          type="checkbox"
                          data-shot-type="${esc(type)}"
                          ${checked ? "checked" : ""}>

                        <span>
                          ${esc(type)}
                        </span>

                      </label>

                    `;

                  }
                ).join("")
              }

            </div>
          `
          : `
            <div class="shot-type-empty">
              まだグッズの種類が登録されていません
            </div>
          `
        }

      </div>

    `;

  }


  /*
    選択されたグッズだけで
    絵柄カードを作る
  */

  let visiblePatternCount = 0;


  html += `
      <div class="shot-pattern-grid">
  `;


  c.patterns.forEach(
    function(p){

      const goods =
        (p.goods || []).filter(
          isGoodsVisibleForShot
        );


      if(!goods.length){

        return;

      }


      visiblePatternCount++;


      html += `

        <div class="shot-pattern-card">

          <div class="shot-pattern-left">

            ${
              p.image
              ? `
                <img
                  class="shot-pattern-image"
                  src="${p.image}">
              `
              : `
                <div class="shot-pattern-empty">
                  画像なし
                </div>
              `
            }

            <div class="shot-pattern-name">
              ${esc(p.name)}
            </div>

          </div>


          <div class="shot-goods-side">

            <div class="shot-goods-title">
              求めてるグッズ
            </div>

            <div class="shot-goods-list">

      `;


      goods.forEach(
        function(g){

          html += `

            <div class="shot-goods-item">

              ${
                g.image
                ? `
                  <img
                    class="shot-goods-image"
                    src="${g.image}">
                `
                : `
                  <div class="shot-goods-image"></div>
                `
              }

              <div class="shot-goods-name">
                ${esc(g.name)}
              </div>

              <div class="shot-goods-priority">
                ${priorityMark(g.priority)}
              </div>

            </div>

          `;

        }
      );


      html += `

            </div>

          </div>

        </div>

      `;

    }
  );


  if(
    screenshotMode === "type" &&
    screenshotSelectedTypes.length === 0
  ){

    html += `

      <div class="shot-no-selection">
        上のチェックボックスから<br>
        スクショしたい種類を選んでね
      </div>

    `;

  }else if(
    screenshotMode === "type" &&
    visiblePatternCount === 0
  ){

    html += `

      <div class="shot-no-selection">
        選択した種類のグッズがありません
      </div>

    `;

  }


  html += `

      </div>

      <div class="screenshot-actions">

        <button
          data-action="close-screenshot">
          ← 戻る
        </button>

        <button
          class="save-shot"
          data-action="save-screenshot">
          📸 画像として保存
        </button>

      </div>

    </div>

  `;


  app.innerHTML =
    html;

}


/* =========================
   種類チェック
========================= */

function toggleShotType(type){

  if(
    screenshotSelectedTypes
      .includes(type)
  ){

    screenshotSelectedTypes =
      screenshotSelectedTypes.filter(
        function(t){
          return t !== type;
        }
      );

  }else{

    screenshotSelectedTypes.push(
      type
    );

  }

  renderShot();

}


/* =========================
   スクショ保存
========================= */

async function saveShot(){

  if(
    typeof html2canvas ===
    "undefined"
  ){

    alert(
      "スクショ機能の読み込みに失敗しました。\nページを再読み込みしてね。"
    );

    return;

  }


  const element =
    document.querySelector(
      ".screenshot-page"
    );

  if(!element){

    return;

  }


  try{

    const canvas =
      await html2canvas(
        element,
        {
          backgroundColor:"#fff",
          scale:2,
          useCORS:true
        }
      );

    const a =
      document.createElement("a");

    const modeName =
      screenshotMode === "type"
      ? "種類別"
      : "まとめ";

    a.download =
      "Collection_求め絵柄まとめ_" +
      modeName +
      ".png";

    a.href =
      canvas.toDataURL(
        "image/png"
      );

    a.click();

  }catch(e){

    console.error(e);

    alert(
      "画像の保存に失敗しました。"
    );

  }

}


/* =========================
   写真
========================= */

function show(src){

  if(!src){

    return;

  }

  document
    .getElementById("photoLarge")
    .src =
    src;

  document
    .getElementById("photoView")
    .classList
    .add("show");

}


function closePhoto(){

  document
    .getElementById("photoView")
    .classList
    .remove("show");

}


/* =========================
   プレビュー
========================= */

function preview(
  input,
  img
){

  input.onchange =
    function(){

      const file =
        input.files[0];

      if(!file){

        img.style.display =
          "none";

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          img.src =
            reader.result;

          img.style.display =
            "block";

        };

      reader.readAsDataURL(
        file
      );

    };

}


/* =========================
   ボタン
========================= */

document.addEventListener(
  "click",
  function(e){

    const target =
      e.target;


    /*
      写真
    */

    if(
      target.dataset.photo
    ){

      show(
        target.dataset.photo
      );

      return;

    }


    /*
      キャラカード
    */

    const characterCard =
      target.closest(
        "[data-character]"
      );


    if(
      characterCard &&
      !target.closest("button")
    ){

      currentCharacter =
        Number(
          characterCard.dataset.character
        );

      renderCharacter();

      return;

    }


    const button =
      target.closest(
        "[data-action]"
      );


    if(!button){

      return;

    }


    const action =
      button.dataset.action;


    /* キャラ */

    if(
      action ===
      "add-character"
    ){

      openChar(-1);

      return;

    }


    if(
      action ===
      "close-character"
    ){

      modal(
        "characterModal",
        false
      );

      return;

    }


    if(
      action ===
      "save-character"
    ){

      saveChar();

      return;

    }


    if(
      action ===
      "delete-character"
    ){

      delChar();

      return;

    }


    if(
      action ===
      "back"
    ){

      currentCharacter =
        null;

      render();

      return;

    }


    if(
      action ===
      "edit-character"
    ){

      openChar(
        currentCharacter
      );

      return;

    }


    /* 絵柄 */

    if(
      action ===
      "add-pattern"
    ){

      openPattern(-1);

      return;

    }


    if(
      action ===
      "close-pattern"
    ){

      modal(
        "patternModal",
        false
      );

      return;

    }


    if(
      action ===
      "save-pattern"
    ){

      savePattern();

      return;

    }


    if(
      action ===
      "edit-pattern"
    ){

      openPattern(
        Number(
          button.dataset.pattern
        )
      );

      return;

    }


    if(
      action ===
      "delete-pattern"
    ){

      delPattern(
        Number(
          button.dataset.pattern
        )
      );

      return;

    }


    if(
      action ===
      "delete-pattern-modal"
    ){

      delPattern(
        editingPattern
      );

      modal(
        "patternModal",
        false
      );

      return;

    }


    if(
      action ===
      "toggle-pattern-priority"
    ){

      const p =
        data[currentCharacter]
          .patterns[
            Number(
              button.dataset.pattern
            )
          ];

      p.priority =
        nextPriority(
          p.priority
        );

      save();

      renderCharacter();

      return;

    }


    /* グッズ */

    if(
      action ===
      "add-goods"
    ){

      openGoods(
        Number(
          button.dataset.pattern
        ),
        -1
      );

      return;

    }


    if(
      action ===
      "edit-goods"
    ){

      openGoods(
        Number(
          button.dataset.pattern
        ),
        Number(
          button.dataset.goods
        )
      );

      return;

    }


    if(
      action ===
      "close-goods"
    ){

      modal(
        "goodsModal",
        false
      );

      return;

    }


    if(
      action ===
      "save-goods"
    ){

      saveGoods();

      return;

    }


    if(
      action ===
      "delete-goods"
    ){

      delGoods();

      return;

    }


    if(
      action ===
      "toggle-goods-priority"
    ){

      const g =
        data[currentCharacter]
          .patterns[
            Number(
              button.dataset.pattern
            )
          ]
          .goods[
            Number(
              button.dataset.goods
            )
          ];

      g.priority =
        nextPriority(
          g.priority
        );

      save();

      renderCharacter();

      return;

    }


    /* スクショ */

    if(
      action ===
      "open-screenshot"
    ){

      shot("all");

      return;

    }


    if(
      action ===
      "open-type-screenshot"
    ){

      shot("type");

      return;

    }


    if(
      action ===
      "shot-all"
    ){

      screenshotMode =
        "all";

      screenshotSelectedTypes =
        [];

      renderShot();

      return;

    }


    if(
      action ===
      "shot-type"
    ){

      screenshotMode =
        "type";

      renderShot();

      return;

    }


    /*
      種類を全部選択
    */

    if(
      action ===
      "shot-select-all"
    ){

      const c =
        data[screenshotCharacter];

      screenshotSelectedTypes =
        getScreenshotTypes(c);

      renderShot();

      return;

    }


    /*
      種類を全部解除
    */

    if(
      action ===
      "shot-clear-all"
    ){

      screenshotSelectedTypes =
        [];

      renderShot();

      return;

    }


    if(
      action ===
      "close-screenshot"
    ){

      currentCharacter =
        screenshotCharacter;

      render();

      return;

    }


    if(
      action ===
      "save-screenshot"
    ){

      saveShot();

      return;

    }


    /* 写真 */

    if(
      action ===
      "close-photo"
    ){

      closePhoto();

      return;

    }

  }
);

/* =========================
   長押し削除
========================= */

let longPressTimer = null;

let longPressTarget = null;


function cancelLongPress(){

  if(longPressTimer){

    clearTimeout(
      longPressTimer
    );

  }

  longPressTimer =
    null;

  longPressTarget =
    null;

}


document.addEventListener(
  "touchstart",
  function(e){

    const item =
      e.target.closest(
        ".goods-item"
      );

    if(
      !item ||
      e.target.closest("button") ||
      e.target.closest("img")
    ){

      return;

    }

    cancelLongPress();

    longPressTarget =
      item;

    longPressTimer =
      setTimeout(
        function(){

          if(
            !longPressTarget
          ){

            return;

          }

          const pi =
            Number(
              longPressTarget
                .dataset
                .goodsPattern
            );

          const gi =
            Number(
              longPressTarget
                .dataset
                .goodsIndex
            );

          const g =
            data[currentCharacter]
              ?.patterns[pi]
              ?.goods[gi];

          if(
            g &&
            confirm(
              "「" +
              g.name +
              "」を削除する？"
            )
          ){

            data[currentCharacter]
              .patterns[pi]
              .goods
              .splice(
                gi,
                1
              );

            save();

            renderCharacter();

          }

          cancelLongPress();

        },
        800
      );

  },
  {
    passive:true
  }
);


document.addEventListener(
  "touchend",
  cancelLongPress,
  {
    passive:true
  }
);


document.addEventListener(
  "touchmove",
  cancelLongPress,
  {
    passive:true
  }
);


document.addEventListener(
  "touchcancel",
  cancelLongPress,
  {
    passive:true
  }
);

      )

      data[currentCharacter]
        .patterns[pi]
        .goods
        .splice(

        );

    }

  }
);


/* =========================
   html2canvas
   scriptを増やさず読み込む
========================= */

function loadHtml2Canvas(){

  return new Promise(
    function(resolve){

      if(
        typeof html2canvas !==
        "undefined"
      ){

        resolve();

        return;

      }

      const script =
        document.createElement(
          "script"
        );

      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";

      script.onload =
        function(){

          resolve();

        };

      script.onerror =
        function(){

          resolve();

        };

      document.head.appendChild(
        script
      );

    }
  );

}

})();


})();

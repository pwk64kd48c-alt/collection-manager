<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Collection データ救出</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f5f5f7;
  color:#333;
}

.box{
  max-width:620px;
  margin:auto;
  background:#fff;
  border-radius:22px;
  padding:26px 20px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
  margin:0 0 18px;
  font-size:23px;
}

p{
  line-height:1.7;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button:active{
  transform:scale(.98);
}

#recover{
  background:#333;
  color:#fff;
}

#download{
  background:#e8e8e8;
  color:#333;
  display:none;
}

#result{
  margin-top:20px;
  padding:16px;
  border-radius:14px;
  background:#f2f2f2;
  white-space:pre-wrap;
  word-break:break-word;
  line-height:1.6;
  display:none;
}

.ok{
  color:#16803c;
}

.ng{
  color:#c62828;
}

.note{
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="box">

  <h1>📦 Collection データ救出</h1>

  <p>
    前のCollectionに保存されているデータを探して、
    見つかったデータをそのままバックアップします。
  </p>

  <p>
    <strong>⚠️ 保存データを書き換えたり削除したりしません。</strong>
  </p>

  <p class="note">
    ※このページでは「探す」と「保存」だけを行います。
  </p>

  <button
    id="recover"
    type="button">
    🔎 前のデータを探す
  </button>

  <button
    id="download"
    type="button">
    💾 見つかったデータを保存する
  </button>

  <div id="result"></div>

</div>


<script>

(function(){

"use strict";


/* =========================================
   基本設定
========================================= */

const TARGET_KEY = "collectionData";

let recoveredData = null;


/* =========================================
   要素
========================================= */

const recoverButton =
  document.getElementById("recover");

const downloadButton =
  document.getElementById("download");

const result =
  document.getElementById("result");


/* =========================================
   結果表示
========================================= */

function show(message,type){

  result.style.display = "block";

  result.className = type || "";

  result.textContent = message;

}


/* =========================================
   データらしいか判定
========================================= */

function looksLikeCollectionData(value){

  if(!value){
    return false;
  }

  if(Array.isArray(value)){

    if(value.length === 0){
      return false;
    }

    return value.some(function(item){

      return (
        item &&
        typeof item === "object" &&
        (
          "name" in item ||
          "patterns" in item ||
          "goods" in item
        )
      );

    });

  }


  if(typeof value === "object"){

    return (
      "name" in value ||
      "patterns" in value ||
      "goods" in value ||
      "collectionData" in value
    );

  }


  return false;

}


/* =========================================
   JSONを安全に解析
========================================= */

function tryParse(value){

  if(typeof value !== "string"){
    return value;
  }

  try{

    return JSON.parse(value);

  }catch(e){

    return null;

  }

}


/* =========================================
   localStorageを探す
========================================= */

function searchLocalStorage(){

  const results = [];

  try{

    for(let i = 0; i < localStorage.length; i++){

      const key =
        localStorage.key(i);

      if(!key){
        continue;
      }

      const raw =
        localStorage.getItem(key);

      if(raw === null){
        continue;
      }

      const parsed =
        tryParse(raw);


      /*
        collectionDataは最優先
      */

      if(key === TARGET_KEY){

        if(parsed !== null){

          results.push({
            source:"localStorage",
            key:key,
            data:parsed,
            priority:1
          });

        }

        continue;

      }


      /*
        その他の保存データも確認
      */

      if(looksLikeCollectionData(parsed)){

        results.push({
          source:"localStorage",
          key:key,
          data:parsed,
          priority:2
        });

      }

    }

  }catch(error){

    console.log(
      "localStorage確認エラー",
      error
    );

  }

  return results;

}


/* =========================================
   IndexedDBを1個確認
========================================= */

function searchIndexedDB(name){

  return new Promise(function(resolve){

    let finished = false;

    function done(value){

      if(finished){
        return;
      }

      finished = true;

      resolve(value);

    }


    try{

      const request =
        indexedDB.open(name);


      request.onerror =
        function(){

          done([]);

        };


      request.onsuccess =
        function(){

          const db =
            request.result;

          const found = [];


          try{

            const storeNames =
              Array.from(db.objectStoreNames);


            storeNames.forEach(function(storeName){

              try{

                const transaction =
                  db.transaction(
                    storeName,
                    "readonly"
                  );


                const store =
                  transaction.objectStore(
                    storeName
                  );


                const requestAll =
                  store.getAll();


                requestAll.onsuccess =
                  function(){

                    const records =
                      requestAll.result || [];


                    records.forEach(function(record){

                      /*
                        collectionDataというキー
                      */

                      if(
                        storeName === "appData" &&
                        record &&
                        typeof record === "object" &&
                        record.key === TARGET_KEY
                      ){

                        let data =
                          record.value;

                        data =
                          tryParse(data);


                        if(data !== null){

                          found.push({
                            source:"IndexedDB",
                            database:name,
                            store:storeName,
                            key:TARGET_KEY,
                            data:data,
                            priority:1
                          });

                        }

                      }


                      /*
                        レコードそのものがCollectionデータの場合
                      */

                      if(
                        looksLikeCollectionData(record)
                      ){

                        found.push({
                          source:"IndexedDB",
                          database:name,
                          store:storeName,
                          key:"",
                          data:record,
                          priority:2
                        });

                      }


                      /*
                        {value: ...} の形
                      */

                      if(
                        record &&
                        typeof record === "object" &&
                        "value" in record
                      ){

                        const value =
                          tryParse(record.value);


                        if(
                          looksLikeCollectionData(value)
                        ){

                          found.push({
                            source:"IndexedDB",
                            database:name,
                            store:storeName,
                            key:record.key || "",
                            data:value,
                            priority:1
                          });

                        }

                      }

                    });


                    done(found);

                  };


                requestAll.onerror =
                  function(){

                    done(found);

                  };

              }catch(error){

                console.log(
                  "IndexedDB store error",
                  error
                );

              }

            });


            /*
              storeがない場合
            */

            if(storeNames.length === 0){

              done([]);

            }

          }catch(error){

            done([]);

          }

        };


    }catch(error){

      done([]);

    }

  });

}


/* =========================================
   IndexedDBを全部探す
========================================= */

async function searchIndexedDBAll(){

  const results = [];

  /*
    Safariなどでdatabases()が使える場合
  */

  if(
    indexedDB &&
    typeof indexedDB.databases === "function"
  ){

    try{

      const databases =
        await indexedDB.databases();


      for(
        const database of databases
      ){

        if(!database || !database.name){
          continue;
        }


        const found =
          await searchIndexedDB(
            database.name
          );


        results.push(...found);

      }

    }catch(error){

      console.log(
        "IndexedDB一覧取得エラー",
        error
      );

    }

  }


  /*
    以前使っていた可能性があるDBも直接確認
  */

  const knownNames = [
    "CollectionDB"
  ];


  for(
    const name of knownNames
  ){

    /*
      すでに調べていても再確認してOK
    */

    const found =
      await searchIndexedDB(name);


    results.push(...found);

  }


  return results;

}


/* =========================================
   重複削除
========================================= */

function removeDuplicates(list){

  const result = [];

  const seen = new Set();


  list.forEach(function(item){

    try{

      const signature =
        JSON.stringify(item.data);


      if(seen.has(signature)){
        return;
      }


      seen.add(signature);

      result.push(item);

    }catch(error){

      result.push(item);

    }

  });


  return result;

}


/* =========================================
   データを探す
========================================= */

async function recover(){

  downloadButton.style.display =
    "none";

  recoveredData = null;


  recoverButton.disabled =
    true;


  recoverButton.textContent =
    "🔎 探しています…";


  show(
    "🔎 前のデータを探しています…"
  );


  try{

    /*
      まずlocalStorage
    */

    const localResults =
      searchLocalStorage();


    /*
      IndexedDB
    */

    const indexedResults =
      await searchIndexedDBAll();


    /*
      合体
    */

    let allResults =
      localResults.concat(
        indexedResults
      );


    allResults =
      removeDuplicates(
        allResults
      );


    /*
      優先度順
    */

    allResults.sort(
      function(a,b){

        return (
          a.priority -
          b.priority
        );

      }
    );


    /* =====================================
       見つからなかった
    ===================================== */

    if(allResults.length === 0){

      show(
        "❌ 前のデータが見つかりませんでした。\n\n" +
        "localStorage と IndexedDB を確認しました。",
        "ng"
      );

      return;

    }


    /* =====================================
       データ発見
    ===================================== */

    /*
      一番優先度の高いデータを採用
    */

    recoveredData =
      allResults[0].data;


    let message =
      "✅ データが見つかりました！\n\n";


    message +=
      "見つかった場所：\n";


    allResults.forEach(
      function(item,index){

        message +=
          "・";


        if(item.source === "localStorage"){

          message +=
            "localStorage / " +
            item.key;

        }else{

          message +=
            "IndexedDB / " +
            item.database +
            " / " +
            item.store;

        }


        if(index === 0){

          message +=
            " ← 使用するデータ";

        }


        message +=
          "\n";

      }
    );


    message +=
      "\nこのデータをそのままバックアップできます。";


    show(
      message,
      "ok"
    );


    downloadButton.style.display =
      "block";


  }catch(error){

    console.error(error);


    show(
      "⚠️ データ検索中にエラーが発生しました。\n\n" +
      String(error),
      "ng"
    );

  }finally{

    recoverButton.disabled =
      false;

    recoverButton.textContent =
      "🔎 前のデータを探す";

  }

}


/* =========================================
   バックアップ保存
========================================= */

function downloadBackup(){

  if(
    recoveredData === null ||
    recoveredData === undefined
  ){

    show(
      "❌ 保存できるデータがありません。",
      "ng"
    );

    return;

  }


  try{

    const backup = {

      app:
        "Collection",

      createdAt:
        new Date().toISOString(),

      data:
        recoveredData

    };


    const json =
      JSON.stringify(
        backup,
        null,
        2
      );


    const blob =
      new Blob(
        [json],
        {
          type:"application/json"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =
      "Collection_backup.json";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );


    show(
      "✅ バックアップを保存しました！\n\n" +
      "ファイル名：Collection_backup.json\n\n" +
      "このファイルは元データを書き換えません。",
      "ok"
    );


  }catch(error){

    console.error(error);


    show(
      "❌ バックアップ保存に失敗しました。\n\n" +
      String(error),
      "ng"
    );

  }

}


/* =========================================
   ボタン
========================================= */

/*
  addEventListenerだけに頼らず、
  onclickも設定して確実に反応させる
*/

recoverButton.onclick =
  function(){

    recover();

  };


downloadButton.onclick =
  function(){

    downloadBackup();

  };


/*
  Safari対策
*/

recoverButton.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    recover();

  },
  {
    passive:false
  }
);


downloadButton.addEventListener(
  "touchend",
  function(event){

    event.preventDefault();

    downloadBackup();

  },
  {
    passive:false
  }
);


})();

</script>

</body>
</html>

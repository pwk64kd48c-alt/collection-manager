<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Collection データ復旧</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f5f5f5;
  color:#333;
}

.box{
  max-width:600px;
  margin:auto;
  background:#fff;
  border-radius:20px;
  padding:25px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
  font-size:22px;
  margin-top:0;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#recover{
  background:#333;
  color:#fff;
}

#backup{
  background:#e9e9e9;
  color:#333;
}

#result{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#f3f3f3;
  white-space:pre-wrap;
  word-break:break-all;
  font-size:13px;
  display:none;
}

.ok{
  color:#16803c;
  font-weight:bold;
}

.ng{
  color:#c62828;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>📦 Collection データ復旧</h1>

<p>
前のCollectionに保存されていたデータを探して、
見つかった場合は現在の保存場所にも復元します。
</p>

<p>
<strong>このページでは既存データを削除しません。</strong>
</p>

<button id="recover">🔎 前のデータを探して復元</button>

<button id="backup" style="display:none;">
💾 復元データをバックアップ
</button>

<div id="result"></div>

</div>

<script>

const DB_NAME = "CollectionDB";
const OLD_STORE = "appData";
const DATA_KEY = "collectionData";

const result = document.getElementById("result");
const backupBtn = document.getElementById("backup");

let recoveredData = null;


/* =========================
   表示
========================= */

function show(message, type=""){
  result.style.display = "block";
  result.className = type;
  result.textContent = message;
}


/* =========================
   IndexedDBを開く
========================= */

function openDatabase(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(DB_NAME);

    request.onerror = () => {
      reject(request.error);
    };

    request.onsuccess = () => {
      resolve(request.result);
    };

  });

}


/* =========================
   appDataから探す
========================= */

function readOldData(db){

  return new Promise((resolve,reject)=>{

    if(!db.objectStoreNames.contains(OLD_STORE)){
      resolve(null);
      return;
    }

    try{

      const transaction =
        db.transaction(OLD_STORE,"readonly");

      const store =
        transaction.objectStore(OLD_STORE);

      const request =
        store.get(DATA_KEY);

      request.onsuccess = () => {

        if(request.result === undefined){
          resolve(null);
          return;
        }

        resolve(request.result);

      };

      request.onerror = () => {
        reject(request.error);
      };

    }catch(e){

      reject(e);

    }

  });

}


/* =========================
   データを正規化
========================= */

function normalizeData(data){

  if(!data) return null;

  /*
    前のCollectionが
    配列で保存されていた場合にも対応
  */

  if(Array.isArray(data)){
    return {
      characters:data
    };
  }

  /*
    {characters: [...]} の場合
  */

  if(
    typeof data === "object" &&
    Array.isArray(data.characters)
  ){
    return data;
  }

  return data;
}


/* =========================
   復元
========================= */

document.getElementById("recover").onclick =
async function(){

  show("🔎 データを探しています…");

  try{

    /*
      ① localStorage
    */

    let localData = null;

    try{

      const raw =
        localStorage.getItem(DATA_KEY);

      if(raw){
        localData = JSON.parse(raw);
      }

    }catch(e){}


    /*
      ② IndexedDB
    */

    let dbData = null;

    try{

      const db = await openDatabase();

      dbData = await readOldData(db);

      db.close();

    }catch(e){

      console.log("IndexedDB error:",e);

    }


    /*
      IndexedDBを優先
    */

    let found =
      dbData !== null
        ? dbData
        : localData;


    if(found === null){

      show(
        "❌ 前のデータが見つかりませんでした。\n\n"+
        "IndexedDB / localStorage の両方を確認しました。",
        "ng"
      );

      return;
    }


    /*
      result.value形式の場合
      にも対応
    */

    if(
      found &&
      typeof found === "object" &&
      "value" in found
    ){
      found = found.value;
    }


    recoveredData =
      normalizeData(found);


    if(!recoveredData){

      show(
        "❌ データは見つかりましたが、読み取れませんでした。",
        "ng"
      );

      return;
    }


    /*
      localStorageにも復元
    */

    localStorage.setItem(
      DATA_KEY,
      JSON.stringify(recoveredData)
    );


    /*
      件数確認
    */

    let characterCount = 0;

    if(Array.isArray(recoveredData)){
      characterCount = recoveredData.length;
    }

    if(
      recoveredData.characters &&
      Array.isArray(recoveredData.characters)
    ){
      characterCount =
        recoveredData.characters.length;
    }


    show(
      "✅ データを復元しました！！\n\n"+
      "キャラクター数："+
      characterCount+
      "\n\n"+
      "今のところデータは削除していません。\n"+
      "まず下の「バックアップ」を押してください。",
      "ok"
    );


    backupBtn.style.display = "block";


  }catch(e){

    console.error(e);

    show(
      "❌ 復元中にエラーが発生しました。\n\n"+
      e.message,
      "ng"
    );

  }

};


/* =========================
   JSONバックアップ
========================= */

backupBtn.onclick = function(){

  if(!recoveredData){
    return;
  }

  const blob =
    new Blob(
      [
        JSON.stringify(
          recoveredData,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "Collection_backup.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

};

</script>

</body>
</html>

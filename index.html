<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f6f6;
  color: #555;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

header {
  padding: 24px 20px 18px;
  background: white;
  border-bottom: 1px solid #e9e9e9;
}

header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  color: #444;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 18px 14px 40px;
}

button {
  border: none;
  border-radius: 10px;
  background: #8d8d8d;
  color: white;
  padding: 10px 15px;
  font-size: 14px;
  cursor: pointer;
}

button:active {
  opacity: 0.7;
}

.add-button {
  width: 100%;
  margin-bottom: 18px;
}

.back-button {
  background: #e7e7e7;
  color: #666;
  margin-bottom: 16px;
}

.character-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.character-card {
  background: white;
  border-radius: 14px;
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 13px;
  border: 1px solid #ededed;
}

.character-card img {
  width: 68px;
  height: 68px;
  object-fit: cover;
  border-radius: 10px;
  background: #eee;
  flex-shrink: 0;
}

.character-name {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
  color: #555;
}

.character-actions {
  display: flex;
  gap: 6px;
}

.small-button {
  padding: 7px 9px;
  font-size: 12px;
  background: #e5e5e5;
  color: #666;
}

.delete-button {
  background: #eeeeee;
  color: #777;
}

.page-title {
  font-size: 19px;
  font-weight: 600;
  margin: 4px 0 16px;
  color: #444;
}

.pattern-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.pattern-card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #ededed;
}

.pattern-image {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  background: #eee;
  display: block;
}

.pattern-content {
  padding: 11px;
}

.pattern-name {
  font-weight: 600;
  color: #555;
  font-size: 14px;
  margin-bottom: 9px;
}

.goods-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.goods-item {
  background: #f3f3f3;
  border-radius: 8px;
  padding: 7px 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}

.goods-text {
  flex: 1;
  word-break: break-word;
}

.goods-delete {
  border: none;
  background: transparent;
  color: #999;
  padding: 2px 4px;
  font-size: 14px;
}

.goods-add {
  width: 100%;
  margin-top: 8px;
  background: #eeeeee;
  color: #666;
  padding: 7px;
  font-size: 12px;
}

.pattern-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.pattern-actions button {
  flex: 1;
  padding: 7px;
  font-size: 12px;
  background: #eeeeee;
  color: #666;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 35px 10px;
  font-size: 13px;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 16px;
  padding: 20px;
}

.modal h2 {
  margin: 0 0 16px;
  font-size: 18px;
  color: #444;
}

.modal label {
  display: block;
  margin: 12px 0 6px;
  font-size: 13px;
  color: #777;
}

.modal input[type="text"],
.modal input[type="file"] {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 9px;
  background: #fafafa;
}

.file-name {
  margin-top: 6px;
  font-size: 11px;
  color: #999;
  word-break: break-all;
}

.modal-buttons {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}

.modal-buttons button {
  flex: 1;
}

.cancel-button {
  background: #e8e8e8;
  color: #666;
}

.current-image {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 5px;
  background: #eee;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>
</header>

<div class="container">

  <!-- キャラ一覧 -->
  <div id="characterPage">
    <button class="add-button" onclick="openCharacterModal()">
      ＋ キャラを追加
    </button>

    <div id="characterList" class="character-list"></div>
  </div>

  <!-- 絵柄一覧 -->
  <div id="patternPage" class="hidden">
    <button class="back-button" onclick="goBack()">
      ← キャラ一覧へ
    </button>

    <div id="characterTitle" class="page-title"></div>

    <button class="add-button" onclick="openPatternModal()">
      ＋ 絵柄を追加
    </button>

    <div id="patternList" class="pattern-grid"></div>
  </div>

</div>

<!-- キャラ追加・編集 -->
<div id="characterModal" class="modal-bg">
  <div class="modal">
    <h2 id="characterModalTitle">キャラを追加</h2>

    <label>キャラ名</label>
    <input id="characterName" type="text" placeholder="例：月永レオ">

    <label>キャラ画像</label>
    <input id="characterImage" type="file" accept="image/*">
    <div id="characterFileName" class="file-name"></div>

    <div id="characterCurrentImageArea" class="hidden">
      <label>現在の画像</label>
      <img id="characterCurrentImage" class="current-image">
    </div>

    <div class="modal-buttons">
      <button class="cancel-button" onclick="closeCharacterModal()">キャンセル</button>
      <button onclick="saveCharacter()">保存</button>
    </div>
  </div>
</div>

<!-- 絵柄追加・編集 -->
<div id="patternModal" class="modal-bg">
  <div class="modal">
    <h2 id="patternModalTitle">絵柄を追加</h2>

    <label>絵柄名</label>
    <input id="patternName" type="text" placeholder="例：ハフアニ">

    <label>絵柄画像</label>
    <input id="patternImage" type="file" accept="image/*">
    <div id="patternFileName" class="file-name"></div>

    <div id="patternCurrentImageArea" class="hidden">
      <label>現在の画像</label>
      <img id="patternCurrentImage" class="current-image">
    </div>

    <div class="modal-buttons">
      <button class="cancel-button" onclick="closePatternModal()">キャンセル</button>
      <button onclick="savePattern()">保存</button>
    </div>
  </div>
</div>

<script>

const STORAGE_KEY = "collectionData";

let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

let currentCharacterIndex = null;
let editingCharacterIndex = null;
let editingPatternIndex = null;


/* =========================
   保存
========================= */

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    alert("画像が大きすぎて保存できませんでした。\n別の画像で試してみてください。");
    return false;
  }
}


/* =========================
   画像圧縮
========================= */

function compressImage(file, maxSize = 600, quality = 0.75) {
  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = function(e) {

      const img = new Image();

      img.onload = function() {

        let width = img.width;
        let height = img.height;

        if (width > maxSize || height > maxSize) {

          if (width > height) {
            height = Math.round(height * maxSize / width);
            width = maxSize;
          } else {
            width = Math.round(width * maxSize / height);
            height = maxSize;
          }

        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", quality));

      };

      img.onerror = reject;
      img.src = e.target.result;
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);

  });
}


/* =========================
   キャラ一覧
========================= */

function renderCharacters() {

  const list = document.getElementById("characterList");

  list.innerHTML = "";

  if (data.length === 0) {
    list.innerHTML = `
      <div class="empty">
        まだキャラが登録されていません
      </div>
    `;
    return;
  }

  data.forEach((character, index) => {

    const card = document.createElement("div");
    card.className = "character-card";

    const image = character.image
      ? `<img src="${character.image}">`
      : `<div style="
          width:68px;
          height:68px;
          border-radius:10px;
          background:#eee;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#aaa;
          font-size:11px;
        ">画像なし</div>`;

    card.innerHTML = `
      ${image}

      <div
        class="character-name"
        onclick="openCharacter(${index})"
        style="cursor:pointer;"
      >
        ${escapeHTML(character.name)}
      </div>

      <div class="character-actions">

        <button
          class="small-button"
          onclick="event.stopPropagation(); openCharacterEdit(${index})"
        >
          編集
        </button>

        <button
          class="small-button delete-button"
          onclick="event.stopPropagation(); deleteCharacter(${index})"
        >
          🗑️
        </button>

      </div>
    `;

    card.addEventListener("click", function(e) {

      if (
        e.target.tagName === "BUTTON" ||
        e.target.closest("button")
      ) {
        return;
      }

      openCharacter(index);

    });

    list.appendChild(card);

  });
}


/* =========================
   キャラ追加
========================= */

function openCharacterModal() {

  editingCharacterIndex = null;

  document.getElementById("characterModalTitle").textContent =
    "キャラを追加";

  document.getElementById("characterName").value = "";
  document.getElementById("characterImage").value = "";
  document.getElementById("characterFileName").textContent = "";

  document.getElementById("characterCurrentImageArea")
    .classList.add("hidden");

  document.getElementById("characterModal").style.display = "flex";
}


/* =========================
   キャラ編集
========================= */

function openCharacterEdit(index) {

  editingCharacterIndex = index;

  const character = data[index];

  document.getElementById("characterModalTitle").textContent =
    "キャラを編集";

  document.getElementById("characterName").value =
    character.name || "";

  document.getElementById("characterImage").value = "";

  document.getElementById("characterFileName").textContent =
    "画像を変更しない場合はそのままでOK";

  if (character.image) {

    document.getElementById("characterCurrentImage")
      .src = character.image;

    document.getElementById("characterCurrentImageArea")
      .classList.remove("hidden");

  } else {

    document.getElementById("characterCurrentImageArea")
      .classList.add("hidden");

  }

  document.getElementById("characterModal").style.display = "flex";
}


/* =========================
   キャラ保存
========================= */

async function saveCharacter() {

  const name =
    document.getElementById("characterName").value.trim();

  const file =
    document.getElementById("characterImage").files[0];

  if (!name) {
    alert("キャラ名を入力してね！");
    return;
  }

  try {

    let image = null;

    if (editingCharacterIndex !== null) {

      image = data[editingCharacterIndex].image || null;

    }

    if (file) {
      image = await compressImage(file);
    }

    if (editingCharacterIndex === null) {

      data.push({
        name: name,
        image: image,
        patterns: []
      });

    } else {

      data[editingCharacterIndex].name = name;
      data[editingCharacterIndex].image = image;

    }

    if (!saveData()) return;

    closeCharacterModal();
    renderCharacters();

  } catch (e) {

    alert("画像の処理に失敗しました。");

  }
}


/* =========================
   キャラ削除
========================= */

function deleteCharacter(index) {

  const character = data[index];

  if (!confirm(
    `「${character.name}」を削除する？\nこのキャラの絵柄も全部削除されます。`
  )) {
    return;
  }

  data.splice(index, 1);

  saveData();
  renderCharacters();

}


/* =========================
   キャラページ
========================= */

function openCharacter(index) {

  currentCharacterIndex = index;

  document.getElementById("characterPage")
    .classList.add("hidden");

  document.getElementById("patternPage")
    .classList.remove("hidden");

  document.getElementById("characterTitle")
    .textContent = data[index].name;

  renderPatterns();

}


/* =========================
   戻る
========================= */

function goBack() {

  currentCharacterIndex = null;

  document.getElementById("patternPage")
    .classList.add("hidden");

  document.getElementById("characterPage")
    .classList.remove("hidden");

  renderCharacters();

}


/* =========================
   絵柄一覧
========================= */

function renderPatterns() {

  const list = document.getElementById("patternList");

  list.innerHTML = "";

  if (currentCharacterIndex === null) return;

  const character = data[currentCharacterIndex];

  if (!character.patterns) {
    character.patterns = [];
  }

  if (character.patterns.length === 0) {

    list.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        まだ絵柄が登録されていません
      </div>
    `;

    return;
  }

  character.patterns.forEach((pattern, patternIndex) => {

    /* 古い形式にも対応 */
    if (!Array.isArray(pattern.goods)) {

      if (pattern.goods) {
        pattern.goods = [pattern.goods];
      } else {
        pattern.goods = [];
      }

    }

    const card = document.createElement("div");
    card.className = "pattern-card";

    const image = pattern.image
      ? `<img class="pattern-image" src="${pattern.image}">`
      : `<div class="pattern-image"
          style="display:flex;align-items:center;justify-content:center;color:#aaa;">
          画像なし
        </div>`;

    let goodsHTML = "";

    if (pattern.goods.length === 0) {

      goodsHTML = `
        <div style="font-size:11px;color:#aaa;">
          グッズなし
        </div>
      `;

    } else {

      goodsHTML = pattern.goods.map((goods, goodsIndex) => {

        return `
          <div class="goods-item">

            <div class="goods-text">
              ${escapeHTML(goods)}
            </div>

            <button
              class="goods-delete"
              onclick="deleteGoods(${patternIndex}, ${goodsIndex})"
              title="削除"
            >
              ×
            </button>

          </div>
        `;

      }).join("");

    }

    card.innerHTML = `

      ${image}

      <div class="pattern-content">

        <div class="pattern-name">
          ${escapeHTML(pattern.name)}
        </div>

        <div class="goods-list">
          ${goodsHTML}
        </div>

        <button
          class="goods-add"
          onclick="addGoods(${patternIndex})"
        >
          ＋ グッズを追加
        </button>

        <div class="pattern-actions">

          <button onclick="editPattern(${patternIndex})">
            編集
          </button>

          <button onclick="deletePattern(${patternIndex})">
            🗑️ 削除
          </button>

        </div>

      </div>
    `;

    list.appendChild(card);

  });

}


/* =========================
   絵柄追加
========================= */

function openPatternModal() {

  editingPatternIndex = null;

  document.getElementById("patternModalTitle").textContent =
    "絵柄を追加";

  document.getElementById("patternName").value = "";
  document.getElementById("patternImage").value = "";
  document.getElementById("patternFileName").textContent = "";

  document.getElementById("patternCurrentImageArea")
    .classList.add("hidden");

  document.getElementById("patternModal").style.display = "flex";

}


/* =========================
   絵柄編集
========================= */

function editPattern(index) {

  editingPatternIndex = index;

  const pattern =
    data[currentCharacterIndex].patterns[index];

  document.getElementById("patternModalTitle").textContent =
    "絵柄を編集";

  document.getElementById("patternName").value =
    pattern.name || "";

  document.getElementById("patternImage").value = "";

  document.getElementById("patternFileName").textContent =
    "画像を変更しない場合はそのままでOK";

  if (pattern.image) {

    document.getElementById("patternCurrentImage")
      .src = pattern.image;

    document.getElementById("patternCurrentImageArea")
      .classList.remove("hidden");

  } else {

    document.getElementById("patternCurrentImageArea")
      .classList.add("hidden");

  }

  document.getElementById("patternModal").style.display = "flex";

}


/* =========================
   絵柄保存
========================= */

async function savePattern() {

  if (currentCharacterIndex === null) return;

  const name =
    document.getElementById("patternName").value.trim();

  const file =
    document.getElementById("patternImage").files[0];

  if (!name) {
    alert("絵柄名を入力してね！");
    return;
  }

  try {

    const character = data[currentCharacterIndex];

    if (!character.patterns) {
      character.patterns = [];
    }

    let image = null;

    if (editingPatternIndex !== null) {

      image =
        character.patterns[editingPatternIndex].image || null;

    }

    if (file) {
      image = await compressImage(file);
    }

    if (editingPatternIndex === null) {

      character.patterns.push({
        name: name,
        image: image,
        goods: []
      });

    } else {

      character.patterns[editingPatternIndex].name = name;
      character.patterns[editingPatternIndex].image = image;

    }

    if (!saveData()) return;

    closePatternModal();
    renderPatterns();

  } catch (e) {

    alert("画像の処理に失敗しました。");

  }

}


/* =========================
   絵柄削除
========================= */

function deletePattern(index) {

  const pattern =
    data[currentCharacterIndex].patterns[index];

  if (!confirm(
    `「${pattern.name}」を削除する？\nこの絵柄のグッズも全部削除されます。`
  )) {
    return;
  }

  data[currentCharacterIndex].patterns.splice(index, 1);

  saveData();
  renderPatterns();

}


/* =========================
   グッズ追加
========================= */

function addGoods(patternIndex) {

  const goods =
    prompt(
      "追加するグッズを入力してね！\n例：ぱしゃっつ 日本版"
    );

  if (goods === null) return;

  const text = goods.trim();

  if (!text) return;

  const pattern =
    data[currentCharacterIndex].patterns[patternIndex];

  if (!Array.isArray(pattern.goods)) {

    if (pattern.goods) {
      pattern.goods = [pattern.goods];
    } else {
      pattern.goods = [];
    }

  }

  pattern.goods.push(text);

  saveData();
  renderPatterns();

}


/* =========================
   グッズ削除
========================= */

function deleteGoods(patternIndex, goodsIndex) {

  const pattern =
    data[currentCharacterIndex].patterns[patternIndex];

  const goods =
    pattern.goods[goodsIndex];

  if (!confirm(
    `「${goods}」を削除する？`
  )) {
    return;
  }

  pattern.goods.splice(goodsIndex, 1);

  saveData();
  renderPatterns();

}


/* =========================
   モーダルを閉じる
========================= */

function closeCharacterModal() {

  document.getElementById("characterModal")
    .style.display = "none";

  document.getElementById("characterName").value = "";
  document.getElementById("characterImage").value = "";
  document.getElementById("characterFileName").textContent = "";

  editingCharacterIndex = null;

}


function closePatternModal() {

  document.getElementById("patternModal")
    .style.display = "none";

  document.getElementById("patternName").value = "";
  document.getElementById("patternImage").value = "";
  document.getElementById("patternFileName").textContent = "";

  editingPatternIndex = null;

}


/* =========================
   ファイル名表示
========================= */

document.getElementById("characterImage")
  .addEventListener("change", function() {

    const file = this.files[0];

    document.getElementById("characterFileName")
      .textContent = file
        ? file.name
        : "";

  });


document.getElementById("patternImage")
  .addEventListener("change", function() {

    const file = this.files[0];

    document.getElementById("patternFileName")
      .textContent = file
        ? file.name
        : "";

  });


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   初期表示
========================= */

renderCharacters();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:#555;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  padding:18px 14px 8px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
  font-weight:500;
  color:#666;
}

.top-buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:14px 0 8px;
}

.top-buttons button{
  border:0;
  background:#f3f3f3;
  color:#666;
  border-radius:12px;
  padding:9px 14px;
}

.top-buttons button:hover{
  background:#e8e8e8;
}

#app{
  max-width:1100px;
  margin:auto;
  padding:8px 12px 50px;
}

/* =========================
   キャラクター一覧
========================= */

.character-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.character-card{
  border:1px solid #ddd;
  border-radius:18px;
  padding:12px;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  min-width:0;
}

.character-card-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.character-thumb{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:14px;
  background:#f2f2f2;
  flex-shrink:0;
}

.character-name{
  font-size:18px;
  font-weight:bold;
  color:#555;
  word-break:break-word;
}

.character-card-actions{
  margin-left:auto;
  display:flex;
  gap:5px;
}

.small-btn{
  border:0;
  background:#f3f3f3;
  color:#666;
  border-radius:9px;
  padding:6px 8px;
  font-size:12px;
}

.small-btn:hover{
  background:#e7e7e7;
}

.pattern-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}

.pattern-mini{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#fafafa;
  border-radius:10px;
  min-width:0;
}

.pattern-mini img{
  width:42px;
  height:42px;
  object-fit:cover;
  border-radius:7px;
  flex-shrink:0;
}

.pattern-mini-name{
  font-size:13px;
  min-width:0;
  word-break:break-word;
}

.add-pattern-btn{
  margin-top:9px;
  width:100%;
  border:1px dashed #ccc;
  background:#fafafa;
  color:#777;
  border-radius:10px;
  padding:8px;
}

/* =========================
   詳細
========================= */

.detail-page{
  display:none;
}

.detail-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.back-btn{
  border:0;
  background:#f1f1f1;
  border-radius:10px;
  padding:8px 12px;
  color:#666;
}

.detail-title{
  font-size:22px;
  font-weight:bold;
  color:#555;
  flex:1;
}

.detail-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.detail-actions button{
  border:0;
  background:#f2f2f2;
  color:#666;
  border-radius:10px;
  padding:8px 10px;
  font-size:13px;
}

/* =========================
   絵柄
========================= */

.pattern-card{
  border:1px solid #ddd;
  border-radius:18px;
  padding:12px;
  margin-bottom:14px;
  background:#fff;
}

.pattern-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.pattern-image{
  width:95px;
  height:95px;
  object-fit:cover;
  border-radius:12px;
  background:#f3f3f3;
  flex-shrink:0;
}

.pattern-info{
  flex:1;
  min-width:0;
}

.pattern-name{
  font-size:18px;
  font-weight:bold;
  color:#555;
  word-break:break-word;
}

.pattern-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.pattern-actions button{
  border:0;
  background:#f1f1f1;
  border-radius:8px;
  padding:6px 8px;
  color:#666;
  font-size:12px;
}

/* =========================
   グッズ
========================= */

.goods-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.goods-item{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px;
  border-radius:11px;
  background:#fafafa;
  min-width:0;
}

.goods-image{
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
  flex-shrink:0;
}

.goods-info{
  flex:1;
  min-width:0;
}

.goods-name{
  font-size:14px;
  color:#555;
  word-break:break-word;
}

.goods-type{
  display:inline-block;
  margin-top:3px;
  padding:2px 6px;
  border-radius:6px;
  background:#ededed;
  color:#777;
  font-size:10px;
}

.goods-priority{
  font-size:22px;
  flex-shrink:0;
  width:30px;
  text-align:center;
}

.goods-actions{
  display:flex;
  gap:4px;
  flex-shrink:0;
}

.goods-actions button{
  border:0;
  background:#eee;
  color:#666;
  border-radius:7px;
  padding:5px 7px;
  font-size:11px;
}

.add-goods-btn{
  margin-top:8px;
  width:100%;
  border:1px dashed #ccc;
  background:#fafafa;
  color:#777;
  border-radius:10px;
  padding:8px;
}

/* =========================
   モーダル
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
  padding:15px;
}

.modal{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:20px;
}

.modal h2{
  margin:0 0 15px;
  color:#555;
  font-size:20px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  margin-bottom:5px;
  font-size:13px;
  color:#666;
}

.form-group input{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  outline:none;
}

.form-group input:focus{
  border-color:#aaa;
}

.modal-buttons{
  display:flex;
  gap:7px;
  margin-top:15px;
  flex-wrap:wrap;
}

.modal-buttons button{
  flex:1;
  min-width:90px;
  border:0;
  border-radius:10px;
  padding:10px;
  background:#eee;
  color:#666;
}

.modal-buttons .save-btn{
  background:#ddd;
  font-weight:bold;
}

.modal-buttons .delete-btn{
  background:#f3dddd;
  color:#a55;
}

/* =========================
   写真
========================= */

.photo-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2000;
  padding:20px;
}

.photo-bg img{
  max-width:95vw;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

.photo-close{
  position:fixed;
  right:15px;
  top:15px;
  border:0;
  background:#fff;
  color:#555;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:20px;
}

/* =========================
   スクショ画面
========================= */

.screenshot-page{
  display:none;
  background:#fff;
}

.screenshot-capture{
  background:#fff;
  width:100%;
}

.screenshot-title{
  text-align:center;
  font-size:26px;
  color:#777;
  margin:5px 0 25px;
  font-weight:500;
}

.priority-legend{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  background:#f7f7f7;
  border-radius:20px;
  padding:17px 10px;
  margin-bottom:45px;
  font-size:22px;
  color:#666;
  flex-wrap:wrap;
}

.priority-legend span{
  white-space:nowrap;
}

/* =========================
   スクショモード
========================= */

.shot-mode-buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:15px;
}

.shot-mode-buttons button{
  border:0;
  border-radius:10px;
  padding:8px 13px;
  background:#eee;
  color:#666;
}

.shot-mode-buttons button.active{
  background:#dcdcdc;
  font-weight:bold;
}

.shot-type-select{
  display:none;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.shot-type-select.show{
  display:flex;
}

.type-chip{
  border:0;
  border-radius:15px;
  padding:7px 12px;
  background:#f1f1f1;
  color:#666;
}

.type-chip.active{
  background:#ccc;
  font-weight:bold;
}

/* =========================
   ★ スクショ構図
   この形を固定
========================= */

.shot-character{
  width:100%;
}

.shot-pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:22px;
}

.shot-pattern-card{
  min-width:0;
  display:grid;
  grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);
  gap:14px;
  align-items:stretch;
  padding:12px;
  border:1px solid #ddd;
  border-radius:22px;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}

.shot-pattern-left{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.shot-pattern-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:17px;
  background:#eee;
}

.shot-pattern-name{
  width:100%;
  margin-top:13px;
  padding:0 2px;
  font-size:18px;
  line-height:1.3;
  font-weight:bold;
  color:#444;
  word-break:break-word;
}

.shot-goods-side{
  min-width:0;
  display:flex;
  flex-direction:column;
}

.shot-goods-title{
  display:inline-block;
  align-self:flex-start;
  background:#eef1f3;
  border-radius:18px;
  padding:8px 13px;
  font-size:15px;
  color:#555;
  margin-bottom:9px;
  white-space:nowrap;
}

.shot-goods-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.shot-goods-item{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  padding:6px;
  background:#fff;
  border-radius:14px;
}

.shot-goods-image{
  width:48px;
  height:48px;
  object-fit:cover;
  border-radius:8px;
  background:#eee;
  flex-shrink:0;
}

.shot-goods-name{
  flex:1;
  min-width:0;
  font-size:14px;
  line-height:1.3;
  color:#444;
  white-space:normal;
  word-break:keep-all;
  overflow-wrap:break-word;
}

.shot-goods-priority{
  flex-shrink:0;
  width:27px;
  text-align:center;
  font-size:23px;
}

/* =========================
   スクショ操作
========================= */

.screenshot-buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:25px 0;
  flex-wrap:wrap;
}

.screenshot-buttons button{
  border:0;
  background:#eee;
  color:#666;
  border-radius:10px;
  padding:9px 14px;
}

/* =========================
   スマホ
========================= */

@media(max-width:700px){

  #app{
    padding-left:8px;
    padding-right:8px;
  }

  /* 一覧は元の2列に戻す */
  .character-list{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .character-card{
    padding:8px;
    border-radius:14px;
  }

  .character-card-head{
    gap:6px;
  }

  .character-thumb{
    width:48px;
    height:48px;
    border-radius:10px;
  }

  .character-name{
    font-size:14px;
  }

  .character-card-actions{
    gap:3px;
  }

  .small-btn{
    padding:5px 6px;
    font-size:10px;
  }

  /* 絵柄一覧も2列 */
  .pattern-list{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:5px;
    margin-top:7px;
  }

  .pattern-mini{
    gap:5px;
    padding:5px;
  }

  .pattern-mini img{
    width:34px;
    height:34px;
  }

  .pattern-mini-name{
    font-size:10px;
  }

  .add-pattern-btn{
    padding:7px 4px;
    font-size:11px;
  }

  /* スクショ上部 */
  .screenshot-title{
    font-size:22px;
    margin-bottom:18px;
  }

  .priority-legend{
    font-size:17px;
    gap:9px;
    padding:13px 7px;
    margin-bottom:22px;
  }

  /* スクショも2列を維持 */
  .shot-pattern-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .shot-pattern-card{
    grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);
    gap:7px;
    padding:7px;
    border-radius:15px;
  }

  .shot-pattern-name{
    font-size:11px;
    margin-top:6px;
  }

  .shot-goods-title{
    font-size:9px;
    padding:5px 7px;
    margin-bottom:4px;
    border-radius:12px;
  }

  .shot-goods-list{
    gap:3px;
  }

  .shot-goods-item{
    gap:3px;
    padding:2px;
    border-radius:6px;
  }

  .shot-goods-image{
    width:28px;
    height:28px;
    border-radius:5px;
  }

  .shot-goods-name{
    font-size:8px;
    line-height:1.2;
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  .shot-goods-priority{
    width:16px;
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>

  <div class="top-buttons">
    <button data-action="show-home">一覧</button>
    <button data-action="add-character">＋ キャラ追加</button>
  </div>
</header>

<div id="app">

  <!-- HOME -->

  <section id="homePage">

    <div
      id="characterList"
      class="character-list">
    </div>

  </section>


  <!-- DETAIL -->

  <section
    id="detailPage"
    class="detail-page">

    <div class="detail-head">

      <button
        class="back-btn"
        data-action="show-home">
        ← 戻る
      </button>

      <div
        id="detailTitle"
        class="detail-title">
      </div>

      <div class="detail-actions">

        <button
          data-action="edit-character">
          編集
        </button>

        <button
          data-action="screenshot-all">
          まとめてスクショ
        </button>

        <button
          data-action="screenshot-type">
          種類別スクショ
        </button>

      </div>

    </div>

    <div id="patternList"></div>

    <button
      class="add-pattern-btn"
      data-action="add-pattern">
      ＋ 絵柄を追加
    </button>

  </section>


  <!-- SCREENSHOT -->

  <section
    id="screenshotPage"
    class="screenshot-page">

    <div
      id="screenshotCapture"
      class="screenshot-capture">

      <div class="screenshot-title">
        求め絵柄まとめ
      </div>

      <div class="priority-legend">
        <span>優先度：</span>
        <span>☆ 通常</span>
        <span>★ 優先</span>
        <span>⭐️ 最優先</span>
      </div>

      <div
        id="screenshotContent"
        class="shot-character">
      </div>

    </div>


    <div class="shot-mode-buttons">

      <button
        id="shotAllBtn"
        data-action="shot-mode-all">
        まとめて
      </button>

      <button
        id="shotTypeBtn"
        data-action="shot-mode-type">
        種類別
      </button>

    </div>

    <div
      id="shotTypeSelect"
      class="shot-type-select">
    </div>


    <div class="screenshot-buttons">

      <button
        data-action="close-screenshot">
        ← 戻る
      </button>

      <button
        data-action="save-screenshot">
        📷 画像保存
      </button>

    </div>

  </section>

</div>


<!-- CHARACTER MODAL -->

<div
  id="characterModal"
  class="modal-bg">

  <div class="modal">

    <h2 id="characterModalTitle">
      キャラ追加
    </h2>

    <div class="form-group">
      <label>キャラ名</label>
      <input
        id="characterName"
        type="text">
    </div>

    <div class="form-group">
      <label>画像URL</label>
      <input
        id="characterImage"
        type="text">
    </div>

    <div class="form-group">
      <label>テーマカラー</label>
      <input
        id="characterColor"
        type="text"
        value="#8f8f8f"
        placeholder="#8f8f8f">
    </div>

    <div class="modal-buttons">

      <button
        data-action="close-character-modal">
        キャンセル
      </button>

      <button
        class="save-btn"
        data-action="save-character">
        保存
      </button>

      <button
        id="deleteCharacterButton"
        class="delete-btn"
        data-action="delete-character">
        削除
      </button>

    </div>

  </div>
</div>


<!-- PATTERN MODAL -->

<div
  id="patternModal"
  class="modal-bg">

  <div class="modal">

    <h2 id="patternModalTitle">
      絵柄追加
    </h2>

    <div class="form-group">
      <label>絵柄名</label>
      <input
        id="patternName"
        type="text">
    </div>

    <div class="form-group">
      <label>絵柄画像URL</label>
      <input
        id="patternImage"
        type="text">
    </div>

    <div class="modal-buttons">

      <button
        data-action="close-pattern-modal">
        キャンセル
      </button>

      <button
        class="save-btn"
        data-action="save-pattern">
        保存
      </button>

      <button
        id="deletePatternButton"
        class="delete-btn"
        data-action="delete-pattern">
        削除
      </button>

    </div>

  </div>
</div>


<!-- GOODS MODAL -->

<div
  id="goodsModal"
  class="modal-bg">

  <div class="modal">

    <h2 id="goodsModalTitle">
      グッズ追加
    </h2>

    <div class="form-group">
      <label>グッズ名</label>
      <input
        id="goodsName"
        type="text"
        placeholder="例：チェキ">
    </div>

    <div class="form-group">
      <label>種類</label>
      <input
        id="goodsType"
        type="text"
        placeholder="例：チェキ / ぱしゃっつ / 缶バッジ">
    </div>

    <div class="form-group">
      <label>画像URL</label>
      <input
        id="goodsImage"
        type="text">
    </div>

    <div class="form-group">
      <label>優先度</label>

      <div class="priority-buttons">

        <button
          class="priority-btn"
          data-action="goods-priority"
          data-priority="0">
          ☆ 通常
        </button>

        <button
          class="priority-btn"
          data-action="goods-priority"
          data-priority="1">
          ★ 優先
        </button>

        <button
          class="priority-btn"
          data-action="goods-priority"
          data-priority="2">
          ⭐️ 最優先
        </button>

      </div>
    </div>

    <div class="modal-buttons">

      <button
        data-action="close-goods-modal">
        キャンセル
      </button>

      <button
        class="save-btn"
        data-action="save-goods">
        保存
      </button>

      <button
        id="deleteGoodsButton"
        class="delete-btn"
        data-action="delete-goods">
        削除
      </button>

    </div>

  </div>
</div>


<!-- PHOTO -->

<div
  id="photoBg"
  class="photo-bg">

  <button
    class="photo-close"
    data-action="close-photo">
    ×
  </button>

  <img
    id="photoImage"
    src=""
    alt="">

</div>


<script>

/* =========================
   データ
========================= */

const DB_NAME = "CollectionDB";
const DB_VERSION = 1;
const STORE_NAME = "data";
const DATA_KEY = "collectionData";

let data = {
  characters:[]
};

let currentCharacterId = null;
let currentPatternId = null;
let currentGoodsId = null;

let editingCharacterId = null;
let editingPatternId = null;
let editingGoodsId = null;

let currentGoodsPriority = 0;

let currentShotMode = "all";
let selectedShotTypes = [];


/* =========================
   共通
========================= */

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2);
}

function priorityMark(priority){

  priority = Number(priority) || 0;

  if(priority === 2) return "⭐️";
  if(priority === 1) return "★";

  return "☆";
}

function normalizeData(input){

  if(!input || typeof input !== "object"){
    return {characters:[]};
  }

  if(!Array.isArray(input.characters)){
    input.characters = [];
  }

  input.characters.forEach(character => {

    if(!Array.isArray(character.patterns)){
      character.patterns = [];
    }

    character.patterns.forEach(pattern => {

      if(!Array.isArray(pattern.goods)){
        pattern.goods = [];
      }

      pattern.goods.forEach(goods => {

        goods.priority =
          Number(goods.priority);

        if(![0,1,2].includes(goods.priority)){
          goods.priority = 0;
        }

        if(
          goods.type === undefined ||
          goods.type === null ||
          goods.type === ""
        ){
          goods.type = "未分類";
        }

      });

    });

  });

  return input;
}


/* =========================
   保存
========================= */

function loadLocalData(){

  try{

    const saved =
      localStorage.getItem(DATA_KEY);

    if(!saved) return false;

    data =
      normalizeData(
        JSON.parse(saved)
      );

    return true;

  }catch(error){

    console.error(error);
    return false;

  }
}

function saveLocalData(){

  try{

    localStorage.setItem(
      DATA_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.error(error);

  }
}


function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded =
      event => {

        const db =
          event.target.result;

        if(
          !db.objectStoreNames.contains(
            STORE_NAME
          )
        ){

          db.createObjectStore(
            STORE_NAME
          );

        }

      };

    request.onsuccess =
      event => {

        resolve(
          event.target.result
        );

      };

    request.onerror =
      () => reject(request.error);

  });
}


async function loadDBData(){

  try{

    const db =
      await openDB();

    return new Promise(resolve=>{

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.get(DATA_KEY);

      request.onsuccess = () => {

        if(request.result){

          data =
            normalizeData(
              request.result
            );

          resolve(true);

        }else{

          resolve(false);

        }

      };

      request.onerror =
        () => resolve(false);

    });

  }catch(error){

    console.error(error);
    return false;

  }
}


async function saveDBData(){

  try{

    const db =
      await openDB();

    return new Promise(resolve=>{

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.put(
          data,
          DATA_KEY
        );

      request.onsuccess =
        () => resolve(true);

      request.onerror =
        () => resolve(false);

    });

  }catch(error){

    console.error(error);
    return false;

  }
}


async function saveData(){

  saveLocalData();
  await saveDBData();

}

function getGoodsTypes(character){

  if(!character) return [];

  const types = [];

  character.patterns.forEach(
    pattern => {

      (pattern.goods || [])
        .forEach(goods => {

          const type =
            goods.type || "未分類";

          if(!types.includes(type)){

            types.push(type);

          }

        });

    }
  );

  return types;
}

function renderScreenshot(){

  const character =
    getCurrentCharacter();

  if(!character) return;

  const container =
    document.getElementById(
      "screenshotContent"
    );

  container.innerHTML = "";

  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "shot-pattern-grid";

  character.patterns.forEach(
    pattern => {

      let goods =
        pattern.goods || [];

      /*
       * 種類別の場合
       * 選択した種類だけ表示
       *
       * 何も選択していない場合は
       * 全種類を表示
       */

      if(
        currentShotMode === "type" &&
        selectedShotTypes.length > 0
      ){

        goods =
          goods.filter(
            item =>
              selectedShotTypes.includes(
                item.type ||
                "未分類"
              )
          );

      }

      /*
       * 求めるグッズがない絵柄は
       * スクショには表示しない
       */

      if(goods.length === 0){
        return;
      }


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "shot-pattern-card";


      /* 左側 */

      const left =
        document.createElement(
          "div"
        );

      left.className =
        "shot-pattern-left";


      if(pattern.image){

        const img =
          document.createElement(
            "img"
          );

        img.className =
          "shot-pattern-image";

        img.src =
          pattern.image;

        img.alt = "";

        left.appendChild(img);

      }else{

        const empty =
          document.createElement(
            "div"
          );

        empty.className =
          "shot-pattern-image";

        left.appendChild(empty);

      }


      const patternName =
        document.createElement(
          "div"
        );

      patternName.className =
        "shot-pattern-name";

      patternName.textContent =
        pattern.name ||
        "絵柄なし";

      left.appendChild(
        patternName
      );


      /* 右側 */

      const right =
        document.createElement(
          "div"
        );

      right.className =
        "shot-goods-side";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "shot-goods-title";

      title.textContent =
        "求めてるグッズ";

      right.appendChild(
        title
      );


      const goodsList =
        document.createElement(
          "div"
        );

      goodsList.className =
        "shot-goods-list";


      goods.forEach(item => {

        const row =
          document.createElement(
            "div"
          );

        row.className =
          "shot-goods-item";


        if(item.image){

          const img =
            document.createElement(
              "img"
            );

          img.className =
            "shot-goods-image";

          img.src =
            item.image;

          img.alt = "";

          row.appendChild(img);

        }else{

          const empty =
            document.createElement(
              "div"
            );

          empty.className =
            "shot-goods-image";

          row.appendChild(empty);

        }


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "shot-goods-name";

        name.textContent =
          item.name ||
          "名前なし";

        row.appendChild(name);


        const priority =
          document.createElement(
            "div"
          );

        priority.className =
          "shot-goods-priority";

        priority.textContent =
          priorityMark(
            item.priority
          );

        row.appendChild(
          priority
        );


        goodsList.appendChild(
          row
        );

      });


      right.appendChild(
        goodsList
      );

      card.appendChild(left);
      card.appendChild(right);

      grid.appendChild(card);

    }
  );


  container.appendChild(
    grid
  );

  updateShotModeButtons();

}


/* =========================
   スクショモード状態
========================= */

function updateShotModeButtons(){

  document.getElementById(
    "shotAllBtn"
  ).classList.toggle(
    "active",
    currentShotMode === "all"
  );

  document.getElementById(
    "shotTypeBtn"
  ).classList.toggle(
    "active",
    currentShotMode === "type"
  );

}


/* =========================
   スクショ保存
========================= */

async function saveScreenshot(){

  const target =
    document.getElementById(
      "screenshotCapture"
    );

  if(!target) return;

  if(
    typeof html2canvas ===
    "undefined"
  ){

    alert(
      "画像保存機能の読み込みに失敗しました。少し待ってからもう一度試してね。"
    );

    return;

  }

  try{

    /*
     * タイトル＋優先度＋一覧を
     * まとめて画像化する
     */

    const canvas =
      await html2canvas(
        target,
        {
          backgroundColor:"#ffffff",
          scale:2,
          useCORS:true,
          logging:false
        }
      );

    const link =
      document.createElement(
        "a"
      );

    link.download =
      "Collection_求め絵柄まとめ.png";

    link.href =
      canvas.toDataURL(
        "image/png"
      );

    document.body.appendChild(link);

    link.click();

    link.remove();

  }catch(error){

    console.error(
      "スクショ保存エラー",
      error
    );

    alert(
      "画像保存に失敗しました"
    );

  }

}


/* =========================
   モーダル
========================= */

function openModal(id){

  document.getElementById(
    id
  ).style.display = "flex";

}


function closeModal(id){

  document.getElementById(
    id
  ).style.display = "none";

}


/* =========================
   写真
========================= */

function openPhoto(src){

  if(!src) return;

  document.getElementById(
    "photoImage"
  ).src = src;

  document.getElementById(
    "photoBg"
  ).style.display = "flex";

}


function closePhoto(){

  document.getElementById(
    "photoBg"
  ).style.display = "none";

  document.getElementById(
    "photoImage"
  ).src = "";

}


/* =========================
   エスケープ
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* =========================
   クリック処理
========================= */

document.addEventListener(
  "click",
  async event => {

    /* 写真 */

    const photo =
      event.target.closest(
        "[data-photo]"
      );

    if(
      photo &&
      !event.target.closest(
        "button"
      )
    ){

      openPhoto(
        photo.dataset.photo
      );

      return;

    }


    /* キャラを開く */

    const characterOpen =
      event.target.closest(
        "[data-character-open]"
      );

    if(characterOpen){

      showDetail(
        characterOpen.dataset
          .characterOpen
      );

      return;

    }


    /* アクション */

    const target =
      event.target.closest(
        "[data-action]"
      );

    if(!target) return;

    const action =
      target.dataset.action;


    /* 一覧 */

    if(action === "show-home"){

      showHome();
      return;

    }


    /* キャラ追加 */

    if(
      action ===
      "add-character"
    ){

      openAddCharacter();
      return;

    }


    /* キャラ編集 */

    if(
      action ===
      "edit-character"
    ){

      const id =
        target.dataset.characterId ||
        currentCharacterId;

      openEditCharacter(id);
      return;

    }


    /* キャラ保存 */

    if(
      action ===
      "save-character"
    ){

      await saveCharacter();
      return;

    }


    /* キャラ削除 */

    if(
      action ===
      "delete-character"
    ){

      await deleteCharacter();
      return;

    }


    /* 絵柄追加 */

    if(
      action ===
      "add-pattern"
    ){

      const id =
        target.dataset.characterId ||
        currentCharacterId;

      currentCharacterId =
        id;

      openAddPattern();
      return;

    }


    /* 絵柄編集 */

    if(
      action ===
      "edit-pattern"
    ){

      openEditPattern(
        target.dataset.patternId
      );

      return;

    }


    /* 絵柄保存 */

    if(
      action ===
      "save-pattern"
    ){

      await savePattern();
      return;

    }


    /* 絵柄削除 */

    if(
      action ===
      "delete-pattern"
    ){

      await deletePattern();
      return;

    }


    /* グッズ追加 */

    if(
      action ===
      "add-goods"
    ){

      openAddGoods(
        target.dataset.patternId
      );

      return;

    }


    /* グッズ編集 */

    if(
      action ===
      "edit-goods"
    ){

      openEditGoods(
        target.dataset.patternId,
        target.dataset.goodsId
      );

      return;

    }


    /* グッズ保存 */

    if(
      action ===
      "save-goods"
    ){

      await saveGoods();
      return;

    }


    /* グッズ削除 */

    if(
      action ===
      "delete-goods"
    ){

      await deleteGoods();
      return;

    }


    /* 優先度 */

    if(
      action ===
      "goods-priority"
    ){

      currentGoodsPriority =
        Number(
          target.dataset.priority
        );

      updateGoodsPriorityButtons();

      return;

    }


    /* まとめてスクショ */

    if(
      action ===
      "screenshot-all"
    ){

      openScreenshot(
        currentCharacterId,
        "all"
      );

      return;

    }


    /* 種類別スクショ */

    if(
      action ===
      "screenshot-type"
    ){

      openScreenshot(
        currentCharacterId,
        "type"
      );

      return;

    }


    /* スクショ：まとめて */

    if(
      action ===
      "shot-mode-all"
    ){

      currentShotMode =
        "all";

      selectedShotTypes = [];

      renderShotTypeButtons();
      renderScreenshot();

      return;

    }


    /* スクショ：種類別 */

    if(
      action ===
      "shot-mode-type"
    ){

      currentShotMode =
        "type";

      selectedShotTypes = [];

      renderShotTypeButtons();
      renderScreenshot();

      return;

    }


    /* 種類選択 */

    if(
      action ===
      "shot-type"
    ){

      const type =
        target.dataset.type;

      if(
        selectedShotTypes.includes(
          type
        )
      ){

        selectedShotTypes =
          selectedShotTypes.filter(
            item =>
              item !== type
          );

      }else{

        selectedShotTypes.push(
          type
        );

      }

      renderShotTypeButtons();
      renderScreenshot();

      return;

    }


    /* スクショ戻る */

    if(
      action ===
      "close-screenshot"
    ){

      showDetail(
        currentCharacterId
      );

      return;

    }


    /* スクショ保存 */

    if(
      action ===
      "save-screenshot"
    ){

      await saveScreenshot();

      return;

    }


    /* モーダル閉じる */

    if(
      action ===
      "close-character-modal"
    ){

      closeModal(
        "characterModal"
      );

      return;

    }


    if(
      action ===
      "close-pattern-modal"
    ){

      closeModal(
        "patternModal"
      );

      return;

    }


    if(
      action ===
      "close-goods-modal"
    ){

      closeModal(
        "goodsModal"
      );

      return;

    }


    /* 写真閉じる */

    if(
      action ===
      "close-photo"
    ){

      closePhoto();

      return;

    }

  }
);


/* =========================
   モーダル外クリック
========================= */

document
  .querySelectorAll(".modal-bg")
  .forEach(bg => {

    bg.addEventListener(
      "click",
      event => {

        if(
          event.target === bg
        ){

          bg.style.display =
            "none";

        }

      }
    );

  });


/* =========================
   ESC
========================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      document
        .querySelectorAll(
          ".modal-bg"
        )
        .forEach(modal => {

          modal.style.display =
            "none";

        });

      closePhoto();

    }

  }
);

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f6f6f6;
color:#555;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif
}

header{
padding:22px 18px;
background:#fff;
border-bottom:1px solid #eee
}

h1{
margin:0;
font-size:22px;
color:#444
}

.container{
max-width:700px;
margin:auto;
padding:18px 14px 40px
}

button{
border:0;
border-radius:10px;
background:#888;
color:#fff;
padding:10px 14px;
font-size:14px
}

.add{
width:100%;
margin-bottom:14px
}

.back{
background:#e7e7e7;
color:#666;
margin-bottom:14px
}

.hidden{
display:none!important
}

.chars{
display:flex;
flex-direction:column;
gap:10px
}

.char{
background:#fff;
border:1px solid #eee;
border-radius:14px;
padding:12px;
display:flex;
align-items:center;
gap:12px
}

.char img,
.noimg{
width:68px;
height:68px;
object-fit:cover;
border-radius:10px;
background:#eee;
flex:none
}

.noimg{
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
color:#aaa
}

.charname{
flex:1;
font-size:16px;
font-weight:600
}

.acts{
display:flex;
gap:5px
}

.small{
padding:7px 9px;
font-size:12px;
background:#e5e5e5;
color:#666
}

.head{
background:#fff;
border:1px solid #eee;
border-left:5px solid var(--theme);
border-radius:16px;
padding:14px;
margin-bottom:14px
}

.headin{
display:flex;
align-items:center;
gap:11px
}

.head img,
.headno{
width:56px;
height:56px;
object-fit:cover;
border-radius:11px;
background:#eee
}

.headno{
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
color:#aaa
}

.headname{
font-size:19px;
font-weight:700;
color:var(--theme)
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}

.card{
background:#fff;
border:1px solid #eee;
border-radius:14px;
overflow:hidden
}

.pimg,
.pno{
width:100%;
aspect-ratio:1;
object-fit:cover;
background:#eee;
display:block
}

.pimg{
cursor:pointer
}

.pno{
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
color:#aaa
}

.content{
padding:9px
}

.prow{
display:flex;
align-items:flex-start;
gap:4px
}

.pname{
flex:1;
font-weight:600;
font-size:13px;
word-break:break-word
}

.star{
background:transparent;
color:#bbb;
padding:0;
font-size:21px;
line-height:1
}

.star.on{
color:var(--theme)
}

.goods{
display:flex;
flex-direction:column;
gap:5px;
margin-top:7px
}

.good{
background:#f3f3f3;
border-radius:9px;
padding:5px;
display:flex;
align-items:center;
gap:6px;
font-size:12px
}

.gimg,
.gno{
width:40px;
height:40px;
object-fit:cover;
border-radius:7px;
background:#e7e7e7;
flex:none
}

.gno{
display:flex;
align-items:center;
justify-content:center;
font-size:9px;
color:#aaa
}

.gimg{
cursor:pointer
}

.gname{
flex:1;
word-break:break-word
}

.gact{
display:flex;
align-items:center
}

.gstar,
.gedit,
.gdel{
background:transparent;
color:#aaa;
padding:2px 3px;
font-size:16px
}

.gstar.on{
color:var(--theme)
}

.gedit{
font-size:13px
}

.gdel{
font-size:15px
}

.gadd{
width:100%;
margin-top:7px;
background:#eee;
color:#666;
font-size:12px;
padding:7px
}

.pacts{
display:flex;
gap:5px;
margin-top:8px
}

.pacts button{
flex:1;
background:#eee;
color:#666;
font-size:12px;
padding:7px
}

.empty{
text-align:center;
color:#aaa;
padding:35px 10px;
font-size:13px
}

.bg{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
align-items:center;
justify-content:center;
padding:20px;
z-index:100
}

.modal{
width:100%;
max-width:420px;
max-height:90vh;
overflow:auto;
background:#fff;
border-radius:16px;
padding:20px
}

.modal h2{
margin:0 0 15px;
font-size:18px;
color:#444
}

.modal label{
display:block;
margin:11px 0 6px;
font-size:13px;
color:#777
}

.modal input{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:9px;
background:#fafafa
}

.current{
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
margin-top:5px
}

.fname{
margin-top:5px;
font-size:11px;
color:#999;
word-break:break-all
}

.mbtn{
display:flex;
gap:8px;
margin-top:18px
}

.mbtn button{
flex:1
}

.cancel{
background:#e8e8e8;
color:#666
}

.colors{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px
}

.color{
border:1px solid #ddd;
background:#fff;
color:#666;
padding:8px 4px;
font-size:11px
}

.color.sel{
border:2px solid #555;
padding:7px 3px;
font-weight:bold
}

.dot{
display:inline-block;
width:13px;
height:13px;
border-radius:50%;
vertical-align:-2px;
margin-right:3px;
border:1px solid #bbb
}

.photo{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
align-items:center;
justify-content:center;
padding:20px;
z-index:200
}

.photo img{
max-width:95vw;
max-height:88vh;
object-fit:contain;
border-radius:10px
}

.x{
position:fixed;
right:15px;
top:15px;
width:38px;
height:38px;
padding:0;
border-radius:50%;
background:#fff;
color:#555;
font-size:22px
}

@media(max-width:500px){
.grid{gap:8px}
.gimg,.gno{
width:38px;
height:38px
}
}
</style>
</head>

<body>

<header>
<h1>Collection</h1>
</header>

<div class="container">

<section id="listPage">

<button class="add" id="addCharBtn">
＋ キャラを追加
</button>

<div id="chars" class="chars"></div>

</section>


<section id="patPage" class="hidden">

<button class="back" id="backBtn">
← キャラ一覧へ
</button>

<div id="head"></div>

<button class="add" id="addPatternBtn">
＋ 絵柄を追加
</button>

<div id="pats" class="grid"></div>

</section>

</div>


<!-- キャラ -->

<div id="cm" class="bg">

<div class="modal">

<h2 id="cmt">キャラを追加</h2>

<label>キャラ名</label>

<input
id="cn"
placeholder="例：月永レオ"
>

<label>キャラ画像</label>

<input
id="ci"
type="file"
accept="image/*"
>

<div id="cfn" class="fname"></div>

<div id="cca" class="hidden">

<label>現在の画像</label>

<img id="cc" class="current">

</div>

<label>キャラカラー</label>

<div id="colors" class="colors"></div>

<div class="mbtn">

<button class="cancel" id="cancelC">
キャンセル
</button>

<button id="saveCBtn">
保存
</button>

</div>

</div>

</div>


<!-- 絵柄 -->

<div id="pm" class="bg">

<div class="modal">

<h2 id="pmt">絵柄を追加</h2>

<label>絵柄名</label>

<input
id="pn"
placeholder="例：ハフアニ"
>

<label>絵柄画像</label>

<input
id="pi"
type="file"
accept="image/*"
>

<div id="pfn" class="fname"></div>

<div id="pca" class="hidden">

<label>現在の画像</label>

<img id="pc" class="current">

</div>

<div class="mbtn">

<button class="cancel" id="cancelP">
キャンセル
</button>

<button id="savePBtn">
保存
</button>

</div>

</div>

</div>


<!-- グッズ -->

<div id="gm" class="bg">

<div class="modal">

<h2 id="gmt">グッズを追加</h2>

<label>グッズ名</label>

<input
id="gn"
placeholder="例：ぱしゃっつ 日本版"
>

<label>グッズ画像</label>

<input
id="gi"
type="file"
accept="image/*"
>

<div id="gfn" class="fname"></div>

<div id="gca" class="hidden">

<label>現在の画像</label>

<img id="gc" class="current">

</div>

<label>最優先</label>

<button id="gp">
☆ 最優先にする
</button>

<div class="mbtn">

<button class="cancel" id="cancelG">
キャンセル
</button>

<button id="saveGBtn">
保存
</button>

</div>

</div>

</div>


<!-- 画像拡大 -->

<div id="photo" class="photo">

<button class="x" id="closePhotoBtn">
×
</button>

<img id="large">

</div>


<script>

const KEY="collectionData";


const COLORS=[
["red","赤","#d95c5c"],
["pink","ピンク","#e68ab0"],
["orange","オレンジ","#e69a55"],
["yellow","黄色","#d4b63f"],
["green","緑","#62a878"],
["lightblue","水色","#63b9d1"],
["blue","青","#5f82c9"],
["purple","紫","#9570bd"],
["brown","茶色","#9a7259"],
["black","黒","#555"],
["white","白","#c8c8c8"],
["gray","グレー","#8f8f8f"]
];


let data=[];

try{

data=
JSON.parse(
localStorage.getItem(KEY)||"[]"
);

}catch(e){

data=[];

}

if(!Array.isArray(data)){
data=[];
}


let currentChar=-1;
let editPattern=-1;
let currentPattern=-1;
let editGoods=-1;
let goodsPriority=false;
let selectedColor="gray";


/* HTML要素 */

const cm=document.getElementById("cm");
const cmt=document.getElementById("cmt");
const cn=document.getElementById("cn");
const ciInput=document.getElementById("ci");
const cfn=document.getElementById("cfn");
const cca=document.getElementById("cca");
const cc=document.getElementById("cc");
const colors=document.getElementById("colors");

const pm=document.getElementById("pm");
const pmt=document.getElementById("pmt");
const pn=document.getElementById("pn");
const piInput=document.getElementById("pi");
const pfn=document.getElementById("pfn");
const pca=document.getElementById("pca");
const pc=document.getElementById("pc");

const gm=document.getElementById("gm");
const gmt=document.getElementById("gmt");
const gn=document.getElementById("gn");
const giInput=document.getElementById("gi");
const gfn=document.getElementById("gfn");
const gca=document.getElementById("gca");
const gc=document.getElementById("gc");
const gp=document.getElementById("gp");

const listPage=document.getElementById("listPage");
const patPage=document.getElementById("patPage");
const chars=document.getElementById("chars");
const head=document.getElementById("head");
const pats=document.getElementById("pats");

const photo=document.getElementById("photo");
const large=document.getElementById("large");


/* 保存 */

function save(){

try{

localStorage.setItem(
KEY,
JSON.stringify(data)
);

return true;

}catch(e){

alert(
"保存容量を超えました。\n"+
"画像を少し減らしてみてね！"
);

return false;

}

}


/* 古いデータ対応 */

function normalize(){

data.forEach(c=>{

if(!c.color){
c.color="gray";
}

if(!Array.isArray(c.patterns)){
c.patterns=[];
}

c.patterns.forEach(p=>{

p.priority=!!p.priority;

if(!Array.isArray(p.goods)){
p.goods=[];
}

p.goods=p.goods.map(g=>{

if(typeof g==="string"){

return{
name:g,
image:null,
priority:false
};

}

return{

name:g.name||"",
image:g.image||null,
priority:!!g.priority

};

});

});

});

}

normalize();


/* 画像処理 */

function compressImage(file){

return new Promise((resolve,reject)=>{

if(!file){

resolve(null);

return;

}

const reader=new FileReader();

reader.onload=function(e){

const image=new Image();

image.onload=function(){

const max=600;

const scale=Math.min(
1,
max/Math.max(
image.width,
image.height
)
);

const canvas=document.createElement("canvas");

canvas.width=Math.max(
1,
Math.round(image.width*scale)
);

canvas.height=Math.max(
1,
Math.round(image.height*scale)
);

const ctx=canvas.getContext("2d");

ctx.drawImage(
image,
0,
0,
canvas.width,
canvas.height
);

resolve(
canvas.toDataURL(
"image/jpeg",
0.7
)
);

};

image.onerror=reject;

image.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

}


/* HTMLエスケープ */

function esc(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* 色 */

function getColor(){

const found=
COLORS.find(
x=>x[0]===(
data[currentChar]?.color||"gray"
)
);

return found
?
found[2]
:
"#888";

}


function renderColors(){

colors.innerHTML=
COLORS.map(c=>`

<button
class="color ${selectedColor===c[0]?"sel":""}"
data-color="${c[0]}"
>

<span
class="dot"
style="background:${c[2]}"
></span>

${c[1]}

</button>

`).join("");

document
.querySelectorAll(".color")
.forEach(btn=>{

btn.addEventListener(
"click",
function(){

selectedColor=this.dataset.color;

renderColors();

}
);

});

}


/* キャラ一覧 */

function renderCharacters(){

listPage.classList.remove("hidden");

patPage.classList.add("hidden");

if(data.length===0){

chars.innerHTML=
`<div class="empty">
まだキャラがいないよ
</div>`;

return;

}

chars.innerHTML=
data.map((c,i)=>`

<div class="char">

${
c.image
?
`<img src="${c.image}">`
:
`<div class="noimg">画像なし</div>`
}

<div class="charname">
${esc(c.name)}
</div>

<div class="acts">

<button
class="small"
data-open="${i}"
>
開く
</button>

<button
class="small"
data-edit="${i}"
>
編集
</button>

<button
class="small"
data-delete="${i}"
>
削除
</button>

</div>

</div>

`).join("");


document
.querySelectorAll("[data-open]")
.forEach(btn=>{

btn.addEventListener(
"click",
function(){

openCharacter(
Number(this.dataset.open)
);

}
);

});


document
.querySelectorAll("[data-edit]")
.forEach(btn=>{

btn.addEventListener(
"click",
function(){

openCharacterEditor(
Number(this.dataset.edit)
);

}
);

});


document
.querySelectorAll("[data-delete]")
.forEach(btn=>{

btn.addEventListener(
"click",
function(){

deleteCharacter(
Number(this.dataset.delete)
);

}
);

});

}


/* キャラ追加 */

function openCharacterEditor(index){

editPattern=index;

if(index===null){

cmt.textContent="キャラを追加";

cn.value="";

ciInput.value="";

cfn.textContent="";

cca.classList.add("hidden");

selectedColor="gray";

}else{

const c=data[index];

cmt.textContent="キャラを編集";

cn.value=c.name||"";

ciInput.value="";

cfn.textContent=
"画像を変更しない場合はそのままでOK";

selectedColor=c.color||"gray";

if(c.image){

cc.src=c.image;

cca.classList.remove("hidden");

}else{

cca.classList.add("hidden");

}

}

renderColors();

cm.style.display="flex";

}


async function saveCharacter(){

const name=cn.value.trim();

if(!name){

alert("キャラ名を入力してね！");

return;

}

try{

let image=null;

if(editPattern!==null &&
editPattern>=0){

image=data[editPattern].image||null;

}

if(ciInput.files.length>0){

image=
await compressImage(
ciInput.files[0]
);

}

if(editPattern===null){

data.push({

name:name,
image:image,
color:selectedColor,
patterns:[]

});

}else{

data[editPattern].name=name;
data[editPattern].image=image;
data[editPattern].color=selectedColor;

}

if(save()){

closeCharacterEditor();

renderCharacters();

}

}catch(error){

console.error(error);

alert(
"画像の処理に失敗しました。\n"+
"別の画像でもう一度試してみてね。"
);

}

}


function deleteCharacter(index){

if(
confirm(
`「${data[index].name}」を削除する？`
)
){

data.splice(index,1);

save();

renderCharacters();

}

}


/* キャラページ */

function openCharacter(index){

currentChar=index;

listPage.classList.add("hidden");

patPage.classList.remove("hidden");

renderPatterns();

}


function renderCharacterHeader(){

const c=data[currentChar];

const theme=getColor();

document.documentElement.style.setProperty(
"--theme",
theme
);

head.innerHTML=`

<div class="head">

<div class="headin">

${
c.image
?
`<img src="${c.image}">`
:
`<div class="headno">画像なし</div>`
}

<div class="headname">
${esc(c.name)}
</div>

</div>

</div>

`;

}


/* 絵柄 */

function renderPatterns(){

renderCharacterHeader();

const patterns=data[currentChar].patterns;

if(patterns.length===0){

pats.innerHTML=
`<div class="empty"
style="grid-column:1/-1">
まだ絵柄がないよ
</div>`;

return;

}

pats.innerHTML=
patterns.map((p,i)=>{

const goodsHTML=
p.goods.map((g,j)=>`

<div class="good">

${
g.image
?
`<img
class="gimg"
src="${g.image}"
data-photo="${encodeURIComponent(g.image)}"
>`
:
`<div class="gno">
画像なし
</div>`
}

<div class="gname">
${esc(g.name)}
</div>

<div class="gact">

<button
class="gstar ${g.priority?"on":""}"
data-gstar="${i},${j}"
>
${g.priority?"★":"☆"}
</button>

<button
class="gedit"
data-gedit="${i},${j}"
>
✎
</button>

<button
class="gdel"
data-gdel="${i},${j}"
>
×
</button>

</div>

</div>

`).join("");


return `

<div class="card">

${
p.image
?
`<img
class="pimg"
src="${p.image}"
data-photo="${encodeURIComponent(p.image)}"
>`
:
`<div class="pno">
画像なし
</div>`
}

<div class="content">

<div class="prow">

<div class="pname">
${esc(p.name)}
</div>

<button
class="star ${p.priority?"on":""}"
data-pstar="${i}"
>
${p.priority?"★":"☆"}
</button>

</div>

<div class="goods">

${
goodsHTML
||
`<div
style="font-size:11px;color:#aaa"
>
グッズなし
</div>`
}

</div>

<button
class="gadd"
data-gadd="${i}"
>
＋ グッズを追加
</button>

<div class="pacts">

<button data-pedit="${i}">
編集
</button>

<button data-pdelete="${i}">
🗑️ 削除
</button>

</div>

</div>

</div>

`;

}).join("");


/* イベント */

document
.querySelectorAll("[data-photo]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

openPhoto(
decodeURIComponent(
this.dataset.photo
)
);

}
);

});


document
.querySelectorAll("[data-pstar]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

togglePatternPriority(
Number(this.dataset.pstar)
);

}
);

});


document
.querySelectorAll("[data-pedit]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

openPatternEditor(
Number(this.dataset.pedit)
);

}
);

});


document
.querySelectorAll("[data-pdelete]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

deletePattern(
Number(this.dataset.pdelete)
);

}
);

});


document
.querySelectorAll("[data-gadd]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

openGoodsEditor(
Number(this.dataset.gadd),
null
);

}
);

});


document
.querySelectorAll("[data-gstar]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

const parts=
this.dataset.gstar.split(",");

toggleGoodsPriority(
Number(parts[0]),
Number(parts[1])
);

}
);

});


document
.querySelectorAll("[data-gedit]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

const parts=
this.dataset.gedit.split(",");

openGoodsEditor(
Number(parts[0]),
Number(parts[1])
);

}
);

});


document
.querySelectorAll("[data-gdel]")
.forEach(el=>{

el.addEventListener(
"click",
function(){

const parts=
this.dataset.gdel.split(",");

deleteGoods(
Number(parts[0]),
Number(parts[1])
);

}
);

});

}


/* 絵柄追加 */

function openPatternEditor(index){

editPattern=index;

if(index===null){

pmt.textContent="絵柄を追加";

pn.value="";

piInput.value="";

pfn.textContent="";

pca.classList.add("hidden");

}else{

const p=data[currentChar].patterns[index];

pmt.textContent="絵柄を編集";

pn.value=p.name||"";

piInput.value="";

pfn.textContent=
"画像を変更しない場合はそのままでOK";

if(p.image){

pc.src=p.image;

pca.classList.remove("hidden");

}else{

pca.classList.add("hidden");

}

}

pm.style.display="flex";

}


async function savePattern(){

const name=pn.value.trim();

if(!name){

alert("絵柄名を入力してね！");

return;

}

try{

let image=null;

if(
editPattern!==null &&
editPattern>=0
){

image=
data[currentChar]
.patterns[editPattern]
.image||null;

}

if(piInput.files.length>0){

image=
await compressImage(
piInput.files[0]
);

}

if(editPattern===null){

data[currentChar].patterns.push({

name:name,
image:image,
priority:false,
goods:[]

});

}else{

data[currentChar]
.patterns[editPattern]
.name=name;

data[currentChar]
.patterns[editPattern]
.image=image;

}

if(save()){

closePatternEditor();

renderPatterns();

}

}catch(error){

console.error(error);

alert(
"画像の処理に失敗しました。\n"+
"別の画像でもう一度試してみてね。"
);

}

}


function togglePatternPriority(index){

const p=
data[currentChar].patterns[index];

p.priority=!p.priority;

save();

renderPatterns();

}


function deletePattern(index){

if(
confirm(
`「${data[currentChar].patterns[index].name}」を削除する？\n`+
"この絵柄のグッズも全部削除されます。"
)
){

data[currentChar].patterns.splice(
index,
1
);

save();

renderPatterns();

}

}


/* グッズ */

function openGoodsEditor(patternIndex,goodsIndex){

currentPattern=patternIndex;

editGoods=goodsIndex;

goodsPriority=
goodsIndex!==null &&
!!data[currentChar]
.patterns[patternIndex]
.goods[goodsIndex]
.priority;

gmt.textContent=
goodsIndex===null
?
"グッズを追加"
:
"グッズを編集";


if(goodsIndex===null){

gn.value="";

giInput.value="";

gfn.textContent="";

gca.classList.add("hidden");

}else{

const item=
data[currentChar]
.patterns[patternIndex]
.goods[goodsIndex];

gn.value=item.name||"";

giInput.value="";

gfn.textContent=
"画像を変更しない場合はそのままでOK";

if(item.image){

gc.src=item.image;

gca.classList.remove("hidden");

}else{

gca.classList.add("hidden");

}

}

updateGoodsButton();

gm.style.display="flex";

}


function updateGoodsButton(){

gp.textContent=
goodsPriority
?
"★ 最優先"
:
"☆ 最優先にする";

gp.style.background=
goodsPriority
?
getColor()
:
"#eee";

gp.style.color=
goodsPriority
?
"#fff"
:
"#666";

}


async function saveGoods(){

const name=gn.value.trim();

if(!name){

alert("グッズ名を入力してね！");

return;

}

try{

const goods=
data[currentChar]
.patterns[currentPattern]
.goods;

let image=null;

if(editGoods!==null){

image=
goods[editGoods]
.image||null;

}

if(giInput.files.length>0){

image=
await compressImage(
giInput.files[0]
);

}

const item={

name:name,
image:image,
priority:goodsPriority

};


if(editGoods===null){

goods.push(item);

}else{

goods[editGoods]=item;

}

if(save()){

closeGoodsEditor();

renderPatterns();

}

}catch(error){

console.error(error);

alert(
"画像の処理に失敗しました。\n"+
"別の画像でもう一度試してみてね。"
);

}

}


function toggleGoodsPriority(p,g){

data[currentChar]
.patterns[p]
.goods[g]
.priority=
!data[currentChar]
.patterns[p]
.goods[g]
.priority;

save();

renderPatterns();

}


function deleteGoods(p,g){

const item=
data[currentChar]
.patterns[p]
.goods[g];

if(
confirm(
`「${item.name}」を削除する？`
)
){

data[currentChar]
.patterns[p]
.goods.splice(g,1);

save();

renderPatterns();

}

}


/* 閉じる */

function closeCharacterEditor(){

cm.style.display="none";

editPattern=-1;

}


function closePatternEditor(){

pm.style.display="none";

editPattern=-1;

}


function closeGoodsEditor(){

gm.style.display="none";

currentPattern=-1;

editGoods=-1;

goodsPriority=false;

}


/* 画像拡大 */

function openPhoto(src){

large.src=src;

photo.style.display="flex";

}


function closePhoto(){

photo.style.display="none";

large.src="";

}


/* ボタンイベント */

/* キャラ追加 */

document
.getElementById("addCharBtn")
.addEventListener(
"click",
function(){

openCharacterEditor(null);

}
);


/* キャラ保存 */

document
.getElementById("saveCBtn")
.addEventListener(
"click",
saveCharacter
);


/* キャラキャンセル */

document
.getElementById("cancelC")
.addEventListener(
"click",
closeCharacterEditor
);


/* 絵柄追加 */

document
.getElementById("addPatternBtn")
.addEventListener(
"click",
function(){

openPatternEditor(null);

}
);


/* 絵柄保存 */

document
.getElementById("savePBtn")
.addEventListener(
"click",
savePattern
);


/* 絵柄キャンセル */

document
.getElementById("cancelP")
.addEventListener(
"click",
closePatternEditor
);


/* グッズ保存 */

document
.getElementById("saveGBtn")
.addEventListener(
"click",
saveGoods
);


/* グッズキャンセル */

document
.getElementById("cancelG")
.addEventListener(
"click",
closeGoodsEditor
);


/* グッズ最優先 */

gp.addEventListener(
"click",
function(){

goodsPriority=!goodsPriority;

updateGoodsButton();

}
);


/* 戻る */

document
.getElementById("backBtn")
.addEventListener(
"click",
function(){

currentChar=-1;

renderCharacters();

}
);


/* ファイル名 */

ciInput.addEventListener(
"change",
function(){

cfn.textContent=
this.files[0]
?
this.files[0].name
:
"";

}
);


piInput.addEventListener(
"change",
function(){

pfn.textContent=
this.files[0]
?
this.files[0].name
:
"";

}
);


giInput.addEventListener(
"change",
function(){

gfn.textContent=
this.files[0]
?
this.files[0].name
:
"";

}
);


/* 画像拡大を閉じる */

document
.getElementById("closePhotoBtn")
.addEventListener(
"click",
closePhoto
);


/* 初期表示 */

renderCharacters();

</script>

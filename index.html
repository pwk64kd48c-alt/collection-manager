<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f6f6f6;
  color:#555;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

header{
  background:#fff;
  padding:30px 20px 25px;
  border-bottom:1px solid #e5e5e5;
}

h1{
  margin:0;
  font-size:30px;
  color:#444;
}

main{
  max-width:800px;
  margin:auto;
  padding:28px 16px 60px;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================
   キャラ一覧
========================= */

.add-main{
  width:100%;
  padding:18px;
  border-radius:18px;
  background:#999;
  color:white;
  font-size:19px;
  margin-bottom:24px;
}

.character-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.character-card{
  background:white;
  border-radius:18px;
  padding:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
  overflow:hidden;
}

.char-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
  display:block;
}

.char-name{
  font-size:17px;
  font-weight:bold;
  margin-top:10px;
  color:#444;
}

.char-color{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
  vertical-align:middle;
}

/* =========================
   キャラ詳細
========================= */

.back{
  background:white;
  border-radius:12px;
  padding:10px 15px;
  margin-bottom:18px;
  color:#666;
}

.character-head{
  background:white;
  border-radius:20px;
  padding:18px;
  margin-bottom:20px;
  border-left:8px solid var(--theme,#aaa);
}

.character-title{
  font-size:25px;
  font-weight:bold;
  color:#444;
}

.character-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.action{
  flex:1;
  padding:10px;
  border-radius:10px;
  background:#eee;
  color:#555;
}

.action.theme{
  background:var(--theme,#999);
  color:white;
}

/* 優先度説明 */

.priority-legend{
  margin-top:10px;
  padding:9px 11px;
  background:#f7f7f7;
  border-radius:10px;
  font-size:11px;
  color:#888;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px 10px;
}

.priority-legend-title{
  font-weight:bold;
  color:#666;
}

/* =========================
   通常の絵柄一覧
========================= */

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.pattern-card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  position:relative;
}

.pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.pattern-empty{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  color:#aaa;
}

.pattern-info{
  padding:12px;
}

.pattern-name{
  font-weight:bold;
  color:#444;
  font-size:16px;
}

.goods-list{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.goods-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px;
  background:#f7f7f7;
  border-radius:9px;
  font-size:13px;
  min-width:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  touch-action:pan-y;
}

.goods-thumb{
  width:38px;
  height:38px;
  object-fit:cover;
  border-radius:7px;
  background:#ddd;
  flex:none;
}

.goods-name{
  flex:1;
  min-width:0;
  overflow-wrap:anywhere;
}

.priority-mark{
  width:27px;
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  padding:0;
  flex:none;
  font-size:18px;
  line-height:1;
}

.priority-none{
  color:#bbb;
}

.priority-yellow{
  color:#e6c44a;
}

.priority-star{
  color:var(--theme,#999);
}

.pattern-priority{
  position:absolute;
  right:9px;
  top:8px;
  background:rgba(255,255,255,.92);
  border-radius:50%;
  width:34px;
  height:34px;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-buttons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.small-buttons button{
  flex:1;
  padding:7px 3px;
  border-radius:8px;
  background:#eee;
  color:#666;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:40px 10px;
}

/* =========================
   スクショ用表示
========================= */

.screenshot-page{
  background:#fff;
  border-radius:22px;
  padding:16px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.screenshot-header{
  text-align:center;
  margin-bottom:15px;
}

.screenshot-character{
  font-size:23px;
  font-weight:bold;
  color:#444;
  margin-bottom:7px;
}

.screenshot-subtitle{
  font-size:12px;
  color:#999;
  margin-bottom:10px;
}

.screenshot-legend{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px 10px;
  font-size:10px;
  color:#777;
  background:#f7f7f7;
  border-radius:10px;
  padding:7px 9px;
}

.screenshot-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.screenshot-pattern{
  background:#fafafa;
  border-radius:13px;
  padding:8px;
  overflow:hidden;
  border:1px solid #eee;
}

.screenshot-pattern-image{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  display:block;
  border-radius:9px;
  background:#eee;
}

.screenshot-pattern-empty{
  width:100%;
  aspect-ratio:1;
  border-radius:9px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:11px;
}

.screenshot-pattern-name{
  font-size:12px;
  font-weight:bold;
  color:#444;
  margin:7px 2px 6px;
  line-height:1.35;
}

.screenshot-goods{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.screenshot-goods-item{
  display:flex;
  align-items:center;
  gap:5px;
  min-width:0;
  background:#fff;
  border-radius:7px;
  padding:4px;
}

.screenshot-goods-image{
  width:27px;
  height:27px;
  object-fit:cover;
  border-radius:5px;
  background:#ddd;
  flex:none;
}

.screenshot-goods-empty{
  width:27px;
  height:27px;
  border-radius:5px;
  background:#ddd;
  flex:none;
}

.screenshot-goods-name{
  flex:1;
  min-width:0;
  font-size:9px;
  line-height:1.25;
  color:#555;
  overflow-wrap:anywhere;
}

.screenshot-priority{
  width:18px;
  flex:none;
  text-align:center;
  font-size:13px;
}

.screenshot-back{
  width:100%;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#eee;
  color:#666;
}

/* =========================
   モーダル
========================= */

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  align-items:flex-end;
  justify-content:center;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px 22px 0 0;
  padding:22px;
}

.modal h2{
  margin:0 0 18px;
  color:#444;
}

label{
  display:block;
  font-size:13px;
  margin:14px 0 6px;
  color:#777;
}

input[type="text"],
input[type="date"],
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  background:white;
}

input[type="file"]{
  width:100%;
  margin-bottom:8px;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:contain;
  border-radius:12px;
  background:#f5f5f5;
  margin-top:8px;
  display:none;
}

/* カラーピッカー */

.color-picker-area{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:#f7f7f7;
  border-radius:14px;
}

#characterColor{
  width:58px;
  height:58px;
  padding:0;
  border:0;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  background:none;
}

.color-code-area{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
}

.color-preview{
  width:24px;
  height:24px;
  border-radius:50%;
  border:1px solid #ddd;
  flex:none;
}

#characterColorHex{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit;
  text-transform:uppercase;
}

.modal-buttons{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:13px;
  border-radius:11px;
}

.cancel{
  background:#eee;
  color:#666;
}

.save{
  background:#777;
  color:white;
}

.delete{
  background:#f0dddd;
  color:#a55;
}

/* 写真 */

.photo-view{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.photo-view.show{
  display:flex;
}

.photo-view img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
  border-radius:10px;
}

.close-photo{
  position:fixed;
  top:20px;
  right:20px;
  width:45px;
  height:45px;
  border-radius:50%;
  background:white;
  font-size:25px;
}

@media(max-width:420px){

  .character-list,
  .pattern-grid{
    gap:10px;
  }

  main{
    padding-left:10px;
    padding-right:10px;
  }

  .screenshot-page{
    padding:10px;
  }

  .screenshot-grid{
    gap:8px;
  }

  .screenshot-pattern{
    padding:6px;
  }

}
</style>
</head>

<body>

<header>
  <h1>Collection</h1>
</header>

<main id="app"></main>

<!-- =========================
     キャラ編集
========================= -->

<div class="modal-bg" id="characterModal">

  <div class="modal">

    <h2 id="characterModalTitle">
      キャラを追加
    </h2>

    <label>キャラ名</label>

    <input
      id="characterName"
      type="text"
      placeholder="例：月永レオ">

    <label>画像</label>

    <input
      id="characterImage"
      type="file"
      accept="image/*">

    <img
      id="characterPreview"
      class="preview">

    <label>テーマカラー</label>

    <div class="color-picker-area">

      <input
        id="characterColor"
        type="color"
        value="#aaaaaa">

      <div class="color-code-area">

        <span
          id="colorPreview"
          class="color-preview"
          style="background:#aaaaaa">
        </span>

        <input
          id="characterColorHex"
          type="text"
          value="#AAAAAA"
          maxlength="7">

      </div>

    </div>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-character">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteCharacterButton"
        data-action="delete-character"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-character">
        保存
      </button>

    </div>

  </div>

</div>

<!-- =========================
     絵柄編集
========================= -->

<div class="modal-bg" id="patternModal">

  <div class="modal">

    <h2 id="patternModalTitle">
      絵柄を追加
    </h2>

    <label>絵柄名</label>

    <input
      id="patternName"
      type="text"
      placeholder="例：ハフアニ">

    <label>画像</label>

    <input
      id="patternImage"
      type="file"
      accept="image/*">

    <img
      id="patternPreview"
      class="preview">

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-pattern">
        キャンセル
      </button>

      <button
        class="delete"
        id="deletePatternButton"
        data-action="delete-pattern-modal"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-pattern">
        保存
      </button>

    </div>

  </div>

</div>

<!-- =========================
     グッズ編集
========================= -->

<div class="modal-bg" id="goodsModal">

  <div class="modal">

    <h2 id="goodsModalTitle">
      グッズを追加
    </h2>

    <label>グッズ名</label>

    <input
      id="goodsName"
      type="text"
      placeholder="例：缶バッジ">

    <label>画像</label>

    <input
      id="goodsImage"
      type="file"
      accept="image/*">

    <img
      id="goodsPreview"
      class="preview">

    <label>優先度</label>

    <select id="goodsPriority">

      <option value="0">☆ 通常</option>
      <option value="1">🟡 優先</option>
      <option value="2">⭐ 最優先</option>

    </select>

    <div class="modal-buttons">

      <button
        class="cancel"
        data-action="close-goods">
        キャンセル
      </button>

      <button
        class="delete"
        id="deleteGoodsButton"
        data-action="delete-goods"
        style="display:none;">
        🗑️ 削除
      </button>

      <button
        class="save"
        data-action="save-goods">
        保存
      </button>

    </div>

  </div>

</div>

<!-- =========================
     写真拡大
========================= -->

<div class="photo-view" id="photoView">

  <button
    class="close-photo"
    data-action="close-photo">
    ×
  </button>

  <img id="photoLarge">

</div>

<script>

(function(){

"use strict";

const KEY = "collectionData";

const COLORS = [
  {name:"赤",value:"#e57373"},
  {name:"ピンク",value:"#f48fb1"},
  {name:"オレンジ",value:"#ffb74d"},
  {name:"黄色",value:"#fff176"},
  {name:"緑",value:"#81c784"},
  {name:"水色",value:"#80cbc4"},
  {name:"青",value:"#64b5f6"},
  {name:"紫",value:"#9575cd"},
  {name:"茶色",value:"#a1887f"},
  {name:"黒",value:"#555555"},
  {name:"白",value:"#dddddd"},
  {name:"グレー",value:"#aaaaaa"}
];

let data = [];
let currentCharacter = null;
let editingCharacter = -1;
let editingPattern = -1;
let editingGoods = -1;
let screenshotMode = false;

const app =
  document.getElementById("app");


/* =========================
   優先度
========================= */

function normalizePriority(value){

  if(value === true){
    return 2;
  }

  if(
    value === false ||
    value === undefined ||
    value === null
  ){
    return 0;
  }

  const n = Number(value);

  if(n >= 2) return 2;
  if(n === 1) return 1;

  return 0;

}

function priorityMark(priority){

  const p =
    normalizePriority(priority);

  if(p === 2){

    return {
      mark:"⭐",
      className:"priority-star"
    };

  }

  if(p === 1){

    return {
      mark:"🟡",
      className:"priority-yellow"
    };

  }

  return {
    mark:"☆",
    className:"priority-none"
  };

}

function nextPriority(priority){

  return (
    normalizePriority(priority) + 1
  ) % 3;

}


/* =========================
   データ
========================= */

function safeLoad(){

  try{

    const raw =
      localStorage.getItem(KEY);

    if(!raw) return [];

    const parsed =
      JSON.parse(raw);

    if(!Array.isArray(parsed)){
      return [];
    }

    return parsed.map(
      normalizeCharacter
    );

  }catch(e){

    console.log(
      "データ読み込みエラー",
      e
    );

    return [];

  }

}

function normalizeCharacter(c){

  c = c || {};

  return {

    name:String(c.name || ""),

    image:
      typeof c.image === "string"
      ? c.image
      : "",

    color:
      c.color || "#aaaaaa",

    patterns:
      Array.isArray(c.patterns)
      ? c.patterns.map(
          normalizePattern
        )
      : []

  };

}

function normalizePattern(p){

  p = p || {};

  return {

    name:String(p.name || ""),

    image:
      typeof p.image === "string"
      ? p.image
      : "",

    priority:
      normalizePriority(
        p.priority
      ),

    goods:
      Array.isArray(p.goods)
      ? p.goods.map(
          normalizeGoods
        )
      : []

  };

}

function normalizeGoods(g){

  if(typeof g === "string"){

    return {
      name:g,
      image:"",
      priority:0
    };

  }

  g = g || {};

  return {

    name:String(g.name || ""),

    image:
      typeof g.image === "string"
      ? g.image
      : "",

    priority:
      normalizePriority(
        g.priority
      )

  };

}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );

  }catch(e){

    alert(
      "保存できませんでした。\n" +
      "画像が大きすぎる可能性があります。"
    );

  }

}


/* =========================
   共通
========================= */

function escapeHTML(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function getColor(color){

  const found =
    COLORS.find(
      function(c){
        return c.name === color;
      }
    );

  if(found){
    return found.value;
  }

  if(
    typeof color === "string" &&
    /^#[0-9a-fA-F]{6}$/.test(color)
  ){

    return color;

  }

  return "#aaaaaa";

}

function compressImage(file){

  return new Promise(
    function(resolve){

      if(!file){

        resolve("");

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          const img =
            new Image();

          img.onload =
            function(){

              const max = 600;

              let w = img.width;
              let h = img.height;

              if(w > max || h > max){

                if(w > h){

                  h =
                    Math.round(
                      h * max / w
                    );

                  w = max;

                }else{

                  w =
                    Math.round(
                      w * max / h
                    );

                  h = max;

                }

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width = w;
              canvas.height = h;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );

              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };

          img.onerror =
            function(){

              resolve(
                reader.result
              );

            };

          img.src =
            reader.result;

        };

      reader.onerror =
        function(){

          resolve("");

        };

      reader.readAsDataURL(file);

    }
  );

}

function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

}

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


/* =========================
   メイン描画
========================= */

function render(){

  if(currentCharacter === null){

    renderCharacters();

  }else{

    if(screenshotMode){

      renderScreenshot();

    }else{

      renderCharacter();

    }

  }

}


/* =========================
   キャラ一覧
========================= */

function renderCharacters(){

  let html = `

    <button
      class="add-main"
      data-action="add-character">
      ＋ キャラを追加
    </button>

  `;

  if(data.length === 0){

    html += `

      <div class="empty">
        まだキャラが登録されていません
      </div>

    `;

  }else{

    html += `
      <div class="character-list">
    `;

    data.forEach(
      function(c,index){

        const color =
          getColor(c.color);

        html += `

          <div
            class="character-card"
            data-character="${index}"
            style="--theme:${color}">

            ${
              c.image
              ? `
                <img
                  class="char-image"
                  src="${c.image}"
                  data-photo="${c.image}">
              `
              : `
                <div class="char-image"></div>
              `
            }

            <div class="char-name">

              <span
                class="char-color"
                style="background:${color}">
              </span>

function setColorPicker(color){

  let value = color;

  if(!String(value).startsWith("#")){

    value = getColor(value);

  }

  if(
    !/^#[0-9a-fA-F]{6}$/.test(value)
  ){

    value = "#aaaaaa";

  }

  document
    .getElementById(
      "characterColor"
    )
    .value = value;

  document
    .getElementById(
      "characterColorHex"
    )
    .value =
      value.toUpperCase();

  document
    .getElementById(
      "colorPreview"
    )
    .style.background = value;

}

function openCharacterEditor(index){

  editingCharacter = index;

  const name =
    document.getElementById(
      "characterName"
    );

  const image =
    document.getElementById(
      "characterImage"
    );

  const preview =
    document.getElementById(
      "characterPreview"
    );

  const deleteButton =
    document.getElementById(
      "deleteCharacterButton"
    );

  if(index === -1){

    document
      .getElementById(

    document

async function saveCharacter(){

  const name =
    document
      .getElementById(
        "characterName"
      )
      .value
      .trim();

  if(!name){

    alert(
      "キャラ名を入力してね！"
    );

    return;

  }

  let color =
    document
      .getElementById(
        "characterColor"
      )
      .value;

  const hex =
    document
      .getElementById(
        "characterColorHex"
      )
      .value
      .trim();

  if(
    /^#[0-9a-fA-F]{6}$/.test(hex)
  ){

    color = hex;

  }

  const file =
    document
      .getElementById(
        "characterImage"
      )
      .files[0];

  let image = "";

  if(editingCharacter !== -1){

    image =
      data[editingCharacter]
        .image || "";

  }

  if(file){

    image =
      await compressImage(file);

  }

  if(editingCharacter === -1){

    data.push({

      name:name,
      image:image,
      color:color,
      patterns:[]

    });

  }else{

    const old =
      data[editingCharacter];

    data[editingCharacter] = {

      name:name,
      image:image,
      color:color,
      patterns:
        old.patterns || []

    };

  }

  save();

  closeModal(
    "characterModal"
  );

  currentCharacter = null;
  screenshotMode = false;

  render();

}

function deleteCharacter(){

  if(editingCharacter < 0){
    return;
  }

  const c =
    data[editingCharacter];

  if(
    !confirm(
      "「" +
      c.name +
      "」を削除する？\n\n" +
      "このキャラの絵柄・グッズもすべて削除されます。"
    )
  ){

    return;

  }

  data.splice(
    editingCharacter,
    1
  );

  save();

  closeModal(
    "characterModal"
  );

  editingCharacter = -1;
  currentCharacter = null;
  screenshotMode = false;

  render();

}

/* =========================
   長押し削除
========================= */

let goodsLongPressTimer = null;
let goodsLongPressTarget = null;
let goodsLongPressTriggered = false;

function cancelGoodsLongPress(){

  if(goodsLongPressTimer !== null){

    clearTimeout(
      goodsLongPressTimer
    );

    goodsLongPressTimer = null;

  }

  goodsLongPressTarget = null;

}

function startGoodsLongPress(e){

  const item =
    e.target.closest(
      ".goods-item"
    );

  if(!item){
    return;
  }

  if(
    e.target.closest("button") ||
    e.target.closest("img")
  ){
    return;
  }

  cancelGoodsLongPress();

  goodsLongPressTarget = item;
  goodsLongPressTriggered = false;

  goodsLongPressTimer =
    setTimeout(
      function(){

        if(!goodsLongPressTarget){
          return;
        }

        goodsLongPressTriggered = true;

        const patternIndex =
          Number(
            goodsLongPressTarget
              .dataset
              .goodsPattern
          );

        const goodsIndex =
          Number(
            goodsLongPressTarget
              .dataset
              .goodsIndex
          );

        const p =
          data[currentCharacter]
            .patterns[patternIndex];

        const g =
          p &&
          p.goods
          ? p.goods[goodsIndex]
          : null;

        if(!g){

          cancelGoodsLongPress();

          return;

        }

        if(
          confirm(
            "「" +
            g.name +
            "」を削除する？"
          )
        ){

          p.goods.splice(
            goodsIndex,
            1
          );

          save();

          renderCharacter();

        }

        cancelGoodsLongPress();

      },
      800
    );

}

document.addEventListener(
  "touchstart",
  startGoodsLongPress,
  {passive:true}
);

document.addEventListener(
  "touchend",
  function(){

    if(goodsLongPressTriggered){

      goodsLongPressTriggered = false;
      cancelGoodsLongPress();

      return;

    }

    cancelGoodsLongPress();

  },
  {passive:true}
);

document.addEventListener(
  "touchmove",
  function(){

    cancelGoodsLongPress();

  },
  {passive:true}
);

document.addEventListener(
  "touchcancel",
  function(){

    cancelGoodsLongPress();

  },
  {passive:true}
);

document.addEventListener(
  "contextmenu",
  function(e){

    const item =
      e.target.closest(
        ".goods-item"
      );

    if(!item){
      return;
    }

    if(
      e.target.closest("button") ||
      e.target.closest("img")
    ){
      return;
    }

    e.preventDefault();

    const patternIndex =
      Number(
        item.dataset.goodsPattern
      );

    const goodsIndex =
      Number(
        item.dataset.goodsIndex
      );

    const p =
      data[currentCharacter]
        .patterns[patternIndex];

    const g =
      p &&
      p.goods
      ? p.goods[goodsIndex]
      : null;

    if(!g){
      return;
    }

    if(
      confirm(
        "「" +
        g.name +
        "」を削除する？"
      )
    ){

      p.goods.splice(
        goodsIndex,
        1
      );

      save();

      renderCharacter();

    }

  }
);

/* =========================
   プレビュー
========================= */

function previewFile(
  input,
  preview
){

  input.addEventListener(
    "change",
    function(){

      const file =
        input.files[0];

      if(!file){

        preview.style.display =
          "none";

        return;

      }

      const reader =
        new FileReader();

      reader.onload =
        function(){

          preview.src =
            reader.result;

          preview.style.display =
            "block";

        };

      reader.readAsDataURL(file);

    }
  );

}


/* =========================
   クリック処理
========================= */

document.addEventListener(
  "click",
  function(e){

    const target =
      e.target;

    /* 写真 */

    if(target.dataset.photo){

      e.stopPropagation();

      showPhoto(
        target.dataset.photo
      );

      return;

    }

    /* キャラカード */

    const characterCard =
      target.closest(
        "[data-character]"
      );

    if(
      characterCard &&
      !target.closest("button")
    ){

      currentCharacter =
        Number(
          characterCard.dataset.character
        );

      screenshotMode = false;

      render();

      return;

    }

    /* アクション */

    const actionButton =
      target.closest(
        "[data-action]"
      );

    if(!actionButton){
      return;
    }

    const action =
      actionButton.dataset.action;


    if(action === "add-character"){

      openCharacterEditor(-1);
      return;

    }


    if(action === "close-character"){

      closeModal(
        "characterModal"
      );

      return;

    }


    if(action === "save-character"){

      saveCharacter();
      return;

    }


    if(action === "delete-character"){

      deleteCharacter();
      return;

    }


    if(action === "back"){

      currentCharacter = null;
      screenshotMode = false;

      render();

      return;

    }


    /* ★ スクショ画面へ */

    if(action === "screenshot"){

      screenshotMode = true;

      render();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      return;

    }


    /* ★ スクショ画面から戻る */

    if(action === "screenshot-back"){

      screenshotMode = false;

      renderCharacter();

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      return;

    }


    if(action === "edit-character"){

      openCharacterEditor(
        currentCharacter
      );

      return;

    }


    if(action === "add-pattern"){

      openPatternEditor(-1);
      return;

    }


    if(action === "close-pattern"){

      closeModal(
        "patternModal"
      );

      return;

    }


    if(action === "save-pattern"){

      savePattern();
      return;

    }


    if(action === "edit-pattern"){

      openPatternEditor(
        Number(
          actionButton.dataset.pattern
        )
      );

      return;

    }


    if(action === "delete-pattern"){

      deletePattern(
        Number(
          actionButton.dataset.pattern
        )
      );

      return;

    }


    if(action === "delete-pattern-modal"){

      if(editingPattern !== -1){

        deletePattern(
          editingPattern
        );

        closeModal(
          "patternModal"
        );

      }

      return;

    }


    if(action === "toggle-pattern-priority"){

      togglePatternPriority(
        Number(
          actionButton.dataset.pattern
        )
      );

      return;

    }


    if(action === "add-goods"){

      openGoodsEditor(
        Number(
          actionButton.dataset.pattern
        ),
        -1
      );

      return;

    }


    if(action === "close-goods"){

      closeModal(
        "goodsModal"
      );

      return;

    }


    if(action === "save-goods"){

      saveGoods();
      return;

    }


    if(action === "delete-goods"){

      deleteGoods(
        editingPattern,
        editingGoods
      );

      return;

    }


    if(action === "toggle-goods-priority"){

      toggleGoodsPriority(
        Number(
          actionButton.dataset.pattern
        ),
        Number(
          actionButton.dataset.goods
        )
      );

      return;

    }


    if(action === "close-photo"){

      closePhoto();
      return;

    }

  }
);


/* =========================
   カラーピッカー
========================= */

document
  .getElementById(
    "characterColor"
  )
  .addEventListener(
    "input",
    function(){

      const value =
        this.value.toUpperCase();

      document
        .getElementById(
          "characterColorHex"
        )
        .value = value;

      document
        .getElementById(
          "colorPreview"
        )
        .style.background =
          value;

    }
  );

document
  .getElementById(
    "characterColorHex"
  )
  .addEventListener(
    "input",
    function(){

      let value =
        this.value.trim();

      if(
        !value.startsWith("#")
      ){

        value =
          "#" + value;

      }

      if(
        /^#[0-9a-fA-F]{6}$/
          .test(value)
      ){

        value =
          value.toUpperCase();

        document
          .getElementById(
            "characterColor"
          )
          .value = value;

        document
          .getElementById(
            "colorPreview"
          )
          .style.background =
            value;

      }

    }
  );


/* =========================
   モーダル外側
========================= */

document
  .querySelectorAll(
    ".modal-bg"
  )
  .forEach(
    function(bg){

      bg.addEventListener(
        "click",
        function(e){

          if(e.target === bg){

            bg.classList.remove(
              "show"
            );

          }

        }
      );

    }
  );


/* =========================
   ファイルプレビュー
========================= */

previewFile(
  document.getElementById(
    "characterImage"
  ),
  document.getElementById(
    "characterPreview"
  )
);

previewFile(
  document.getElementById(
    "patternImage"
  ),
  document.getElementById(
    "patternPreview"
  )
);

previewFile(
  document.getElementById(
    "goodsImage"
  ),
  document.getElementById(
    "goodsPreview"
  )
);


/* =========================
   初期化
========================= */

data = safeLoad();

render();

})();

</script>
